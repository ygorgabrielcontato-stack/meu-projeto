<body>


<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>


    <div class="botoes">

        <button
            class="btn-voltar"
            onclick="voltarComunidade()"
        >
            💬 Comunidade
        </button>


        <button
            class="btn-sair"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

</header>


<main>


    <div
        class="voltar"
        onclick="voltarComunidade()"
    >
        ← Voltar para comunidade
    </div>


    <div id="postContainer">

        <div class="carregando">
            Carregando pergunta...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* =====================================
   PEGAR ID DA PERGUNTA NA URL
===================================== */

const parametros =
    new URLSearchParams(window.location.search);


const postId =
    parametros.get("id");


/* =====================================
   CARREGAR PERGUNTA
===================================== */

async function carregarPost() {

    const container =
        document.getElementById("postContainer");


    /* Verifica se recebeu o ID */

    if (!postId) {

        container.innerHTML = `

            <div class="post">

                <div class="erro"
                    style="display:block;">

                    Pergunta não encontrada.

                </div>

            </div>

        `;

        return;
    }


    /* Busca a pergunta */

    const { data: post, error } =
        await window.supabaseClient

            .from("posts")

            .select(`

                id,
                titulo,
                conteudo,
                categoria,
                created_at,

                profiles (
                    nome,
                    username,
                    nivel
                )

            `)

            .eq("id", postId)

            .single();


    /* Erro */

    if (error) {

        console.error(error);


        container.innerHTML = `

            <div class="post">

                <div
                    class="erro"
                    style="display:block;"
                >

                    Erro ao carregar a pergunta.

                    <br><br>

                    ${error.message}

                </div>

            </div>

        `;

        return;
    }


    /* Pergunta não encontrada */

    if (!post) {

        container.innerHTML = `

            <div class="post">

                <div
                    class="erro"
                    style="display:block;"
                >

                    Essa pergunta não existe.

                </div>

            </div>

        `;

        return;
    }


    /* Dados do perfil */

    const nome =
        post.profiles?.nome ||
        "Usuário";


    const username =
        post.profiles?.username ||
        "";


    const nivel =
        post.profiles?.nivel ||
        "Membro";


    /* Mostra a pergunta */

    container.innerHTML = `

        <div class="post">


            <div class="categoria">

                🏷️ ${post.categoria || "Geral"}

            </div>


            <h1>

                ${post.titulo}

            </h1>


            <div class="autor">

                👤 ${nome}

                ${username ? ` · @${username}` : ""}

                · ${nivel}

            </div>


            <div class="conteudo">

                ${post.conteudo}

            </div>


            <hr class="linha">


            <div class="titulo-respostas">

                💬 Respostas

            </div>


            <div id="respostas">

                <div class="carregando">

                    Carregando respostas...

                </div>

            </div>


            <div class="responder">

                <h3>

                    ✍️ Sua resposta

                </h3>


                <textarea
                    id="textoResposta"
                    placeholder="Escreva sua resposta..."
                ></textarea>


                <button
                    onclick="responder()"
                    style="margin-top:10px;"
                >

                    💬 Responder

                </button>


                <div
                    id="mensagem"
                    class="mensagem"
                ></div>

            </div>


        </div>

    `;


    /* Depois carrega as respostas */

    carregarRespostas();

}


/* =====================================
   CARREGAR RESPOSTAS
===================================== */

async function carregarRespostas() {

    const container =
        document.getElementById("respostas");


    const { data, error } =

        await window.supabaseClient

            .from("respostas")

            .select(`

                id,
                conteudo,
                created_at,

                profiles (
                    nome,
                    username
                )

            `)

            .eq("post_id", postId)

            .order("created_at", {

                ascending: true

            });


    /* Erro */

    if (error) {

        console.error(error);


        container.innerHTML = `

            <div
                class="erro"
                style="display:block;"
            >

                Erro ao carregar respostas.

                <br><br>

                ${error.message}

            </div>

        `;

        return;
    }


    /* Nenhuma resposta */

    if (!data || data.length === 0) {

        container.innerHTML = `

            <div class="sem-respostas">

                Nenhuma resposta ainda.

                Seja o primeiro a responder! 👇

            </div>

        `;

        return;
    }


    /* Título */

    container.innerHTML = `

        <h3>

            💬 Respostas (${data.length})

        </h3>

    `;


    /* Mostrar respostas */

    data.forEach(resposta => {

        const nome =
            resposta.profiles?.nome ||
            "Usuário";


        const username =
            resposta.profiles?.username ||
            "";


        const div =
            document.createElement("div");


        div.className =
            "resposta";


        div.innerHTML = `

            <div class="resposta-autor">

                👤 ${nome}

                ${username
                    ? ` · @${username}`
                    : ""
                }

            </div>


            <div class="resposta-texto">

                ${resposta.conteudo}

            </div>

        `;


        container.appendChild(div);

    });

}


/* =====================================
   RESPONDER
===================================== */

async function responder() {

    const campo =
        document.getElementById(
            "textoResposta"
        );


    const texto =
        campo.value.trim();


    /* Verifica texto */

    if (!texto) {

        mostrarMensagem(
            "Escreva uma resposta.",
            "erro"
        );

        return;
    }


    /* Verifica login */

    const {
        data: sessionData,
        error: sessionError

    } =
        await window.supabaseClient
            .auth
            .getSession();


    if (
        sessionError ||
        !sessionData.session
    ) {

        mostrarMensagem(
            "Você precisa estar logado para responder.",
            "erro"
        );

        return;
    }


    const user =
        sessionData.session.user;


    /* Insere resposta */

    const { error } =

        await window.supabaseClient

            .from("respostas")

            .insert({

                post_id: postId,

                author_id: user.id,

                conteudo: texto

            });


    /* Erro */

    if (error) {

        console.error(error);


        mostrarMensagem(

            "Erro ao responder: " +
            error.message,

            "erro"

        );

        return;
    }


    /* Limpa campo */

    campo.value = "";


    /* Mensagem */

    mostrarMensagem(

        "Resposta publicada! 🎉",

        "sucesso"

    );


    /* Atualiza respostas */

    carregarRespostas();

}


/* =====================================
   MOSTRAR MENSAGEM
===================================== */

function mostrarMensagem(
    texto,
    tipo
) {

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.textContent =
        texto;


    mensagem.className =
        "mensagem " + tipo;


    mensagem.style.display =
        "block";


    setTimeout(() => {

        mensagem.style.display =
            "none";

    }, 4000);

}


/* =====================================
   VOLTAR PARA COMUNIDADE
===================================== */

function voltarComunidade() {

    window.location.href =
        "comunidade.html";

}


/* =====================================
   SAIR
===================================== */

async function sair() {

    await window.supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* =====================================
   INICIAR
===================================== */

carregarPost();

</script>


</body>

</html>
