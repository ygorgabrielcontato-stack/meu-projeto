<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pergunta - TechCommunity</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #151936 0%,
                    #0b0d17 45%
                );

            color: white;

            min-height: 100vh;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 70px;

            padding: 0 8%;

            border-bottom: 1px solid #25283a;

            display: flex;

            justify-content: space-between;

            align-items: center;

            background: rgba(11, 13, 23, 0.92);

            backdrop-filter: blur(12px);

            position: sticky;

            top: 0;

            z-index: 10;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #6c63ff;

        }


        .header-botoes {

            display: flex;

            gap: 10px;

        }


        button {

            border: none;

            cursor: pointer;

            font-weight: bold;

        }


        .btn-header {

            background: #171a29;

            color: white;

            border: 1px solid #292d42;

            padding: 10px 16px;

            border-radius: 9px;

            transition: 0.2s;

        }


        .btn-header:hover {

            background: #25283a;

            transform: translateY(-1px);

        }


        /* =========================
           MAIN
        ========================= */

        main {

            width: 92%;

            max-width: 850px;

            margin: 35px auto 70px;

        }


        .voltar {

            background: transparent;

            color: #9da3b8;

            padding: 0;

            margin-bottom: 25px;

            font-size: 15px;

        }


        .voltar:hover {

            color: white;

        }


        /* =========================
           POST
        ========================= */

        .post {

            background: rgba(23, 26, 41, 0.95);

            border: 1px solid #292d42;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

        }


        .post h1 {

            font-size: 30px;

            line-height: 1.4;

            margin: 0 0 14px;

        }


        /* =========================
           AUTOR
        ========================= */

        .autor {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 25px;

        }


        .avatar {

            width: 46px;

            height: 46px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6258e8,
                    #8b82ff
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 19px;

            flex-shrink: 0;

        }


        .autor-info {

            display: flex;

            flex-direction: column;

            gap: 4px;

        }


        .autor-nome {

            font-weight: bold;

        }


        .autor-detalhes {

            color: #8e95aa;

            font-size: 13px;

        }


        /* =========================
           BADGES
        ========================= */

        .badge {

            display: inline-flex;

            align-items: center;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            margin-left: 5px;

        }


        .badge-aluno {

            background: rgba(98, 88, 232, 0.15);

            color: #aaa3ff;

            border: 1px solid rgba(98, 88, 232, 0.3);

        }


        .badge-professor {

            background: rgba(255, 183, 77, 0.12);

            color: #ffc66d;

            border: 1px solid rgba(255, 183, 77, 0.3);

        }


        /* =========================
           CONTEÚDO
        ========================= */

        .post-conteudo {

            color: #d2d5e0;

            font-size: 16px;

            line-height: 1.8;

            white-space: pre-wrap;

        }


        .categoria {

            display: inline-block;

            margin-top: 20px;

            background: #292d42;

            color: #bfc4d6;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;

        }


        .data {

            color: #73798e;

            font-size: 12px;

            margin-left: 8px;

        }


        /* =========================
           AÇÕES
        ========================= */

        .acoes {

            display: flex;

            align-items: center;

            gap: 20px;

            border-top: 1px solid #25283a;

            margin-top: 25px;

            padding-top: 18px;

        }


        .curtida-area {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .botao-coracao {

            background: transparent;

            color: #9da3b8;

            font-size: 32px;

            padding: 0;

            line-height: 1;

            transition:
                transform 0.15s ease,
                color 0.15s ease;

        }


        .botao-coracao:hover {

            transform: scale(1.15);

            color: #ff4f7b;

        }


        .botao-coracao.curtido {

            color: #ff3b6b;

            animation:
                coracao 0.25s ease;

        }


        @keyframes coracao {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.35);
            }

            100% {
                transform: scale(1);
            }

        }


        .contador {

            color: #c8ccda;

            font-size: 14px;

        }


        /* =========================
           RESPOSTAS
        ========================= */

        .respostas-container {

            margin-top: 35px;

        }


        .respostas-container h2 {

            font-size: 22px;

            margin-bottom: 18px;

        }


        .resposta {

            background: #111421;

            border: 1px solid #292d42;

            padding: 20px;

            border-radius: 15px;

            margin-top: 12px;

            transition: 0.2s;

        }


        .resposta:hover {

            border-color: #3b4059;

            transform: translateY(-1px);

        }


        .resposta-topo {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 12px;

        }


        .resposta-avatar {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            background: #292d42;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            flex-shrink: 0;

        }


        .resposta-autor {

            display: flex;

            flex-direction: column;

            gap: 3px;

        }


        .resposta-nome {

            font-weight: bold;

            font-size: 14px;

        }


        .resposta-data {

            color: #73798e;

            font-size: 11px;

        }


        .resposta p {

            color: #c8ccda;

            line-height: 1.6;

            margin: 0;

            white-space: pre-wrap;

        }


        /* =========================
           RESPONDER
        ========================= */

        .responder {

            background: #171a29;

            border: 1px solid #292d42;

            padding: 25px;

            border-radius: 18px;

            margin-top: 28px;

        }


        .responder h2 {

            margin-top: 0;

            font-size: 20px;

        }


        .responder-sub {

            color: #8e95aa;

            font-size: 13px;

            margin-bottom: 15px;

        }


        textarea {

            width: 100%;

            min-height: 120px;

            resize: vertical;

            padding: 14px;

            background: #0d0f19;

            border: 1px solid #30344b;

            border-radius: 10px;

            color: white;

            outline: none;

            font-family: Arial, sans-serif;

            font-size: 14px;

        }


        textarea:focus {

            border-color: #6258e8;

            box-shadow:
                0 0 0 2px
                rgba(98, 88, 232, 0.12);

        }


        .btn-responder {

            margin-top: 12px;

            background: #6258e8;

            color: white;

            padding: 12px 20px;

            border-radius: 9px;

            transition: 0.2s;

        }


        .btn-responder:hover {

            background: #7168f0;

            transform: translateY(-1px);

        }


        /* =========================
           MENSAGENS
        ========================= */

        .mensagem {

            background: #171a29;

            border: 1px solid #292d42;

            padding: 25px;

            border-radius: 15px;

            color: #9da3b8;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {

                padding: 0 5%;

            }


            .logo {

                font-size: 20px;

            }


            .btn-header {

                padding: 8px 10px;

            }


            main {

                width: 94%;

                margin-top: 25px;

            }


            .post {

                padding: 20px;

            }


            .post h1 {

                font-size: 24px;

            }


            .autor {

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


<header>


    <div class="logo">

        Tech<span>Community</span>

    </div>


    <div class="header-botoes">


        <button
            class="btn-header"
            onclick="perfil()"
        >

            👤 Perfil

        </button>


        <button
            class="btn-header"
            onclick="sair()"
        >

            Sair

        </button>


    </div>


</header>



<main>


    <button
        class="voltar"
        onclick="voltarComunidade()"
    >

        ← Voltar para comunidade

    </button>


    <div id="conteudoPagina">

        <div class="mensagem">

            Carregando pergunta...

        </div>

    </div>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>



<script>


/* =================================
   VARIÁVEIS
================================= */

let usuarioLogado = null;

let postId = null;


/* =================================
   PEGAR ID DA URL
================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );


postId =
    parametros.get("id");


/* =================================
   FORMATAR DATA
================================= */

function formatarData(data) {

    if (!data) {

        return "";

    }


    const dataObj =
        new Date(data);


    return dataObj.toLocaleString(
        "pt-BR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =================================
   PEGAR INICIAL
================================= */

function inicial(nome) {

    if (!nome) {

        return "U";

    }


    return nome
        .charAt(0)
        .toUpperCase();

}


/* =================================
   BADGE DO TIPO DE CONTA
================================= */

function badgeTipo(tipo) {

    if (!tipo) {

        return `
            <span class="badge badge-aluno">
                🎓 Aluno
            </span>
        `;

    }


    const tipoNormalizado =
        tipo.toLowerCase();


    if (
        tipoNormalizado.includes(
            "professor"
        )
    ) {

        return `
            <span class="badge badge-professor">
                👨‍🏫 Professor
            </span>
        `;

    }


    return `
        <span class="badge badge-aluno">
            🎓 Aluno
        </span>
    `;

}


/* =================================
   VERIFICAR LOGIN
================================= */

async function verificarLogin() {


    const { data, error } =

        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        mostrarErro(
            "Erro ao verificar login."
        );

        return;

    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return;

    }


    usuarioLogado =
        data.session.user;


    if (!postId) {

        mostrarErro(
            "Pergunta não encontrada."
        );

        return;

    }


    carregarPost();

}


/* =================================
   CARREGAR PERGUNTA
================================= */

async function carregarPost() {


    const { data, error } =

        await window.supabaseClient

            .from("posts")

            .select(`

                id,
                titulo,
                conteudo,
                categoria,
                created_at,

                profiles (

                    nome,
                    username,
                    nivel,
                    tipo_conta

                )

            `)

            .eq(
                "id",
                postId
            )

            .single();


    if (error) {

        console.error(error);

        mostrarErro(
            "Não foi possível carregar essa pergunta."
        );

        return;

    }


    if (!data) {

        mostrarErro(
            "Essa pergunta não existe."
        );

        return;

    }


    const nome =
        data.profiles?.nome ||
        "Usuário";


    const username =
        data.profiles?.username ||
        "usuário";


    const nivel =
        data.profiles?.nivel ||
        "Membro";


    const tipoConta =
        data.profiles?.tipo_conta ||
        "Aluno";


    const categoria =
        data.categoria ||
        "Geral";


    document
        .getElementById(
            "conteudoPagina"
        )
        .innerHTML = `

        <div class="post">


            <h1>

                ${data.titulo}

            </h1>


            <div class="autor">


                <div class="avatar">

                    ${inicial(nome)}

                </div>


                <div class="autor-info">


                    <div class="autor-nome">

                        ${nome}

                        ${badgeTipo(tipoConta)}

                    </div>


                    <div class="autor-detalhes">

                        @${username}

                        · ${nivel}

                        · ${formatarData(
                            data.created_at
                        )}

                    </div>


                </div>


            </div>


            <div class="post-conteudo">

                ${data.conteudo}

            </div>


            <span class="categoria">

                🏷️ ${categoria}

            </span>


            <span class="data">

                ${formatarData(
                    data.created_at
                )}

            </span>


            <div class="acoes">


                <div class="curtida-area">


                    <button

                        id="botaoCurtir"

                        class="botao-coracao"

                        onclick="alternarCurtida()"

                        aria-label="Curtir"

                    >

                        ♡

                    </button>


                    <span
                        id="contadorCurtidas"
                        class="contador"
                    >

                        Carregando...

                    </span>


                </div>


            </div>


        </div>


        <div class="respostas-container">


            <h2>

                💬 Respostas

            </h2>


            <div id="listaRespostas">

                Carregando respostas...

            </div>


        </div>


        <div class="responder">


            <h2>

                Sua resposta

            </h2>


            <div class="responder-sub">

                Ajude quem está começando
                compartilhando seu conhecimento.

            </div>


            <textarea

                id="campoResposta"

                placeholder="Escreva uma resposta..."

            ></textarea>


            <button

                class="btn-responder"

                onclick="responder()"

            >

                💬 Publicar resposta

            </button>


        </div>

    `;


    carregarCurtida();

    carregarRespostas();

}


/* =================================
   CARREGAR CURTIDA
================================= */

async function carregarCurtida() {


    const contador =
        document.getElementById(
            "contadorCurtidas"
        );


    const botao =
        document.getElementById(
            "botaoCurtir"
        );


    if (!contador || !botao) {

        return;

    }


    const { data, error } =

        await window.supabaseClient

            .from("curtidas")

            .select("user_id")

            .eq(
                "post_id",
                postId
            );


    if (error) {

        console.error(error);

        contador.textContent =
            "Erro";

        return;

    }


    const quantidade =
        data?.length || 0;


    contador.textContent =

        quantidade === 1

            ? "1 curtida"

            : `${quantidade} curtidas`;


    const curtiu =

        data?.some(

            curtida =>

                curtida.user_id ===
                usuarioLogado.id

        );


    if (curtiu) {

        botao.textContent =
            "♥";

        botao.classList.add(
            "curtido"
        );

    }

    else {

        botao.textContent =
            "♡";

        botao.classList.remove(
            "curtido"
        );

    }

}


/* =================================
   CURTIR / DESCURTIR
================================= */

async function alternarCurtida() {


    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;

    }


    const { data, error } =

        await window.supabaseClient

            .from("curtidas")

            .select("id")

            .eq(
                "post_id",
                postId
            )

            .eq(
                "user_id",
                usuarioLogado.id
            );


    if (error) {

        console.error(error);

        alert(
            "Erro ao verificar curtida: " +
            error.message
        );

        return;

    }


    if (
        data &&
        data.length > 0
    ) {


        const { error: deleteError } =

            await window.supabaseClient

                .from("curtidas")

                .delete()

                .eq(
                    "id",
                    data[0].id
                );


        if (deleteError) {

            console.error(
                deleteError
            );

            alert(
                "Erro ao remover curtida: " +
                deleteError.message
            );

            return;

        }

    }


    else {


        const { error: insertError } =

            await window.supabaseClient

                .from("curtidas")

                .insert({

                    post_id:
                        postId,

                    user_id:
                        usuarioLogado.id

                });


        if (insertError) {

            console.error(
                insertError
            );

            alert(
                "Erro ao curtir: " +
                insertError.message
            );

            return;

        }

    }


    carregarCurtida();

}


/* =================================
   CARREGAR RESPOSTAS
================================= */

async function carregarRespostas() {


    const container =
        document.getElementById(
            "listaRespostas"
        );


    if (!container) {

        return;

    }


    const { data, error } =

        await window.supabaseClient

            .from("respostas")

            .select(`

                id,
                conteudo,
                created_at,

                profiles (

                    nome,
                    username,
                    nivel,
                    tipo_conta

                )

            `)

            .eq(
                "post_id",
                postId
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML = `

            <div class="mensagem">

                Erro ao carregar respostas.

            </div>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        container.innerHTML = `

            <div class="mensagem">

                Ainda não existem respostas.

                <br><br>

                Seja o primeiro a ajudar! 🚀

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    data.forEach(
        resposta => {


            const nome =

                resposta
                    .profiles
                    ?.nome ||

                "Usuário";


            const username =

                resposta
                    .profiles
                    ?.username ||

                "usuário";


            const nivel =

                resposta
                    .profiles
                    ?.nivel ||

                "Membro";


            const tipoConta =

                resposta
                    .profiles
                    ?.tipo_conta ||

                "Aluno";


            const div =

                document.createElement(
                    "div"
                );


            div.className =
                "resposta";


            div.innerHTML = `

                <div class="resposta-topo">


                    <div class="resposta-avatar">

                        ${inicial(nome)}

                    </div>


                    <div class="resposta-autor">


                        <div class="resposta-nome">

                            ${nome}

                            ${badgeTipo(
                                tipoConta
                            )}

                        </div>


                        <div class="resposta-data">

                            @${username}

                            · ${nivel}

                            · ${formatarData(
                                resposta.created_at
                            )}

                        </div>


                    </div>


                </div>


                <p>

                    ${resposta.conteudo}

                </p>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =================================
   RESPONDER
================================= */

async function responder() {


    const campo =

        document.getElementById(
            "campoResposta"
        );


    if (!campo) {

        return;

    }


    const conteudo =
        campo.value.trim();


    if (!conteudo) {

        alert(
            "Escreva uma resposta."
        );

        return;

    }


    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;

    }


    const { error } =

        await window.supabaseClient

            .from("respostas")

            .insert({

                post_id:
                    postId,

                author_id:
                    usuarioLogado.id,

                conteudo:
                    conteudo

            });


    if (error) {

        console.error(error);

        alert(

            "Erro ao publicar resposta: " +
            error.message

        );

        return;

    }


    campo.value = "";


    alert(
        "Resposta publicada! 🎉"
    );


    carregarRespostas();

}


/* =================================
   VOLTAR
================================= */

function voltarComunidade() {

    window.location.href =
        "comunidade.html";

}


/* =================================
   PERFIL
================================= */

function perfil() {

    window.location.href =
        "perfil.html";

}


/* =================================
   SAIR
================================= */

async function sair() {

    await window.supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* =================================
   ERRO
================================= */

function mostrarErro(mensagem) {

    document
        .getElementById(
            "conteudoPagina"
        )
        .innerHTML = `

        <div class="mensagem">

            ❌ ${mensagem}

            <br><br>

            <button
                class="btn-header"
                onclick="voltarComunidade()"
            >

                ← Voltar para comunidade

            </button>

        </div>

    `;

}


/* =================================
   INICIAR
================================= */

verificarLogin();

</script>


</body>

</html>
