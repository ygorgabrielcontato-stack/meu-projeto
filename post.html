```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pergunta - TechCommunity</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d17;
            color: white;
        }

        header {
            padding: 20px 8%;

            color: #6c63ff;

        button {

        main {

<body>

<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>

    <div class="botoes-header">

        <button class="voltar" onclick="voltarComunidade()">
            💬 Comunidade
        </button>

        <button class="sair" onclick="sair()">
            Sair
        </button>

    </div>

</header>


<main>

    <div class="voltar-link" onclick="voltarComunidade()">
        ← Voltar para comunidade
    </div>


    <div id="postContainer">

        <div class="carregando">
            Carregando pergunta...
        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

    /* =====================================
       PEGAR ID DA PERGUNTA
    ===================================== */

    const parametros = new URLSearchParams(
        window.location.search
    );

    const postId = parametros.get("id");


    /* =====================================
       CARREGAR PERGUNTA
    ===================================== */

    async function carregarPost() {

        const container =
            document.getElementById("postContainer");


        if (!postId) {

            container.innerHTML = `
                <div class="post">
                    <div class="erro">
                        Pergunta não encontrada.
                    </div>
                </div>
            `;

            return;
        }


        const { data: post, error } =
            await window.supabaseClient
                .from("posts")
                .select("*")
                .eq("id", postId)
                .single();


        if (error) {

            console.error(error);

            container.innerHTML = `
                <div class="post">
                    <div class="erro">
                        Erro ao carregar a pergunta.
                        <br><br>
                        ${error.message}
                    </div>
                </div>
            `;

            return;
        }


        if (!post) {

            container.innerHTML = `
                <div class="post">
                    <div class="erro">
                        Essa pergunta não existe.
                    </div>
                </div>
            `;

            return;
        }


        const titulo =
            post.titulo ||
            post.title ||
            "Sem título";


        const conteudo =
            post.conteudo ||
            post.content ||
            post.descricao ||
            post.description ||
            "";


        const categoria =
            post.categoria ||
            post.category ||
            "Geral";


        const autor =
            post.username ||
            post.autor ||
            post.nome ||
            "Usuário";


        container.innerHTML = `

            <div class="post">

                <div class="categoria">
                    🏷️ ${categoria}
                </div>

                <h1>
                    ${titulo}
                </h1>

                <div class="autor">
                    👤 ${autor}
                </div>

                <div class="conteudo">
                    ${conteudo}
                </div>

                <hr class="separador">

                <div class="titulo-respostas">
                    💬 Respostas
                </div>

                <div id="respostas">
                    <div class="carregando">
                        Carregando respostas...
                    </div>
                </div>

                <div class="form-resposta">

                    <textarea
                        id="textoResposta"
                        placeholder="Escreva sua resposta..."
                    ></textarea>

                    <button
                        class="botao-responder"
                        onclick="enviarResposta()"
                    >
                        💬 Responder
                    </button>

                    <div
                        id="mensagem"
                        class="mensagem"
                    ></div>

                </div>

            </div>

        `;


        carregarRespostas();

    }


    /* =====================================
       CARREGAR RESPOSTAS
    ===================================== */

    async function carregarRespostas() {

        const container =
            document.getElementById("respostas");


        const { data: respostas, error } =
            await window.supabaseClient
                .from("respostas")
                .select("*")
                .eq("post_id", postId)
                .order("created_at", {
                    ascending: true
                });


        if (error) {

            console.error(error);

            container.innerHTML = `
                <div class="erro">
                    Erro ao carregar respostas.
                    <br><br>
                    ${error.message}
                </div>
            `;

            return;
        }


        if (!respostas || respostas.length === 0) {

            container.innerHTML = `
                <div class="sem-respostas">
                    Ainda não existem respostas.
                    Seja o primeiro a responder! 👇
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        respostas.forEach(resposta => {

            const autor =
                resposta.username ||
                resposta.autor ||
                resposta.nome ||
                "Usuário";


            const texto =
                resposta.conteudo ||
                resposta.content ||
                resposta.texto ||
                "";


            const elemento =
                document.createElement("div");


            elemento.className =
                "resposta";


            elemento.innerHTML = `

                <div class="resposta-autor">
                    👤 ${autor}
                </div>

                <div class="resposta-texto">
                    ${texto}
                </div>

            `;


            container.appendChild(elemento);

        });

    }


    /* =====================================
       ENVIAR RESPOSTA
    ===================================== */

    async function enviarResposta() {

        const textarea =
            document.getElementById("textoResposta");


        const mensagem =
            document.getElementById("mensagem");


        const texto =
            textarea.value.trim();


        if (!texto) {

            mostrarMensagem(
                "Digite uma resposta antes de enviar.",
                "erro"
            );

            return;
        }


        const {
            data: sessionData,
            error: sessionError
        } =
            await window.supabaseClient.auth.getSession();


        if (sessionError || !sessionData.session) {

            mostrarMensagem(
                "Você precisa estar logado para responder.",
                "erro"
            );

            return;
        }


        const user =
            sessionData.session.user;


        const { data: perfil } =
            await window.supabaseClient
                .from("profiles")
                .select("nome, username")
                .eq("id", user.id)
                .single();


        const nome =
            perfil?.nome ||
            perfil?.username ||
            "Usuário";


        const username =
            perfil?.username ||
            nome;


        const { error } =
            await window.supabaseClient
                .from("respostas")
                .insert([

                    {
                        post_id: postId,
                        user_id: user.id,
                        username: username,
                        nome: nome,
                        conteudo: texto
                    }

                ]);


        if (error) {

            console.error(error);

            mostrarMensagem(
                "Erro ao enviar resposta: " +
                error.message,
                "erro"
            );

            return;
        }


        textarea.value = "";


        mostrarMensagem(
            "Resposta enviada com sucesso! ✅",
            "sucesso"
        );


        carregarRespostas();

    }


    /* =====================================
       MENSAGEM
    ===================================== */

    function mostrarMensagem(texto, tipo) {

        const mensagem =
            document.getElementById("mensagem");


        mensagem.textContent =
            texto;


        mensagem.className =
            "mensagem " + tipo;


        mensagem.style.display =
            "block";


        setTimeout(() => {

            mensagem.style.display =
                "none";

        }, 4000);

    }


    /* =====================================
       COMUNIDADE
    ===================================== */

    function voltarComunidade() {

        window.location.href =
            "comunidade.html";

    }


    /* =====================================
       SAIR
    ===================================== */

    async function sair() {

        await window.supabaseClient.auth.signOut();

        window.location.href =
            "index.html";

    }


    /* =====================================
       INICIAR
    ===================================== */

    carregarPost();

</script>

</body>

</html>
