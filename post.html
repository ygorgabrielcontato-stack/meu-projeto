<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pergunta - TechCommunity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #0b0d17;

            color: white;

        }


        header {

            padding: 20px 8%;

            border-bottom: 1px solid #25283a;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #6c63ff;

        }


        .header-botoes {

            display: flex;

            gap: 10px;

        }


        button {

            background: #6258e8;

            border: none;

            color: white;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

        }


        button:hover {

            opacity: 0.9;

        }


        .btn-voltar {

            background: #292d42;

        }


        main {

            width: 90%;

            max-width: 900px;

            margin: 40px auto 80px;

        }


        .voltar {

            color: #9da3b8;

            cursor: pointer;

            margin-bottom: 25px;

            display: inline-block;

        }


        .voltar:hover {

            color: white;

        }


        .post {

            background: #171a29;

            border: 1px solid #292d42;

            border-radius: 18px;

            padding: 30px;

        }


        .categoria {

            display: inline-block;

            background: #292d42;

            color: #aaa5ff;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

            margin-bottom: 15px;

        }


        .post h1 {

            font-size: 30px;

            margin: 5px 0 15px;

        }


        .autor {

            color: #8e95aa;

            font-size: 14px;

            margin-bottom: 25px;

        }


        .conteudo {

            color: #d0d3df;

            font-size: 16px;

            line-height: 1.7;

            white-space: pre-wrap;

        }


        .separador {

            border: none;

            border-top: 1px solid #292d42;

            margin: 30px 0;

        }


        .titulo-respostas {

            font-size: 22px;

            margin-bottom: 20px;

        }


        .resposta {

            background: #0d0f19;

            border: 1px solid #25283a;

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 15px;

        }


        .resposta-topo {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }


        .autor-resposta {

            font-weight: bold;

        }


        .tipo-professor {

            display: inline-block;

            margin-left: 7px;

            background: #6258e8;

            color: white;

            padding: 4px 8px;

            border-radius: 12px;

            font-size: 11px;

        }


        .resposta-conteudo {

            color: #c8ccda;

            line-height: 1.6;

            margin: 15px 0;

            white-space: pre-wrap;

        }


        /* =========================
           CURTIDA
        ========================= */


        .acoes-resposta {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .curtir {

            background: transparent;

            border: none;

            padding: 4px 6px;

            display: flex;

            align-items: center;

            gap: 5px;

            color: #8e95aa;

            font-size: 16px;

            cursor: pointer;

        }


        .curtir:hover {

            background: transparent;

            opacity: 1;

        }


        .coracao {

            font-size: 25px;

            line-height: 1;

            transition:
                transform 0.15s ease,
                color 0.15s ease;

        }


        .coracao.vazio {

            color: #9da3b8;

        }


        .coracao.curtiu {

            color: #ff3040;

        }


        .curtir.animar .coracao {

            animation: bater 0.3s ease;

        }


        @keyframes bater {

            0% {

                transform: scale(1);

            }

            40% {

                transform: scale(1.35);

            }

            70% {

                transform: scale(0.9);

            }

            100% {

                transform: scale(1);

            }

        }


        .contador {

            font-size: 14px;

            color: #8e95aa;

        }


        .responder {

            margin-top: 30px;

            background: #171a29;

            border: 1px solid #292d42;

            border-radius: 15px;

            padding: 25px;

        }


        .responder h2 {

            margin-top: 0;

        }


        textarea {

            width: 100%;

            min-height: 120px;

            resize: vertical;

            padding: 14px;

            background: #0d0f19;

            border: 1px solid #30344b;

            border-radius: 8px;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 15px;

            outline: none;

        }


        textarea:focus {

            border-color: #6258e8;

        }


        .btn-responder {

            margin-top: 12px;

        }


        .carregando {

            text-align: center;

            color: #9da3b8;

            padding: 40px;

        }


        .erro {

            background: #301820;

            border: 1px solid #6b2636;

            color: #ff9da9;

            padding: 20px;

            border-radius: 10px;

        }


        .sem-respostas {

            color: #8e95aa;

            padding: 15px 0;

        }


        @media (max-width: 600px) {

            header {

                padding: 15px 5%;

            }


            .logo {

                font-size: 20px;

            }


            .header-botoes button {

                padding: 9px 12px;

            }


            main {

                width: 94%;

                margin-top: 25px;

            }


            .post {

                padding: 20px;

            }


            .post h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        Tech<span>Community</span>

    </div>


    <div class="header-botoes">

        <button
            class="btn-voltar"
            onclick="voltarComunidade()">

            ← Comunidade

        </button>


        <button onclick="perfil()">

            👤 Perfil

        </button>

    </div>

</header>


<main>


    <div
        class="voltar"
        onclick="voltarComunidade()">

        ← Voltar para comunidade

    </div>


    <div id="conteudoPost">

        <div class="carregando">

            Carregando pergunta...

        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* ================================
   PEGAR ID DA PERGUNTA
================================ */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const postId =
    parametros.get("id");


let usuarioAtual = null;


/* ================================
   VERIFICAR LOGIN
================================ */

async function verificarLogin() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        mostrarErro(
            "Erro ao verificar login."
        );

        return;

    }


    usuarioAtual =
        data.session?.user;


    if (!usuarioAtual) {

        window.location.href =
            "index.html";

        return;

    }


    if (!postId) {

        mostrarErro(
            "Pergunta não encontrada."
        );

        return;

    }


    carregarPost();

}


/* ================================
   CARREGAR PERGUNTA
================================ */

async function carregarPost() {

    const container =
        document.getElementById(
            "conteudoPost"
        );


    const { data, error } =
        await window.supabaseClient

            .from("posts")

            .select(`
                id,
                titulo,
                conteudo,
                categoria,
                created_at,
                profiles (
                    nome,
                    username,
                    nivel,
                    tipo_conta
                )
            `)

            .eq("id", postId)

            .single();


    if (error) {

        console.error(error);

        mostrarErro(
            "Erro ao carregar a pergunta."
        );

        return;

    }


    const nome =
        data.profiles?.nome ||
        "Usuário";


    const username =
        data.profiles?.username ||
        "usuario";


    const nivel =
        data.profiles?.nivel ||
        "Membro";


    const tipoConta =
        data.profiles?.tipo_conta ||
        "Aluno";


    container.innerHTML = `

        <article class="post">

            <div class="categoria">

                ${data.categoria}

            </div>


            <h1>

                ${data.titulo}

            </h1>


            <div class="autor">

                👤 ${nome}

                · @${username}

                · ${nivel}

                · ${tipoConta}

            </div>


            <div class="conteudo">

                ${data.conteudo}

            </div>

        </article>


        <hr class="separador">


        <section>

            <h2 class="titulo-respostas">

                💬 Respostas

                <span id="contadorRespostas">
                    ...
                </span>

            </h2>


            <div id="listaRespostas">

                <div class="carregando">

                    Carregando respostas...

                </div>

            </div>

        </section>


        <section class="responder">

            <h2>

                Sua resposta

            </h2>


            <textarea
                id="campoResposta"
                placeholder="Escreva uma resposta para ajudar quem fez a pergunta...">
            </textarea>


            <button
                class="btn-responder"
                onclick="responder()">

                💬 Publicar resposta

            </button>

        </section>

    `;


    carregarRespostas();

}


/* ================================
   CARREGAR RESPOSTAS
================================ */

async function carregarRespostas() {

    const container =
        document.getElementById(
            "listaRespostas"
        );


    const { data, error } =
        await window.supabaseClient

            .from("respostas")

            .select(`
                id,
                conteudo,
                created_at,
                profiles (
                    nome,
                    username,
                    nivel,
                    tipo_conta
                )
            `)

            .eq("post_id", postId)

            .order("created_at", {
                ascending: true
            });


    if (error) {

        console.error(error);

        container.innerHTML = `

            <div class="erro">

                Erro ao carregar respostas.

            </div>

        `;

        return;

    }


    document.getElementById(
        "contadorRespostas"
    ).textContent =
        `(${data?.length || 0})`;


    if (!data || data.length === 0) {

        container.innerHTML = `

            <div class="sem-respostas">

                Nenhuma resposta ainda.
                Seja o primeiro a ajudar! 🚀

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    for (const resposta of data) {

        const nome =
            resposta.profiles?.nome ||
            "Usuário";


        const tipoConta =
            resposta.profiles?.tipo_conta ||
            "Aluno";


        const div =
            document.createElement("div");


        div.className =
            "resposta";


        div.innerHTML = `

            <div class="resposta-topo">

                <div>

                    <span class="autor-resposta">

                        👤 ${nome}

                    </span>


                    ${
                        tipoConta
                            .toLowerCase()
                            .includes("professor")

                        ?

                        `<span class="tipo-professor">
                            👨‍🏫 Professor
                        </span>`

                        :

                        ""
                    }

                </div>


                <div class="acoes-resposta">

                    <button
                        class="curtir"
                        id="curtir-${resposta.id}"
                        onclick="curtirResposta('${resposta.id}')">

                        <span
                            class="coracao vazio"
                            id="coracao-${resposta.id}">

                            ♡

                        </span>


                        <span
                            class="contador"
                            id="contador-${resposta.id}">

                            0

                        </span>

                    </button>

                </div>

            </div>


            <div class="resposta-conteudo">

                ${resposta.conteudo}

            </div>

        `;


        container.appendChild(div);


        carregarCurtidas(resposta.id);

    }

}


/* ================================
   CARREGAR CURTIDAS
================================ */

async function carregarCurtidas(
    respostaId
) {

    const { data, error } =
        await window.supabaseClient

            .from("curtidas_respostas")

            .select(
                "user_id"
            )

            .eq(
                "resposta_id",
                respostaId
            );


    if (error) {

        console.error(
            "Erro ao carregar curtidas:",
            error
        );

        return;

    }


    const contador =
        document.getElementById(
            `contador-${respostaId}`
        );


    const coracao =
        document.getElementById(
            `coracao-${respostaId}`
        );


    if (!contador || !coracao) {

        return;

    }


    const quantidade =
        data?.length || 0;


    contador.textContent =
        quantidade;


    const usuarioCurtiu =
        data?.some(
            curtida =>
                curtida.user_id ===
                usuarioAtual.id
        );


    if (usuarioCurtiu) {

        coracao.textContent =
            "♥";

        coracao.classList.remove(
            "vazio"
        );

        coracao.classList.add(
            "curtiu"
        );

    }

}


/* ================================
   CURTIR / DESCURTIR
================================ */

async function curtirResposta(
    respostaId
) {

    if (!usuarioAtual) {

        alert(
            "Você precisa estar logado."
        );

        return;

    }


    const botao =
        document.getElementById(
            `curtir-${respostaId}`
        );


    const coracao =
        document.getElementById(
            `coracao-${respostaId}`
        );


    const contador =
        document.getElementById(
            `contador-${respostaId}`
        );


    if (
        !botao ||
        !coracao ||
        !contador
    ) {

        return;

    }


    const jaCurtiu =
        coracao.classList.contains(
            "curtiu"
        );


    /* ==========================
       DESCURTIR
    ========================== */

    if (jaCurtiu) {

        const { error } =
            await window.supabaseClient

                .from("curtidas_respostas")

                .delete()

                .eq(
                    "resposta_id",
                    respostaId
                )

                .eq(
                    "user_id",
                    usuarioAtual.id
                );


        if (error) {

            console.error(error);

            alert(
                "Erro ao remover curtida: " +
                error.message
            );

            return;

        }


        coracao.textContent =
            "♡";


        coracao.classList.remove(
            "curtiu"
        );


        coracao.classList.add(
            "vazio"
        );


        contador.textContent =
            Math.max(
                0,
                parseInt(
                    contador.textContent
                ) - 1
            );


        return;

    }


    /* ==========================
       CURTIR
    ========================== */

    const { error } =
        await window.supabaseClient

            .from("curtidas_respostas")

            .insert({

                resposta_id:
                    respostaId,

                user_id:
                    usuarioAtual.id

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao curtir: " +
            error.message
        );

        return;

    }


    coracao.textContent =
        "♥";


    coracao.classList.remove(
        "vazio"
    );


    coracao.classList.add(
        "curtiu"
    );


    contador.textContent =
        parseInt(
            contador.textContent
        ) + 1;


    /* Animação */

    botao.classList.remove(
        "animar"
    );


    void botao.offsetWidth;


    botao.classList.add(
        "animar"
    );

}


/* ================================
   RESPONDER
================================ */

async function responder() {

    const campo =
        document.getElementById(
            "campoResposta"
        );


    const conteudo =
        campo.value.trim();


    if (!conteudo) {

        alert(
            "Escreva uma resposta."
        );

        return;

    }


    if (!usuarioAtual) {

        alert(
            "Você precisa estar logado."
        );

        return;

    }


    const { error } =
        await window.supabaseClient

            .from("respostas")

            .insert({

                post_id:
                    postId,

                author_id:
                    usuarioAtual.id,

                conteudo:
                    conteudo

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao publicar resposta: " +
            error.message
        );

        return;

    }


    campo.value = "";


    alert(
        "Resposta publicada! 🎉"
    );


    carregarRespostas();

}


/* ================================
   NAVEGAÇÃO
================================ */

function voltarComunidade() {

    window.location.href =
        "comunidade.html";

}


function perfil() {

    window.location.href =
        "perfil.html";

}


/* ================================
   ERRO
================================ */

function mostrarErro(
    mensagem
) {

    document.getElementById(
        "conteudoPost"
    ).innerHTML = `

        <div class="erro">

            ${mensagem}

        </div>

    `;

}


/* ================================
   INICIAR
================================ */

verificarLogin();

</script>

</body>

</html>
