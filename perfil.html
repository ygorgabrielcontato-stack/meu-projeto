<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - TechCommunity</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d17;
            color: white;
        }

        header {
            padding: 20px 8%;
            border-bottom: 1px solid #25283a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        .botoes-header {
            display: flex;
            gap: 10px;
        }

        button {
            background: #6258e8;
            border: none;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .sair {
            background: #292d42;
        }

        main {
            width: 80%;
            max-width: 800px;
            margin: 50px auto;
        }

        .perfil {
            background: #171a29;
            border: 1px solid #292d42;
            border-radius: 18px;
            padding: 35px;
        }

        .topo-perfil {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #6258e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .username {
            color: #8e95aa;
            margin-bottom: 25px;
        }

        .tipo {
            display: inline-block;
            background: #292d42;
            padding: 8px 14px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .informacoes {
            border-top: 1px solid #292d42;
            padding-top: 20px;
        }

        .informacao {
            background: #0d0f19;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .label {
            color: #8e95aa;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .valor {
            font-size: 17px;
        }

        .carregando {
            text-align: center;
            color: #9da3b8;
        }

        .erro {
            background: #301820;
            border: 1px solid #6b2636;
            padding: 20px;
            border-radius: 10px;
            color: #ff9da9;
        }

        .acoes {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>

    <div class="botoes-header">

        <button onclick="voltarComunidade()">
            💬 Comunidade
        </button>

        <button class="sair" onclick="sair()">
            Sair
        </button>

    </div>

</header>


<main>

    <div id="perfil" class="perfil">

        <div class="carregando">
            Carregando perfil...
        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

/* ================================
   CARREGAR PERFIL
================================ */

async function carregarPerfil() {

    const container =
        document.getElementById("perfil");


    const { data: sessionData, error: sessionError } =
        await window.supabaseClient.auth.getSession();


    if (sessionError) {

        console.error(sessionError);

        container.innerHTML = `
            <div class="erro">
                Erro ao verificar login.
            </div>
        `;

        return;
    }


    const user =
        sessionData.session?.user;


    if (!user) {

        window.location.href = "index.html";

        return;
    }


    const { data, error } =
        await window.supabaseClient
            .from("profiles")
            .select(`
                nome,
                username,
                curso,
                semestre,
                nivel,
                tipo_conta
            `)
            .eq("id", user.id)
            .single();


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="erro">
                <strong>Erro ao carregar perfil.</strong>
                <br><br>
                ${error.message}
            </div>
        `;

        return;
    }


    const nome =
        data.nome || "Usuário";


    const username =
        data.username || "usuário";


    const curso =
        data.curso || "Não informado";


    const semestre =
        data.semestre || "Não informado";


    const nivel =
        data.nivel || "Não informado";


    const tipoConta =
        data.tipo_conta || "Aluno";


    const inicial =
        nome.charAt(0).toUpperCase();


    let icone = "👨‍🎓";


    if (
        tipoConta.toLowerCase() === "professor"
    ) {

        icone = "👨‍🏫";

    }


    container.innerHTML = `

        <div class="topo-perfil">

            <div>

                <div class="avatar">
                    ${inicial}
                </div>

                <h1>
                    ${nome}
                </h1>

                <div class="username">
                    @${username}
                </div>

                <div class="tipo">
                    ${icone} ${tipoConta}
                    · ${nivel}
                </div>

            </div>

        </div>


        <div class="informacoes">

            <div class="informacao">

                <div class="label">
                    🎓 CURSO
                </div>

                <div class="valor">
                    ${curso}
                </div>

            </div>


            <div class="informacao">

                <div class="label">
                    📚 SEMESTRE
                </div>

                <div class="valor">
                    ${semestre}
                </div>

            </div>


            <div class="informacao">

                <div class="label">
                    👤 TIPO DE CONTA
                </div>

                <div class="valor">
                    ${tipoConta}
                </div>

            </div>


            <div class="informacao">

                <div class="label">
                    📊 NÍVEL
                </div>

                <div class="valor">
                    ${nivel}
                </div>

            </div>

        </div>


        <div class="acoes">

            <button onclick="editarPerfil()">
                ✏️ Editar Perfil
            </button>

            <button onclick="voltarComunidade()">
                💬 Ir para Comunidade
            </button>

        </div>

    `;
}


/* ================================
   EDITAR PERFIL
================================ */

function editarPerfil() {

    window.location.href =
        "editar-perfil.html";

}


/* ================================
   VOLTAR PARA COMUNIDADE
================================ */

function voltarComunidade() {

    window.location.href =
        "comunidade.html";

}


/* ================================
   SAIR
================================ */

async function sair() {

    await window.supabaseClient.auth.signOut();

    window.location.href =
        "index.html";

}


/* ================================
   INICIAR
================================ */

carregarPerfil();

</script>

</body>

</html>
