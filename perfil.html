<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - TechCommunity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #171a35 0%, #0b0d17 45%);
            color: white;
        }

        header {
            height: 70px;
            padding: 0 8%;
            border-bottom: 1px solid #25283a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 13, 23, 0.92);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        .header-botoes {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-header {
            background: #171a29;
            color: white;
            border: 1px solid #292d42;
            padding: 10px 16px;
            border-radius: 9px;
        }

        .btn-header:hover {
            background: #25283a;
            transform: translateY(-1px);
        }

        main {
            width: 92%;
            max-width: 950px;
            margin: 40px auto 80px;
        }

        /* =========================
           PERFIL
        ========================= */

        .perfil-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(28, 31, 53, 0.96),
                    rgba(17, 20, 33, 0.96)
                );

            border: 1px solid #292d42;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .perfil-topo {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* =========================
           FOTO
        ========================= */

        .foto-area {
            position: relative;
            flex-shrink: 0;
        }

        .foto-perfil {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6258e8;
            background: #292d42;
            display: block;
        }

        .btn-foto {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #6258e8;
            border: 3px solid #111421;
            color: white;
            font-size: 16px;
        }

        .btn-foto:hover {
            background: #766df1;
            transform: scale(1.08);
        }

        .info-principal h1 {
            margin: 0 0 7px;
            font-size: 30px;
        }

        .username {
            color: #9da3b8;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            background: rgba(98, 88, 232, 0.18);
            color: #aaa5ff;
            font-size: 12px;
            border: 1px solid rgba(98, 88, 232, 0.35);
        }

        /* =========================
           BIO
        ========================= */

        .bio {
            margin-top: 30px;
            color: #c8ccda;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .sem-bio {
            color: #777e94;
            font-style: italic;
        }

        /* =========================
           INFORMAÇÕES
        ========================= */

        .informacoes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 28px;
        }

        .info-box {
            background: #0d0f19;
            border: 1px solid #25283a;
            border-radius: 13px;
            padding: 17px;
        }

        .info-label {
            display: block;
            color: #777e94;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .info-valor {
            color: #e4e6ef;
            font-weight: bold;
            font-size: 14px;
        }

        /* =========================
           EDITAR
        ========================= */

        .editar-area {
            margin-top: 30px;
            border-top: 1px solid #292d42;
            padding-top: 25px;
        }

        .editar-area h2 {
            margin-top: 0;
        }

        .campo {
            margin-bottom: 17px;
        }

        .campo label {
            display: block;
            color: #c8ccda;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            background: #0d0f19;
            border: 1px solid #30344b;
            border-radius: 10px;
            color: white;
            padding: 13px;
            outline: none;
            font-family: Arial, sans-serif;
        }

        input:focus,
        textarea:focus {
            border-color: #6258e8;
            box-shadow: 0 0 0 3px rgba(98, 88, 232, 0.12);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .botoes-edicao {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-salvar {
            background: #6258e8;
            color: white;
            padding: 12px 20px;
            border-radius: 9px;
        }

        .btn-salvar:hover {
            background: #7168f0;
            transform: translateY(-1px);
        }

        .btn-cancelar {
            background: #292d42;
            color: white;
            padding: 12px 20px;
            border-radius: 9px;
        }

        .btn-cancelar:hover {
            background: #363b54;
        }

        /* =========================
           PERGUNTAS
        ========================= */

        .perguntas-section {
            margin-top: 40px;
        }

        .titulo-secao {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .titulo-secao h2 {
            margin: 0;
            font-size: 23px;
        }

        .contador {
            background: #292d42;
            color: #aaa5ff;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        .pergunta {
            background: #111421;
            border: 1px solid #292d42;
            border-radius: 17px;
            padding: 22px;
            margin-bottom: 15px;
            transition: 0.2s;
        }

        .pergunta:hover {
            border-color: #4a4f70;
            transform: translateY(-2px);
        }

        .pergunta h3 {
            margin: 0 0 9px;
            font-size: 19px;
        }

        .pergunta-info {
            color: #8e95aa;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .pergunta-conteudo {
            color: #c8ccda;
            line-height: 1.6;
            white-space: pre-wrap;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .pergunta-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .btn-ver {
            background: #292d42;
            color: white;
            padding: 9px 15px;
            border-radius: 8px;
        }

        .btn-ver:hover {
            background: #6258e8;
        }

        .sem-perguntas {
            background: #111421;
            border: 1px solid #292d42;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            color: #8e95aa;
        }

        .carregando {
            text-align: center;
            color: #8e95aa;
            padding: 35px;
        }

        .erro {
            background: #301820;
            border: 1px solid #6b2636;
            color: #ff9da9;
            padding: 18px;
            border-radius: 10px;
        }

        .hidden {
            display: none;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 0 5%;
            }

            .logo {
                font-size: 20px;
            }

            .btn-header {
                padding: 8px 10px;
            }

            main {
                width: 94%;
                margin-top: 25px;
            }

            .perfil-card {
                padding: 22px;
            }

            .perfil-topo {
                flex-direction: column;
                text-align: center;
            }

            .informacoes {
                grid-template-columns: 1fr;
            }

            .botoes-edicao {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>

    <div class="header-botoes">

        <button
            class="btn-header"
            onclick="voltarComunidade()">

            ← Comunidade

        </button>

        <button
            class="btn-header"
            onclick="sair()">

            Sair

        </button>

    </div>

</header>


<main>


    <div id="conteudoPerfil">

        <div class="carregando">
            Carregando perfil...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* ================================
   VARIÁVEIS
================================ */

let usuarioAtual = null;

let perfilAtual = null;


/* ================================
   VERIFICAR LOGIN
================================ */

async function verificarLogin() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        mostrarErro(
            "Erro ao verificar login."
        );

        return;

    }


    usuarioAtual =
        data.session?.user;


    if (!usuarioAtual) {

        window.location.href =
            "index.html";

        return;

    }


    carregarPerfil();

}


/* ================================
   CARREGAR PERFIL
================================ */

async function carregarPerfil() {

    const { data, error } =
        await window.supabaseClient

            .from("profiles")

            .select(`
                id,
                nome,
                username,
                curso,
                semestre,
                nivel,
                tipo_conta,
                bio,
                avatar_url
            `)

            .eq(
                "id",
                usuarioAtual.id
            )

            .single();


    if (error) {

        console.error(error);

        mostrarErro(
            "Erro ao carregar perfil: " +
            error.message
        );

        return;

    }


    perfilAtual = data;


    renderizarPerfil();

    carregarPerguntas();

}


/* ================================
   RENDERIZAR PERFIL
================================ */

function renderizarPerfil() {

    const nome =
        perfilAtual.nome ||
        "Usuário";


    const username =
        perfilAtual.username ||
        "usuario";


    const curso =
        perfilAtual.curso ||
        "Não informado";


    const semestre =
        perfilAtual.semestre ||
        "Não informado";


    const nivel =
        perfilAtual.nivel ||
        "Membro";


    const tipoConta =
        perfilAtual.tipo_conta ||
        "Aluno";


    const bio =
        perfilAtual.bio ||
        "";


    const avatar =
        perfilAtual.avatar_url ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(nome) +
        "&background=6258e8&color=fff";


    const container =
        document.getElementById(
            "conteudoPerfil"
        );


    container.innerHTML = `

        <section class="perfil-card">

            <div class="perfil-topo">

                <div class="foto-area">

                    <img
                        id="fotoPerfil"
                        class="foto-perfil"
                        src="${avatar}"
                        alt="Foto de perfil"
                    >

                    <button
                        class="btn-foto"
                        onclick="selecionarFoto()"
                        title="Alterar foto"
                    >
                        📷
                    </button>

                    <input
                        type="file"
                        id="arquivoFoto"
                        accept="image/*"
                        class="hidden"
                        onchange="alterarFoto(event)"
                    >

                </div>


                <div class="info-principal">

                    <h1>
                        ${nome}
                    </h1>

                    <div class="username">
                        @${username}
                    </div>

                    <span class="badge">
                        ${tipoConta}
                    </span>

                </div>

            </div>


            <div class="bio">

                ${
                    bio
                    ?
                    bio
                    :
                    `<span class="sem-bio">
                        Você ainda não adicionou uma bio.
                    </span>`
                }

            </div>


            <div class="informacoes">

                <div class="info-box">

                    <span class="info-label">
                        🎓 Curso
                    </span>

                    <span class="info-valor">
                        ${curso}
                    </span>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        📚 Semestre
                    </span>

                    <span class="info-valor">
                        ${semestre}
                    </span>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        ⭐ Nível
                    </span>

                    <span class="info-valor">
                        ${nivel}
                    </span>

                </div>

            </div>


            <div class="editar-area">

                <h2>
                    ✏️ Editar perfil
                </h2>


                <div class="campo">

                    <label>
                        Nome
                    </label>

                    <input
                        id="editarNome"
                        type="text"
                        value="${escaparHTML(nome)}"
                    >

                </div>


                <div class="campo">

                    <label>
                        Bio
                    </label>

                    <textarea
                        id="editarBio"
                        maxlength="300"
                        placeholder="Fale um pouco sobre você..."
                    >${escaparHTML(bio)}</textarea>

                </div>


                <div class="botoes-edicao">

                    <button
                        class="btn-salvar"
                        onclick="salvarPerfil()"
                    >
                        💾 Salvar alterações
                    </button>

                    <button
                        class="btn-cancelar"
                        onclick="carregarPerfil()"
                    >
                        Cancelar
                    </button>

                </div>

            </div>

        </section>


        <section class="perguntas-section">

            <div class="titulo-secao">

                <h2>
                    ❓ Minhas perguntas
                </h2>

                <span
                    id="contadorPerguntas"
                    class="contador"
                >
                    0
                </span>

            </div>


            <div id="listaPerguntas">

                <div class="carregando">
                    Carregando perguntas...
                </div>

            </div>

        </section>

    `;

}


/* ================================
   ESCAPAR HTML
================================ */

function escaparHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ================================
   SELECIONAR FOTO
================================ */

function selecionarFoto() {

    document
        .getElementById("arquivoFoto")
        .click();

}


/* ================================
   ALTERAR FOTO
================================ */

async function alterarFoto(event) {

    const arquivo =
        event.target.files[0];


    if (!arquivo) {
        return;
    }


    if (!arquivo.type.startsWith("image/")) {

        alert(
            "Selecione uma imagem válida."
        );

        return;

    }


    if (arquivo.size > 5 * 1024 * 1024) {

        alert(
            "A imagem deve ter no máximo 5 MB."
        );

        return;

    }


    const extensao =
        arquivo.name
            .split(".")
            .pop();


    const nomeArquivo =
        usuarioAtual.id +
        "-" +
        Date.now() +
        "." +
        extensao;


    const { error: uploadError } =
        await window.supabaseClient
            .storage
            .from("avatars")
            .upload(
                nomeArquivo,
                arquivo,
                {
                    upsert: true,
                    contentType: arquivo.type
                }
            );


    if (uploadError) {

        console.error(
            uploadError
        );

        alert(
            "Erro ao enviar foto: " +
            uploadError.message
        );

        return;

    }


    const { data: urlData } =
        window.supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(
                nomeArquivo
            );


    const avatarUrl =
        urlData.publicUrl;


    const { error: updateError } =
        await window.supabaseClient

            .from("profiles")

            .update({

                avatar_url:
                    avatarUrl

            })

            .eq(
                "id",
                usuarioAtual.id
            );


    if (updateError) {

        console.error(
            updateError
        );

        alert(
            "Erro ao salvar foto: " +
            updateError.message
        );

        return;

    }


    perfilAtual.avatar_url =
        avatarUrl;


    const foto =
        document.getElementById(
            "fotoPerfil"
        );


    if (foto) {

        foto.src =
            avatarUrl;

    }


    alert(
        "Foto atualizada! 📸"
    );

}


/* ================================
   SALVAR PERFIL
================================ */

async function salvarPerfil() {

    const nome =
        document
            .getElementById("editarNome")
            .value
            .trim();


    const bio =
        document
            .getElementById("editarBio")
            .value
            .trim();


    if (!nome) {

        alert(
            "O nome não pode ficar vazio."
        );

        return;

    }


    if (nome.length > 100) {

        alert(
            "O nome é muito grande."
        );

        return;

    }


    const { error } =
        await window.supabaseClient

            .from("profiles")

            .update({

                nome:
                    nome,

                bio:
                    bio || null

            })

            .eq(
                "id",
                usuarioAtual.id
            );


    if (error) {

        console.error(error);

        alert(
            "Erro ao salvar perfil: " +
            error.message
        );

        return;

    }


    alert(
        "Perfil atualizado! 🎉"
    );


    carregarPerfil();

}


/* ================================
   CARREGAR PERGUNTAS
================================ */

async function carregarPerguntas() {

    const container =
        document.getElementById(
            "listaPerguntas"
        );


    if (!container) {
        return;
    }


    const { data, error } =
        await window.supabaseClient

            .from("posts")

            .select(`
                id,
                titulo,
                conteudo,
                categoria,
                created_at
            `)

            .eq(
                "author_id",
                usuarioAtual.id
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML = `

            <div class="erro">

                Erro ao carregar suas perguntas.

            </div>

        `;

        return;

    }


    const contador =
        document.getElementById(
            "contadorPerguntas"
        );


    if (contador) {

        contador.textContent =
            data?.length || 0;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `

            <div class="sem-perguntas">

                <div style="font-size:40px;">
                    💭
                </div>

                <h3>
                    Você ainda não fez nenhuma pergunta.
                </h3>

                <p>
                    Faça sua primeira pergunta
                    na comunidade!
                </p>

                <button
                    class="btn-salvar"
                    onclick="voltarComunidade()"
                >
                    Fazer uma pergunta
                </button>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    data.forEach(post => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "pergunta";


        const dataFormatada =
            new Date(
                post.created_at
            ).toLocaleDateString(
                "pt-BR"
            );


        div.innerHTML = `

            <h3>
                ${escaparHTML(post.titulo)}
            </h3>


            <div class="pergunta-info">

                📁 ${escaparHTML(post.categoria || "Geral")}

                ·

                📅 ${dataFormatada}

            </div>


            <div class="pergunta-conteudo">

                ${escaparHTML(post.conteudo)}

            </div>


            <div class="pergunta-footer">

                <button
                    class="btn-ver"
                    onclick="abrirPost('${post.id}')"
                >
                    🔎 Ver pergunta
                </button>

            </div>

        `;


        container.appendChild(
            div
        );

    });

}


/* ================================
   ABRIR POST
================================ */

function abrirPost(postId) {

    window.location.href =
        "post.html?id=" +
        postId;

}


/* ================================
   VOLTAR
================================ */

function voltarComunidade() {

    window.location.href =
        "comunidade.html";

}


/* ================================
   SAIR
================================ */

async function sair() {

    await window.supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* ================================
   ERRO
================================ */

function mostrarErro(mensagem) {

    document.getElementById(
        "conteudoPerfil"
    ).innerHTML = `

        <div class="erro">
            ${mensagem}
        </div>

    `;

}


/* ================================
   INICIAR
================================ */

verificarLogin();

</script>

</body>

</html>
