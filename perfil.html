<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - TechCommunity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #171a32 0%,
                    #0b0d17 45%
                );

            color: white;

            min-height: 100vh;

        }

        /* =========================
           HEADER
        ========================= */

        header {

            height: 70px;

            padding: 0 8%;

            border-bottom:
                1px solid #25283a;

            background:
                rgba(11, 13, 23, 0.92);

            backdrop-filter: blur(12px);

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 20;

        }

        .logo {

            font-size: 24px;

            font-weight: bold;

        }

        .logo span {

            color: #6c63ff;

        }

        .header-botoes {

            display: flex;

            gap: 10px;

        }

        .btn-header {

            background: #171a29;

            border:
                1px solid #292d42;

            color: white;

            padding: 10px 16px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            transition: .2s;

        }

        .btn-header:hover {

            background: #25283a;

            transform: translateY(-1px);

        }

        /* =========================
           MAIN
        ========================= */

        main {

            width: 92%;

            max-width: 850px;

            margin: 45px auto 80px;

        }

        /* =========================
           CARD
        ========================= */

        .perfil-card {

            background:
                linear-gradient(
                    145deg,
                    #171a29,
                    #111421
                );

            border:
                1px solid #292d42;

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.28);

        }

        /* =========================
           CAPA
        ========================= */

        .capa {

            height: 190px;

            background:
                linear-gradient(
                    135deg,
                    #6258e8,
                    #302b70,
                    #15182a
                );

            position: relative;

        }

        .capa::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(255,255,255,.15),
                    transparent 30%
                );

        }

        /* =========================
           CONTEÚDO
        ========================= */

        .perfil-conteudo {

            padding:
                0 35px 35px;

        }

        .foto-area {

            margin-top: -65px;

            position: relative;

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

        }

        /* =========================
           FOTO
        ========================= */

        .foto-container {

            position: relative;

        }

        .foto {

            width: 130px;

            height: 130px;

            border-radius: 50%;

            border:
                5px solid #111421;

            background:
                linear-gradient(
                    135deg,
                    #6258e8,
                    #302b70
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 55px;

            font-weight: bold;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.4);

        }

        .foto img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        /* BOTÃO DA FOTO */

        .botao-foto {

            position: absolute;

            right: 0;

            bottom: 5px;

            width: 38px;

            height: 38px;

            border-radius: 50%;

            border:
                3px solid #111421;

            background: #6258e8;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            font-size: 17px;

            transition: .2s;

        }

        .botao-foto:hover {

            transform: scale(1.08);

            background: #7168f0;

        }

        #inputFoto {

            display: none;

        }

        /* =========================
           BOTÃO EDITAR
        ========================= */

        .btn-editar {

            background: #6258e8;

            color: white;

            border: none;

            padding: 11px 20px;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;

        }

        .btn-editar:hover {

            background: #7168f0;

            transform: translateY(-2px);

        }

        /* =========================
           INFORMAÇÕES
        ========================= */

        .informacoes {

            margin-top: 20px;

        }

        .nome {

            font-size: 30px;

            font-weight: bold;

            margin: 0;

        }

        .username {

            color: #8e95aa;

            margin-top: 5px;

        }

        .bio {

            color: #c8ccda;

            line-height: 1.6;

            margin-top: 18px;

            white-space: pre-wrap;

        }

        /* =========================
           BADGES
        ========================= */

        .badges {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 20px;

        }

        .badge {

            background: #292d42;

            color: #c8ccda;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

        }

        .badge-professor {

            background:
                rgba(98,88,232,.25);

            color: #aaa5ff;

            border:
                1px solid #6258e8;

        }

        .badge-aluno {

            background:
                rgba(46,160,67,.15);

            color: #8be09b;

            border:
                1px solid #34783e;

        }

        /* =========================
           ESTATÍSTICAS
        ========================= */

        .estatisticas {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            border-top:
                1px solid #292d42;

            margin-top: 30px;

            padding-top: 25px;

            text-align: center;

        }

        .estatistica {

            border-right:
                1px solid #292d42;

        }

        .estatistica:last-child {

            border-right: none;

        }

        .numero {

            display: block;

            font-size: 22px;

            font-weight: bold;

        }

        .label {

            color: #8e95aa;

            font-size: 13px;

            margin-top: 5px;

        }

        /* =========================
           EDITAR
        ========================= */

        .editar-area {

            display: none;

            margin-top: 30px;

            padding-top: 30px;

            border-top:
                1px solid #292d42;

        }

        .editar-area.aberto {

            display: block;

            animation:
                aparecer .25s ease;

        }

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

        .campo {

            margin-bottom: 18px;

        }

        .campo label {

            display: block;

            color: #c8ccda;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;

        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 13px 14px;

            background: #0d0f19;

            color: white;

            border:
                1px solid #30344b;

            border-radius: 9px;

            outline: none;

            font-family: Arial,sans-serif;

            font-size: 14px;

        }

        input:focus,
        textarea:focus,
        select:focus {

            border-color: #6258e8;

            box-shadow:
                0 0 0 3px
                rgba(98,88,232,.12);

        }

        textarea {

            min-height: 110px;

            resize: vertical;

        }

        .botoes-edicao {

            display: flex;

            gap: 10px;

            margin-top: 20px;

        }

        .btn-salvar {

            background: #6258e8;

            color: white;

            padding: 12px 20px;

            border: none;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

        }

        .btn-cancelar {

            background: #292d42;

            color: white;

            padding: 12px 20px;

            border: none;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

        }

        .btn-salvar:hover {

            background: #7168f0;

        }

        .btn-cancelar:hover {

            background: #363b54;

        }

        /* =========================
           FOTO PREVIEW
        ========================= */

        .foto-preview {

            display: none;

            margin-top: 15px;

            padding: 15px;

            background: #0d0f19;

            border:
                1px solid #292d42;

            border-radius: 12px;

        }

        .foto-preview.aberto {

            display: block;

        }

        .foto-preview img {

            width: 90px;

            height: 90px;

            object-fit: cover;

            border-radius: 50%;

            display: block;

            margin-bottom: 10px;

        }

        .btn-remover-foto {

            background: #301820;

            border:
                1px solid #6b2636;

            color: #ff9da9;

            padding: 8px 12px;

            border-radius: 8px;

            cursor: pointer;

        }

        /* =========================
           LOADING
        ========================= */

        .carregando {

            text-align: center;

            padding: 80px;

            color: #9da3b8;

        }

        .erro {

            background: #301820;

            border:
                1px solid #6b2636;

            color: #ff9da9;

            padding: 20px;

            border-radius: 12px;

        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px) {

            header {

                padding: 0 5%;

            }

            .logo {

                font-size: 20px;

            }

            .btn-header {

                padding: 8px 10px;

            }

            main {

                width: 94%;

                margin-top: 25px;

            }

            .capa {

                height: 140px;

            }

            .perfil-conteudo {

                padding:
                    0 20px 25px;

            }

            .foto {

                width: 105px;

                height: 105px;

                font-size: 40px;

            }

            .foto-area {

                margin-top: -52px;

            }

            .nome {

                font-size: 25px;

            }

            .btn-editar {

                padding:
                    9px 14px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        Tech<span>Community</span>

    </div>


    <div class="header-botoes">

        <button
            class="btn-header"
            onclick="comunidade()">

            💬 Comunidade

        </button>


        <button
            class="btn-header"
            onclick="sair()">

            Sair

        </button>

    </div>

</header>



<main>

    <div id="perfilContainer">

        <div class="carregando">

            Carregando perfil...

        </div>

    </div>

</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

/* ================================
   VARIÁVEIS
================================ */

let usuarioAtual = null;

let perfilAtual = null;


/* ================================
   LOGIN
================================ */

async function verificarLogin() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        mostrarErro(
            "Erro ao verificar login."
        );

        return;

    }


    usuarioAtual =
        data.session?.user;


    if (!usuarioAtual) {

        window.location.href =
            "index.html";

        return;

    }


    carregarPerfil();

}


/* ================================
   CARREGAR PERFIL
================================ */

async function carregarPerfil() {

    const container =
        document.getElementById(
            "perfilContainer"
        );


    const { data, error } =
        await window.supabaseClient

            .from("profiles")

            .select(`
                id,
                nome,
                username,
                curso,
                semestre,
                nivel,
                tipo_conta,
                bio,
                avatar_url
            `)

            .eq(
                "id",
                usuarioAtual.id
            )

            .single();


    if (error) {

        console.error(error);

        /*
           Se avatar_url ainda não existir,
           o restante do perfil continua funcionando.
        */

        if (
            error.message &&
            error.message.includes(
                "avatar_url"
            )
        ) {

            carregarPerfilSemFoto();

            return;

        }


        mostrarErro(
            "Erro ao carregar seu perfil."
        );

        return;

    }


    perfilAtual = data;

    renderizarPerfil();

}


/* ================================
   PERFIL SEM AVATAR_URL
================================ */

async function carregarPerfilSemFoto() {

    const { data, error } =
        await window.supabaseClient

            .from("profiles")

            .select(`
                id,
                nome,
                username,
                curso,
                semestre,
                nivel,
                tipo_conta,
                bio
            `)

            .eq(
                "id",
                usuarioAtual.id
            )

            .single();


    if (error) {

        console.error(error);

        mostrarErro(
            "Erro ao carregar seu perfil."
        );

        return;

    }


    perfilAtual = {

        ...data,

        avatar_url: null

    };


    renderizarPerfil();

}


/* ================================
   RENDERIZAR
================================ */

function renderizarPerfil() {

    const container =
        document.getElementById(
            "perfilContainer"
        );


    const nome =
        perfilAtual.nome ||
        "Usuário";


    const username =
        perfilAtual.username ||
        "usuario";


    const curso =
        perfilAtual.curso ||
        "Curso não informado";


    const semestre =
        perfilAtual.semestre ||
        "Semestre não informado";


    const nivel =
        perfilAtual.nivel ||
        "Membro";


    const tipoConta =
        perfilAtual.tipo_conta ||
        "Aluno";


    const bio =
        perfilAtual.bio ||
        "Ainda não adicionou uma biografia.";


    const inicial =
        nome
            .charAt(0)
            .toUpperCase();


    const classeCargo =
        tipoConta
            .toLowerCase()
            .includes("professor")
            ? "badge-professor"
            : "badge-aluno";


    const fotoHTML =
        perfilAtual.avatar_url

        ?

        `<img
            src="${escaparAtributo(
                perfilAtual.avatar_url
            )}"
            alt="Foto de perfil"
        >`

        :

        inicial;


    container.innerHTML = `

        <div class="perfil-card">


            <div class="capa"></div>


            <div class="perfil-conteudo">


                <div class="foto-area">


                    <div class="foto-container">


                        <div class="foto">

                            ${fotoHTML}

                        </div>


                        <label
                            class="botao-foto"
                            for="inputFoto"
                            title="Alterar foto">

                            📷

                        </label>


                        <input
                            id="inputFoto"
                            type="file"
                            accept="image/*"
                            onchange="selecionarFoto(event)"
                        >

                    </div>


                    <button
                        class="btn-editar"
                        onclick="abrirEdicao()">

                        ✏️ Editar perfil

                    </button>

                </div>



                <div class="informacoes">


                    <h1 class="nome">

                        ${escaparHTML(nome)}

                    </h1>


                    <div class="username">

                        @${escaparHTML(username)}

                    </div>


                    <div class="bio">

                        ${escaparHTML(bio)}

                    </div>



                    <div class="badges">


                        <span class="badge ${classeCargo}">

                            ${
                                tipoConta
                                    .toLowerCase()
                                    .includes("professor")
                                    ? "👨‍🏫"
                                    : "🎓"
                            }

                            ${escaparHTML(tipoConta)}

                        </span>


                        <span class="badge">

                            📚
                            ${escaparHTML(curso)}

                        </span>


                        <span class="badge">

                            📅
                            ${escaparHTML(
                                String(semestre)
                            )}

                        </span>


                        <span class="badge">

                            ⭐
                            ${escaparHTML(nivel)}

                        </span>


                    </div>



                    <div class="estatisticas">


                        <div class="estatistica">

                            <span
                                class="numero"
                                id="totalPosts">

                                ...

                            </span>

                            <span class="label">

                                Perguntas

                            </span>

                        </div>


                        <div class="estatistica">

                            <span
                                class="numero"
                                id="totalRespostas">

                                ...

                            </span>

                            <span class="label">

                                Respostas

                            </span>

                        </div>


                        <div class="estatistica">

                            <span class="numero">

                                ✓

                            </span>

                            <span class="label">

                                Membro

                            </span>

                        </div>


                    </div>



                    <!-- =====================
                         EDITAR PERFIL
                    ====================== -->


                    <div
                        id="editarArea"
                        class="editar-area">


                        <h2>

                            Editar perfil

                        </h2>


                        <div class="campo">

                            <label>
                                Nome
                            </label>

                            <input
                                id="editNome"
                                type="text"
                                maxlength="100"
                                value="${escaparAtributo(nome)}"
                            >

                        </div>


                        <div class="campo">

                            <label>
                                Username
                            </label>

                            <input
                                id="editUsername"
                                type="text"
                                maxlength="50"
                                value="${escaparAtributo(username)}"
                            >

                        </div>


                        <div class="campo">

                            <label>
                                Bio
                            </label>

                            <textarea
                                id="editBio"
                                maxlength="500"
                                placeholder="Conte um pouco sobre você..."
                            >${escaparHTML(
                                perfilAtual.bio || ""
                            )}</textarea>

                        </div>


                        <div class="campo">

                            <label>
                                Curso
                            </label>

                            <input
                                id="editCurso"
                                type="text"
                                maxlength="100"
                                value="${escaparAtributo(
                                    perfilAtual.curso || ""
                                )}"
                            >

                        </div>


                        <div class="campo">

                            <label>
                                Semestre
                            </label>

                            <input
                                id="editSemestre"
                                type="text"
                                maxlength="30"
                                value="${escaparAtributo(
                                    perfilAtual.semestre || ""
                                )}"
                            >

                        </div>


                        <div class="campo">

                            <label>
                                Nível
                            </label>

                            <select id="editNivel">

                                <option value="Iniciante"
                                    ${
                                        nivel === "Iniciante"
                                        ? "selected"
                                        : ""
                                    }>
                                    Iniciante
                                </option>

                                <option value="Intermediário"
                                    ${
                                        nivel === "Intermediário"
                                        ? "selected"
                                        : ""
                                    }>
                                    Intermediário
                                </option>

                                <option value="Avançado"
                                    ${
                                        nivel === "Avançado"
                                        ? "selected"
                                        : ""
                                    }>
                                    Avançado
                                </option>

                                <option value="Membro"
                                    ${
                                        nivel === "Membro"
                                        ? "selected"
                                        : ""
                                    }>
                                    Membro
                                </option>

                            </select>

                        </div>


                        <div class="botoes-edicao">


                            <button
                                class="btn-salvar"
                                onclick="salvarPerfil()">

                                💾 Salvar alterações

                            </button>


                            <button
                                class="btn-cancelar"
                                onclick="fecharEdicao()">

                                Cancelar

                            </button>


                        </div>


                    </div>

                </div>

            </div>

        </div>

    `;


    carregarEstatisticas();

}


/* ================================
   SELECIONAR FOTO
================================ */

async function selecionarFoto(event) {

    const arquivo =
        event.target.files[0];


    if (!arquivo) {
        return;
    }


    if (!arquivo.type.startsWith("image/")) {

        alert(
            "Selecione uma imagem válida."
        );

        return;

    }


    if (arquivo.size > 5 * 1024 * 1024) {

        alert(
            "A imagem deve ter no máximo 5 MB."
        );

        event.target.value = "";

        return;

    }


    /*
       Preview imediato
    */

    const leitor =
        new FileReader();


    leitor.onload = function(e) {

        const foto =
            document.querySelector(
                ".foto"
            );


        if (foto) {

            foto.innerHTML = `

                <img
                    src="${e.target.result}"
                    alt="Nova foto"
                >

            `;

        }

    };


    leitor.readAsDataURL(arquivo);


    /*
       Faz upload
    */

    await enviarFoto(arquivo);

}


/* ================================
   ENVIAR FOTO
================================ */

async function enviarFoto(arquivo) {

    if (!usuarioAtual) {

        alert(
            "Você precisa estar logado."
        );

        return;

    }


    /*
       Nome único da imagem
    */

    const extensao =
        arquivo.name
            .split(".")
            .pop()
            .toLowerCase();


    const caminho =
        `${usuarioAtual.id}/avatar-${Date.now()}.${extensao}`;


    /*
       Upload
    */

    const { error: uploadError } =
        await window.supabaseClient
            .storage
            .from("avatars")
            .upload(
                caminho,
                arquivo,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


    if (uploadError) {

        console.error(
            uploadError
        );

        alert(
            "Erro ao enviar foto: " +
            uploadError.message
        );

        carregarPerfil();

        return;

    }


    /*
       Pegar URL pública
    */

    const { data } =
        window.supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(
                caminho
            );


    const url =
        data.publicUrl;


    /*
       Salvar URL no perfil
    */

    const { error: updateError } =
        await window.supabaseClient

            .from("profiles")

            .update({

                avatar_url:
                    url

            })

            .eq(
                "id",
                usuarioAtual.id
            );


    if (updateError) {

        console.error(
            updateError
        );

        /*
           Caso a coluna ainda não exista
        */

        if (
            updateError.message &&
            updateError.message.includes(
                "avatar_url"
            )
        ) {

            alert(
                "A coluna avatar_url ainda não existe na tabela profiles."
            );

        } else {

            alert(
                "Erro ao salvar foto: " +
                updateError.message
            );

        }

        return;

    }


    perfilAtual.avatar_url =
        url;


    alert(
        "Foto de perfil atualizada! 📸"
    );


    renderizarPerfil();

}


/* ================================
   EDITAR PERFIL
================================ */

function abrirEdicao() {

    const area =
        document.getElementById(
            "editarArea"
        );


    area.classList.add(
        "aberto"
    );


    area.scrollIntoView({

        behavior: "smooth",

        block: "center"

    });

}


function fecharEdicao() {

    const area =
        document.getElementById(
            "editarArea"
        );


    area.classList.remove(
        "aberto"
    );

}


/* ================================
   SALVAR PERFIL
================================ */

async function salvarPerfil() {

    const nome =
        document
            .getElementById("editNome")
            .value
            .trim();


    const username =
        document
            .getElementById("editUsername")
            .value
            .trim();


    const bio =
        document
            .getElementById("editBio")
            .value
            .trim();


    const curso =
        document
            .getElementById("editCurso")
            .value
            .trim();


    const semestre =
        document
            .getElementById("editSemestre")
            .value
            .trim();


    const nivel =
        document
            .getElementById("editNivel")
            .value;


    if (!nome) {

        alert(
            "Digite seu nome."
        );

        return;

    }


    if (!username) {

        alert(
            "Digite seu username."
        );

        return;

    }


    /*
       Verificar username
    */

    const { data: existente,
            error: erroUsername } =

        await window.supabaseClient

            .from("profiles")

            .select("id")

            .eq(
                "username",
                username
            )

            .neq(
                "id",
                usuarioAtual.id
            );


    if (erroUsername) {

        console.error(
            erroUsername
        );

        alert(
            "Erro ao verificar username: " +
            erroUsername.message
        );

        return;

    }


    if (
        existente &&
        existente.length > 0
    ) {

        alert(
            "Esse username já está sendo usado."
        );

        return;

    }


    /*
       Atualizar
    */

    const { error } =
        await window.supabaseClient

            .from("profiles")

            .update({

                nome:
                    nome,

                username:
                    username,

                bio:
                    bio || null,

                curso:
                    curso || null,

                semestre:
                    semestre || null,

                nivel:
                    nivel

            })

            .eq(
                "id",
                usuarioAtual.id
            );


    if (error) {

        console.error(error);

        alert(
            "Erro ao salvar perfil: " +
            error.message
        );

        return;

    }


    alert(
        "Perfil atualizado com sucesso! 🎉"
    );


    carregarPerfil();

}

async function carregarEstatisticas() {

    const { count: posts } =
        await window.supabaseClient

            .from("posts")

            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )

            .eq(
                "author_id",
                usuarioAtual.id
            );


    const { count: respostas } =
        await window.supabaseClient

            .from("respostas")

            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )

            .eq(
                "author_id",
                usuarioAtual.id
            );


    const totalPosts =
        document.getElementById(
            "totalPosts"
        );


    const totalRespostas =
        document.getElementById(
            "totalRespostas"
        );


    if (totalPosts) {

        totalPosts.textContent =
            posts || 0;

    }


    if (totalRespostas) {

        totalRespostas.textContent =
            respostas || 0;

    }

}


/* ================================
   ESCAPAR HTML
================================ */

function escaparHTML(valor) {

    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escaparAtributo(valor) {

    return escaparHTML(valor);

}
