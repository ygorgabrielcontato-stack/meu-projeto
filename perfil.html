<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - TechCommunity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #171a35 0%, #0b0d17 45%);
            color: white;
            min-height: 100vh;
        }

        header {
            height: 70px;
            padding: 0 8%;
            border-bottom: 1px solid #25283a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 13, 23, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        .header-botoes {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-header {
            background: #171a29;
            color: white;
            border: 1px solid #292d42;
            padding: 10px 16px;
            border-radius: 9px;
        }

        .btn-header:hover {
            background: #25283a;
            transform: translateY(-1px);
        }

        main {
            width: 92%;
            max-width: 850px;
            margin: 45px auto 80px;
        }

        /* =========================
           PERFIL
        ========================= */

        .perfil-card {
            background: rgba(23, 26, 41, 0.95);
            border: 1px solid #292d42;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .capa {
            height: 150px;
            background:
                linear-gradient(
                    135deg,
                    #6258e8,
                    #8a4fff,
                    #302b63
                );
            position: relative;
        }

        .capa::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(255,255,255,0.15),
                    transparent 30%
                );
        }

        .perfil-conteudo {
            padding: 0 35px 35px;
        }

        .perfil-topo {
            display: flex;
            align-items: flex-end;
            gap: 22px;
            margin-top: -60px;
            position: relative;
        }

        /* =========================
           FOTO
        ========================= */

        .foto-container {
            position: relative;
        }

        .foto-perfil {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #171a29;
            background: #25283a;
            object-fit: cover;
            display: block;
        }

        .btn-foto {
            position: absolute;
            right: 5px;
            bottom: 5px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #6258e8;
            color: white;
            border: 3px solid #171a29;
            font-size: 16px;
            padding: 0;
        }

        .btn-foto:hover {
            background: #796fff;
            transform: scale(1.08);
        }

        #inputFoto {
            display: none;
        }

        /* =========================
           INFORMAÇÕES
        ========================= */

        .informacoes {
            padding-bottom: 10px;
        }

        .nome {
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 5px;
        }

        .username {
            color: #8e95aa;
            font-size: 15px;
        }

        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #292d42;
            color: #aaa5ff;
            font-size: 12px;
            font-weight: bold;
        }

        .bio {
            margin-top: 28px;
            color: #c8ccda;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .sem-bio {
            color: #777d91;
            font-style: italic;
        }

        /* =========================
           ESTATÍSTICAS
        ========================= */

        .estatisticas {
            display: flex;
            gap: 40px;
            border-top: 1px solid #292d42;
            border-bottom: 1px solid #292d42;
            margin-top: 28px;
            padding: 20px 0;
        }

        .estatistica {
            text-align: center;
        }

        .estatistica strong {
            display: block;
            font-size: 20px;
        }

        .estatistica span {
            color: #8e95aa;
            font-size: 13px;
        }

        /* =========================
           BOTÃO EDITAR
        ========================= */

        .area-editar {
            margin-top: 25px;
        }

        .btn-editar {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            background: #6258e8;
            color: white;
            font-size: 15px;
        }

        .btn-editar:hover {
            background: #756cf0;
            transform: translateY(-1px);
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal.ativo {
            display: flex;
        }

        .modal-conteudo {
            width: 100%;
            max-width: 500px;
            background: #171a29;
            border: 1px solid #292d42;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: aparecer 0.2s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-topo h2 {
            margin: 0;
        }

        .fechar {
            background: transparent;
            color: #8e95aa;
            font-size: 25px;
            padding: 0;
        }

        .fechar:hover {
            color: white;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #c8ccda;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            background: #0d0f19;
            border: 1px solid #30344b;
            color: white;
            border-radius: 9px;
            padding: 13px;
            outline: none;
            margin-bottom: 18px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        textarea:focus {
            border-color: #6258e8;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .botoes-modal {
            display: flex;
            gap: 10px;
        }

        .btn-cancelar {
            flex: 1;
            padding: 12px;
            border-radius: 9px;
            background: #292d42;
            color: white;
        }

        .btn-salvar {
            flex: 1;
            padding: 12px;
            border-radius: 9px;
            background: #6258e8;
            color: white;
        }

        .btn-salvar:hover {
            background: #756cf0;
        }

        /* =========================
           PREVIEW DA FOTO
        ========================= */

        .preview-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #6258e8;
            display: none;
            margin: auto;
        }

        .mensagem {
            margin-top: 15px;
            color: #8e95aa;
            font-size: 13px;
            text-align: center;
        }

        .erro {
            color: #ff8996;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 0 5%;
            }

            .logo {
                font-size: 20px;
            }

            .btn-header {
                padding: 8px 10px;
            }

            main {
                width: 94%;
                margin-top: 25px;
            }

            .capa {
                height: 120px;
            }

            .perfil-conteudo {
                padding: 0 20px 25px;
            }

            .perfil-topo {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
                margin-top: -55px;
            }

            .foto-perfil {
                width: 110px;
                height: 110px;
            }

            .nome {
                font-size: 24px;
            }

            .estatisticas {
                gap: 25px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>

    <div class="header-botoes">

        <button
            class="btn-header"
            onclick="voltarComunidade()"
        >
            ← Comunidade
        </button>

        <button
            class="btn-header"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

</header>


<main>

    <div class="perfil-card">

        <div class="capa"></div>


        <div class="perfil-conteudo">

            <div class="perfil-topo">

                <div class="foto-container">

                    <img
                        id="fotoPerfil"
                        class="foto-perfil"
                        src=""
                        alt="Foto de perfil"
                    >

                    <button
                        class="btn-foto"
                        onclick="abrirFoto()"
                        title="Alterar foto"
                    >
                        📷
                    </button>

                    <input
                        type="file"
                        id="inputFoto"
                        accept="image/*"
                        onchange="selecionarFoto(event)"
                    >

                </div>


                <div class="informacoes">

                    <h1
                        id="nomePerfil"
                        class="nome"
                    >
                        Carregando...
                    </h1>

                    <div
                        id="usernamePerfil"
                        class="username"
                    >
                        @usuario
                    </div>

                    <div
                        id="tipoConta"
                        class="badge"
                    >
                        Aluno
                    </div>

                </div>

            </div>


            <div
                id="bioPerfil"
                class="bio"
            >
                Carregando bio...
            </div>


            <div class="estatisticas">

                <div class="estatistica">

                    <strong id="contadorPosts">
                        0
                    </strong>

                    <span>
                        Perguntas
                    </span>

                </div>


                <div class="estatistica">

                    <strong id="contadorRespostas">
                        0
                    </strong>

                    <span>
                        Respostas
                    </span>

                </div>

            </div>


            <div class="area-editar">

                <button
                    class="btn-editar"
                    onclick="abrirEdicao()"
                >
                    ✏️ Editar perfil
                </button>

            </div>

        </div>

    </div>

</main>


<!-- =========================
     MODAL EDITAR PERFIL
========================= -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-conteudo">

        <div class="modal-topo">

            <h2>
                Editar perfil
            </h2>

            <button
                class="fechar"
                onclick="fecharEdicao()"
            >
                ×
            </button>

        </div>


        <label>
            Nome
        </label>

        <input
            id="editarNome"
            type="text"
            placeholder="Seu nome"
        >


        <label>
            Username
        </label>

        <input
            id="editarUsername"
            type="text"
            placeholder="Seu username"
        >


        <label>
            Bio
        </label>

        <textarea
            id="editarBio"
            placeholder="Fale um pouco sobre você..."
        ></textarea>


        <div class="preview-area">

            <img
                id="previewFoto"
                class="preview"
                src=""
                alt="Preview"
            >

        </div>


        <div class="botoes-modal">

            <button
                class="btn-cancelar"
                onclick="fecharEdicao()"
            >
                Cancelar
            </button>

            <button
                class="btn-salvar"
                onclick="salvarPerfil()"
            >
                💾 Salvar alterações
            </button>

        </div>


        <div
            id="mensagem"
            class="mensagem"
        ></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* =================================
   VARIÁVEIS
================================= */

let usuarioAtual = null;

let perfilAtual = null;

let novaFoto = null;


/*
   Nome do bucket no Supabase Storage.

   IMPORTANTE:
   Se você criou o bucket com outro nome,
   altere "avatars" abaixo.
*/

const BUCKET_FOTOS = "avatars";


/* =================================
   VERIFICAR LOGIN
================================= */

async function verificarLogin() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        alert(
            "Erro ao verificar login."
        );

        return;
    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return;
    }


    usuarioAtual =
        data.session.user;


    carregarPerfil();

}


/* =================================
   CARREGAR PERFIL
================================= */

async function carregarPerfil() {

    const { data, error } =
        await window.supabaseClient

            .from("profiles")

            .select(`
                id,
                nome,
                username,
                nivel,
                tipo_conta,
                bio,
                avatar_url
            `)

            .eq(
                "id",
                usuarioAtual.id
            )

            .single();


    if (error) {

        console.error(error);

        /*
           Caso sua tabela ainda não tenha
           avatar_url ou bio, aparecerá erro.
        */

        alert(
            "Erro ao carregar perfil: " +
            error.message
        );

        return;
    }


    perfilAtual = data;


    mostrarPerfil();


    carregarEstatisticas();

}


/* =================================
   MOSTRAR PERFIL
================================= */

function mostrarPerfil() {

    const nome =
        perfilAtual.nome ||
        "Usuário";


    const username =
        perfilAtual.username ||
        "usuario";


    const nivel =
        perfilAtual.nivel ||
        "Membro";


    const tipoConta =
        perfilAtual.tipo_conta ||
        "Aluno";


    const bio =
        perfilAtual.bio ||
        "";


    document
        .getElementById("nomePerfil")
        .textContent =
            nome;


    document
        .getElementById("usernamePerfil")
        .textContent =
            "@" + username;


    document
        .getElementById("tipoConta")
        .textContent =
            tipoConta;


    const bioElemento =
        document.getElementById(
            "bioPerfil"
        );


    if (bio) {

        bioElemento.textContent =
            bio;

        bioElemento.classList.remove(
            "sem-bio"
        );

    } else {

        bioElemento.textContent =
            "Nenhuma bio adicionada ainda.";

        bioElemento.classList.add(
            "sem-bio"
        );

    }


    const foto =
        document.getElementById(
            "fotoPerfil"
        );


    if (perfilAtual.avatar_url) {

        foto.src =
            perfilAtual.avatar_url;

    } else {

        foto.src =
            criarAvatarPadrao(nome);

    }

}


/* =================================
   AVATAR PADRÃO
================================= */

function criarAvatarPadrao(nome) {

    const inicial =
        nome
            .charAt(0)
            .toUpperCase();


    return (
        "https://ui-avatars.com/api/" +
        "?name=" +
        encodeURIComponent(inicial) +
        "&background=6258e8" +
        "&color=ffffff" +
        "&size=300"
    );

}


/* =================================
   ESTATÍSTICAS
================================= */

async function carregarEstatisticas() {

    const { count: posts } =
        await window.supabaseClient

            .from("posts")

            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )

            .eq(
                "author_id",
                usuarioAtual.id
            );


    const { count: respostas } =
        await window.supabaseClient

            .from("respostas")

            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )

            .eq(
                "author_id",
                usuarioAtual.id
            );


    document
        .getElementById("contadorPosts")
        .textContent =
            posts || 0;


    document
        .getElementById("contadorRespostas")
        .textContent =
            respostas || 0;

}


/* =================================
   ABRIR FOTO
================================= */

function abrirFoto() {

    document
        .getElementById("inputFoto")
        .click();

}


/* =================================
   SELECIONAR FOTO
================================= */

function selecionarFoto(event) {

    const arquivo =
        event.target.files[0];


    if (!arquivo) {
        return;
    }


    if (!arquivo.type.startsWith("image/")) {

        alert(
            "Escolha uma imagem válida."
        );

        return;
    }


    /*
       Limite de 5 MB
    */

    if (
        arquivo.size >
        5 * 1024 * 1024
    ) {

        alert(
            "A imagem deve ter no máximo 5 MB."
        );

        return;
    }


    novaFoto = arquivo;


    const leitor =
        new FileReader();


    leitor.onload = function(e) {

        document
            .getElementById("fotoPerfil")
            .src =
                e.target.result;


        document
            .getElementById("previewFoto")
            .src =
                e.target.result;


        document
            .getElementById("previewFoto")
            .style.display =
                "block";

    };


    leitor.readAsDataURL(
        arquivo
    );


    /*
       Se o modal estiver fechado,
       abre automaticamente.
    */

    document
        .getElementById("modal")
        .classList.add("ativo");

}


/* =================================
   ABRIR EDIÇÃO
================================= */

function abrirEdicao() {

    document
        .getElementById("editarNome")
        .value =
            perfilAtual?.nome || "";


    document
        .getElementById("editarUsername")
        .value =
            perfilAtual?.username || "";


    document
        .getElementById("editarBio")
        .value =
            perfilAtual?.bio || "";


    document
        .getElementById("mensagem")
        .textContent =
            "";


    document
        .getElementById("modal")
        .classList.add("ativo");

}


/* =================================
   FECHAR EDIÇÃO
================================= */

function fecharEdicao() {

    document
        .getElementById("modal")
        .classList.remove("ativo");


    document
        .getElementById("mensagem")
        .textContent =
            "";


    novaFoto = null;


    document
        .getElementById("inputFoto")
        .value = "";


    document
        .getElementById("previewFoto")
        .style.display =
            "none";

}


/* =================================
   SALVAR PERFIL
================================= */

async function salvarPerfil() {

    if (!usuarioAtual) {
        return;
    }


    const mensagem =
        document.getElementById(
            "mensagem"
        );


    const nome =
        document
            .getElementById("editarNome")
            .value
            .trim();


    const username =
        document
            .getElementById("editarUsername")
            .value
            .trim()
            .toLowerCase();


    const bio =
        document
            .getElementById("editarBio")
            .value
            .trim();


    if (!nome) {

        mensagem.textContent =
            "Digite seu nome.";

        mensagem.classList.add(
            "erro"
        );

        return;
    }


    if (!username) {

        mensagem.textContent =
            "Digite seu username.";

        mensagem.classList.add(
            "erro"
        );

        return;
    }


    mensagem.classList.remove(
        "erro"
    );


    mensagem.textContent =
        "Salvando...";


    let avatarUrl =
        perfilAtual.avatar_url || null;


    /* =================================
       ENVIAR FOTO
    ================================= */

    if (novaFoto) {

        const extensao =
            novaFoto.name
                .split(".")
                .pop()
                .toLowerCase();


        const caminho =
            usuarioAtual.id +
            "." +
            extensao;


        const { error: uploadError } =
            await window.supabaseClient
                .storage
                .from(BUCKET_FOTOS)
                .upload(
                    caminho,
                    novaFoto,
                    {
                        upsert: true,
                        contentType:
                            novaFoto.type
                    }
                );


        if (uploadError) {

            console.error(
                uploadError
            );


            mensagem.textContent =
                "Erro ao enviar foto: " +
                uploadError.message;


            mensagem.classList.add(
                "erro"
            );


            return;
        }


        const { data: urlData } =
            window.supabaseClient
                .storage
                .from(BUCKET_FOTOS)
                .getPublicUrl(
                    caminho
                );


        avatarUrl =
            urlData.publicUrl +
            "?t=" +
            Date.now();

    }


    /* =================================
       ATUALIZAR PROFILE
    ================================= */

    const { error } =
        await window.supabaseClient

            .from("profiles")

            .update({

                nome:
                    nome,

                username:
                    username,

                bio:
                    bio,

                avatar_url:
                    avatarUrl

            })

            .eq(
                "id",
                usuarioAtual.id
            );


    if (error) {

        console.error(error);


        mensagem.textContent =
            "Erro ao salvar: " +
            error.message;


        mensagem.classList.add(
            "erro"
        );


        return;
    }


    mensagem.textContent =
        "Perfil atualizado! 🎉";


    perfilAtual.nome =
        nome;


    perfilAtual.username =
        username;


    perfilAtual.bio =
        bio;


    perfilAtual.avatar_url =
        avatarUrl;


    mostrarPerfil();


    novaFoto = null;


    setTimeout(
        () => {

            fecharEdicao();

        },
        700
    );

}


/* =================================
   FECHAR MODAL CLICANDO FORA
================================= */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                fecharEdicao();

            }

        }
    );


/* =================================
   NAVEGAÇÃO
================================= */

function voltarComunidade() {

    window.location.href =
        "comunidade.html";

}


/* =================================
   SAIR
================================= */

async function sair() {

    await window.supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* =================================
   INICIAR
================================= */

verificarLogin();

</script>


</body>

</html>
