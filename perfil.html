<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - TechCommunity</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #17152f 0%,
                    #0b0d17 40%
                );

            color: white;

            min-height: 100vh;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 70px;

            padding: 0 8%;

            border-bottom:
                1px solid #25283a;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: rgba(11, 13, 23, 0.9);

            backdrop-filter: blur(12px);

            position: sticky;

            top: 0;

            z-index: 20;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #6c63ff;

        }


        .header-botoes {

            display: flex;

            gap: 10px;

        }


        .btn-header {

            background: #171a29;

            color: white;

            border: 1px solid #292d42;

            padding: 10px 16px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;

        }


        .btn-header:hover {

            background: #25283a;

            transform: translateY(-1px);

        }


        /* =========================
           CONTAINER
        ========================= */

        main {

            width: 92%;

            max-width: 900px;

            margin: 45px auto 80px;

        }


        /* =========================
           PERFIL
        ========================= */

        .perfil-card {

            background:

                linear-gradient(
                    145deg,
                    #171a29,
                    #111421
                );

            border: 1px solid #292d42;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

        }


        /* =========================
           CAPA
        ========================= */

        .capa {

            height: 170px;

            background:

                radial-gradient(
                    circle at 20% 30%,
                    #6258e8,
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 20%,
                    #8b5cf6,
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #171a35,
                    #25204a
                );

            position: relative;

        }


        .capa::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    transparent,
                    rgba(11, 13, 23, 0.25)
                );

        }


        /* =========================
           FOTO
        ========================= */

        .foto-area {

            display: flex;

            justify-content: center;

            margin-top: -70px;

            position: relative;

            z-index: 5;

        }


        .foto-wrapper {

            position: relative;

        }


        .foto-perfil {

            width: 140px;

            height: 140px;

            border-radius: 50%;

            border: 6px solid #111421;

            background: #292d42;

            object-fit: cover;

            display: block;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.4);

        }


        .botao-foto {

            position: absolute;

            right: 4px;

            bottom: 5px;

            width: 40px;

            height: 40px;

            border-radius: 50%;

            border: 3px solid #111421;

            background: #6258e8;

            color: white;

            cursor: pointer;

            font-size: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: 0.2s;

        }


        .botao-foto:hover {

            transform: scale(1.1);

            background: #7168f0;

        }


        #inputFoto {

            display: none;

        }


        /* =========================
           DADOS DO PERFIL
        ========================= */

        .perfil-conteudo {

            padding: 25px 35px 35px;

            text-align: center;

        }


        .nome {

            font-size: 29px;

            font-weight: bold;

            margin: 5px 0;

        }


        .username {

            color: #8e95aa;

            font-size: 15px;

        }


        .badge {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-top: 12px;

            padding: 6px 12px;

            border-radius: 20px;

            background: #292d42;

            color: #aaa5ff;

            font-size: 13px;

        }


        /* =========================
           BIO
        ========================= */

        .bio {

            max-width: 650px;

            margin: 20px auto 0;

            color: #c8ccda;

            line-height: 1.6;

            white-space: pre-wrap;

        }


        .sem-bio {

            color: #777e94;

            font-style: italic;

        }


        /* =========================
           INFORMAÇÕES
        ========================= */

        .informacoes {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 30px;

        }


        .info {

            background: #0d0f19;

            border: 1px solid #25283a;

            border-radius: 13px;

            padding: 16px;

            text-align: left;

        }


        .info-label {

            color: #777e94;

            font-size: 12px;

            text-transform: uppercase;

            margin-bottom: 6px;

        }


        .info-valor {

            color: #e2e4ec;

            font-weight: bold;

            font-size: 14px;

        }


        /* =========================
           BOTÃO EDITAR
        ========================= */

        .area-editar {

            margin-top: 25px;

        }


        .btn-editar {

            background: #6258e8;

            color: white;

            border: none;

            padding: 12px 24px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

            transition: 0.2s;

        }


        .btn-editar:hover {

            background: #7168f0;

            transform: translateY(-2px);

        }


        /* =========================
           FORMULÁRIO
        ========================= */

        .editor {

            display: none;

            margin-top: 30px;

            text-align: left;

            border-top: 1px solid #292d42;

            padding-top: 30px;

        }


        .editor.ativo {

            display: block;

            animation: aparecer 0.25s ease;

        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform: translateY(10px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        .editor h2 {

            margin-top: 0;

        }


        .campo {

            margin-bottom: 18px;

        }


        .campo label {

            display: block;

            margin-bottom: 7px;

            color: #c8ccda;

            font-size: 14px;

            font-weight: bold;

        }


        input,
        textarea {

            width: 100%;

            padding: 13px;

            background: #0d0f19;

            color: white;

            border: 1px solid #30344b;

            border-radius: 9px;

            outline: none;

            font-family: Arial, sans-serif;

        }


        input:focus,
        textarea:focus {

            border-color: #6258e8;

            box-shadow:
                0 0 0 3px rgba(
                    98,
                    88,
                    232,
                    0.1
                );

        }


        textarea {

            min-height: 110px;

            resize: vertical;

        }


        .contador-bio {

            text-align: right;

            color: #777e94;

            font-size: 12px;

            margin-top: 5px;

        }


        .botoes-editor {

            display: flex;

            gap: 10px;

            margin-top: 22px;

        }


        .btn-salvar {

            background: #6258e8;

            color: white;

            border: none;

            padding: 12px 22px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

        }


        .btn-cancelar {

            background: #292d42;

            color: white;

            border: none;

            padding: 12px 22px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

        }


        .btn-salvar:hover {

            background: #7168f0;

        }


        .btn-cancelar:hover {

            background: #363b55;

        }


        /* =========================
           STATUS
        ========================= */

        .status {

            margin-top: 15px;

            padding: 12px;

            border-radius: 9px;

            display: none;

            font-size: 14px;

        }


        .status.sucesso {

            display: block;

            background: #10261d;

            border: 1px solid #1f6b4b;

            color: #7ee2b5;

        }


        .status.erro {

            display: block;

            background: #301820;

            border: 1px solid #6b2636;

            color: #ff9da9;

        }


        /* =========================
           CARREGANDO
        ========================= */

        .carregando {

            text-align: center;

            color: #9da3b8;

            padding: 70px 20px;

        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            header {

                padding: 0 5%;

            }


            .logo {

                font-size: 20px;

            }


            .btn-header {

                padding: 8px 10px;

            }


            main {

                width: 94%;

                margin-top: 25px;

            }


            .capa {

                height: 130px;

            }


            .foto-perfil {

                width: 120px;

                height: 120px;

            }


            .foto-area {

                margin-top: -60px;

            }


            .perfil-conteudo {

                padding: 20px;

            }


            .nome {

                font-size: 25px;

            }


            .informacoes {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        Tech<span>Community</span>

    </div>


    <div class="header-botoes">

        <button
            class="btn-header"
            onclick="voltarComunidade()">

            ← Comunidade

        </button>


        <button
            class="btn-header"
            onclick="sair()">

            Sair

        </button>

    </div>

</header>


<main>


    <div id="carregando"
        class="carregando">

        Carregando perfil...

    </div>


    <div
        id="perfilCard"
        class="perfil-card"
        style="display:none;"
    >


        <!-- =========================
             CAPA
        ========================== -->

        <div class="capa"></div>


        <!-- =========================
             FOTO
        ========================== -->

        <div class="foto-area">

            <div class="foto-wrapper">

                <img
                    id="fotoPerfil"
                    class="foto-perfil"
                    src=""
                    alt="Foto de perfil"
                >


                <label
                    class="botao-foto"
                    for="inputFoto"
                    title="Alterar foto"
                >

                    📷

                </label>


                <input
                    type="file"
                    id="inputFoto"
                    accept="image/png,image/jpeg,image/webp"
                    onchange="alterarFoto(event)"
                >

            </div>

        </div>


        <!-- =========================
             CONTEÚDO
        ========================== -->

        <div class="perfil-conteudo">


            <div
                id="nomePerfil"
                class="nome"
            >

                Usuário

            </div>


            <div
                id="usernamePerfil"
                class="username"
            >

                @usuario

            </div>


            <div
                id="badgePerfil"
                class="badge"
            >

                👤 Aluno

            </div>


            <div
                id="bioPerfil"
                class="bio"
            >

                <span class="sem-bio">
                    Nenhuma bio adicionada ainda.
                </span>

            </div>


            <!-- =========================
                 INFORMAÇÕES
            ========================== -->

            <div class="informacoes">


                <div class="info">

                    <div class="info-label">

                        🎓 Curso

                    </div>


                    <div
                        id="cursoPerfil"
                        class="info-valor"
                    >

                        Não informado

                    </div>

                </div>


                <div class="info">

                    <div class="info-label">

                        📚 Semestre

                    </div>


                    <div
                        id="semestrePerfil"
                        class="info-valor"
                    >

                        Não informado

                    </div>

                </div>


                <div class="info">

                    <div class="info-label">

                        🏆 Nível

                    </div>


                    <div
                        id="nivelPerfil"
                        class="info-valor"
                    >

                        Membro

                    </div>

                </div>

            </div>


            <!-- =========================
                 BOTÃO EDITAR
            ========================== -->

            <div class="area-editar">

                <button
                    class="btn-editar"
                    onclick="abrirEditor()"
                >

                    ✏️ Editar perfil

                </button>

            </div>


            <!-- =========================
                 EDITOR
            ========================== -->

            <div
                id="editor"
                class="editor"
            >


                <h2>

                    Editar perfil

                </h2>


                <div class="campo">

                    <label for="editarNome">

                        Nome

                    </label>


                    <input
                        id="editarNome"
                        type="text"
                        maxlength="100"
                        placeholder="Seu nome"
                    >

                </div>


                <div class="campo">

                    <label for="editarUsername">

                        Username

                    </label>


                    <input
                        id="editarUsername"
                        type="text"
                        maxlength="30"
                        placeholder="seuusername"
                    >

                </div>


                <div class="campo">

                    <label for="editarBio">

                        Bio

                    </label>


                    <textarea
                        id="editarBio"
                        maxlength="250"
                        placeholder="Conte um pouco sobre você..."
                        oninput="atualizarContadorBio()"
                    ></textarea>


                    <div
                        id="contadorBio"
                        class="contador-bio"
                    >

                        0/250

                    </div>

                </div>


                <div
                    id="status"
                    class="status"
                ></div>


                <div class="botoes-editor">


                    <button
                        class="btn-salvar"
                        onclick="salvarPerfil()"
                    >

                        💾 Salvar alterações

                    </button>


                    <button
                        class="btn-cancelar"
                        onclick="fecharEditor()"
                    >

                        Cancelar

                    </button>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* =================================
   VARIÁVEIS
================================= */

let usuarioAtual = null;

let perfilAtual = null;


/* =================================
   INICIAR
================================= */

async function iniciar() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        mostrarStatus(
            "Erro ao verificar login.",
            "erro"
        );

        return;

    }


    usuarioAtual =
        data.session?.user;


    if (!usuarioAtual) {

        window.location.href =
            "index.html";

        return;

    }


    carregarPerfil();

}


/* =================================
   CARREGAR PERFIL
================================= */

async function carregarPerfil() {

    const { data, error } =
        await window.supabaseClient

            .from("profiles")

            .select(`
                id,
                nome,
                username,
                curso,
                semestre,
                nivel,
                tipo_conta,
                bio,
                avatar_url
            `)

            .eq(
                "id",
                usuarioAtual.id
            )

            .single();


    if (error) {

        console.error(error);

        document.getElementById(
            "carregando"
        ).innerHTML =
            "Erro ao carregar perfil.";

        return;

    }


    perfilAtual = data;


    preencherPerfil(data);


    document.getElementById(
        "carregando"
    ).style.display = "none";


    document.getElementById(
        "perfilCard"
    ).style.display = "block";

}


/* =================================
   PREENCHER PERFIL
================================= */

function preencherPerfil(perfil) {


    document.getElementById(
        "nomePerfil"
    ).textContent =
        perfil.nome || "Usuário";


    document.getElementById(
        "usernamePerfil"
    ).textContent =
        "@" +
        (
            perfil.username ||
            "usuario"
        );


    document.getElementById(
        "cursoPerfil"
    ).textContent =
        perfil.curso ||
        "Não informado";


    document.getElementById(
        "semestrePerfil"
    ).textContent =
        perfil.semestre ||
        "Não informado";


    document.getElementById(
        "nivelPerfil"
    ).textContent =
        perfil.nivel ||
        "Membro";


    /* =========================
       TIPO DE CONTA
    ========================= */

    const tipo =
        perfil.tipo_conta ||
        "Aluno";


    let icone = "👤";


    if (
        tipo
            .toLowerCase()
            .includes("professor")
    ) {

        icone = "👨‍🏫";

    }


    document.getElementById(
        "badgePerfil"
    ).textContent =
        `${icone} ${tipo}`;


    /* =========================
       BIO
    ========================= */

    const bio =
        document.getElementById(
            "bioPerfil"
        );


    if (perfil.bio) {

        bio.textContent =
            perfil.bio;

        bio.classList.remove(
            "sem-bio"
        );

    } else {

        bio.innerHTML =
            `<span class="sem-bio">
                Nenhuma bio adicionada ainda.
            </span>`;

    }


    /* =========================
       FOTO
    ========================= */

    const foto =
        document.getElementById(
            "fotoPerfil"
        );


    if (perfil.avatar_url) {

        foto.src =
            perfil.avatar_url;

    } else {

        foto.src =
            criarAvatarPadrao(
                perfil.nome
            );

    }


    /* =========================
       CAMPOS DO EDITOR
    ========================= */

    document.getElementById(
        "editarNome"
    ).value =
        perfil.nome || "";


    document.getElementById(
        "editarUsername"
    ).value =
        perfil.username || "";


    document.getElementById(
        "editarBio"
    ).value =
        perfil.bio || "";


    atualizarContadorBio();

}


/* =================================
   AVATAR PADRÃO
================================= */

function criarAvatarPadrao(nome) {

    const inicial =
        (
            nome ||
            "U"
        )
        .charAt(0)
        .toUpperCase();


    return (
        "https://ui-avatars.com/api/" +
        "?name=" +
        encodeURIComponent(inicial) +
        "&background=6258e8" +
        "&color=ffffff" +
        "&size=300"
    );

}


/* =================================
   ABRIR EDITOR
================================= */

function abrirEditor() {

    document
        .getElementById("editor")
        .classList.add("ativo");


    document
        .getElementById("editor")
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

}


/* =================================
   FECHAR EDITOR
================================= */

function fecharEditor() {

    document
        .getElementById("editor")
        .classList.remove("ativo");


    limparStatus();

}


/* =================================
   CONTADOR BIO
================================= */

function atualizarContadorBio() {

    const campo =
        document.getElementById(
            "editarBio"
        );


    const contador =
        document.getElementById(
            "contadorBio"
        );


    contador.textContent =
        `${campo.value.length}/250`;

}


/* =================================
   SALVAR PERFIL
================================= */

async function salvarPerfil() {

    const nome =
        document
            .getElementById("editarNome")
            .value
            .trim();


    let username =
        document
            .getElementById("editarUsername")
            .value
            .trim()
            .toLowerCase();


    const bio =
        document
            .getElementById("editarBio")
            .value
            .trim();


    if (!nome) {

        mostrarStatus(
            "Digite seu nome.",
            "erro"
        );

        return;

    }


    if (!username) {

        mostrarStatus(
            "Digite um username.",
            "erro"
        );

        return;

    }


    /* Remove espaços */

    username =
        username.replace(
            /\s/g,
            ""
        );


    /* =========================
       ATUALIZAR
    ========================= */

    const { data, error } =
        await window.supabaseClient

            .from("profiles")

            .update({

                nome:
                    nome,

                username:
                    username,

                bio:
                    bio || null

            })

            .eq(
                "id",
                usuarioAtual.id
            )

            .select()
            .single();


    if (error) {

        console.error(error);


        if (
            error.message
                .toLowerCase()
                .includes("duplicate")
        ) {

            mostrarStatus(
                "Esse username já está sendo usado.",
                "erro"
            );

        } else {

            mostrarStatus(
                "Erro ao salvar: " +
                error.message,
                "erro"
            );

        }


        return;

    }


    perfilAtual = data;


    preencherPerfil(data);


    mostrarStatus(
        "Perfil atualizado com sucesso! 🎉",
        "sucesso"
    );


    setTimeout(() => {

        fecharEditor();

    }, 1500);

}


/* =================================
   ALTERAR FOTO
================================= */

async function alterarFoto(event) {

    const arquivo =
        event.target.files[0];


    if (!arquivo) {
        return;
    }


    /* =========================
       VERIFICAR TIPO
    ========================= */

    const tiposPermitidos = [

        "image/jpeg",

        "image/png",

        "image/webp"

    ];


    if (
        !tiposPermitidos.includes(
            arquivo.type
        )
    ) {

        alert(
            "Escolha uma imagem JPG, PNG ou WEBP."
        );

        event.target.value = "";

        return;

    }


    /* =========================
       LIMITE 5MB
    ========================= */

    if (
        arquivo.size >
        5 * 1024 * 1024
    ) {

        alert(
            "A imagem deve ter no máximo 5 MB."
        );

        event.target.value = "";

        return;

    }


    const foto =
        document.getElementById(
            "fotoPerfil"
        );


    const fotoAnterior =
        foto.src;


    /* Preview imediato */

    foto.src =
        URL.createObjectURL(
            arquivo
        );


    try {


        /* =========================
           NOME DO ARQUIVO
        ========================= */

        const extensao =
            arquivo.name
                .split(".")
                .pop();


        const nomeArquivo =
            usuarioAtual.id +
            "-" +
            Date.now() +
            "." +
            extensao;


        const caminho =
            usuarioAtual.id +
            "/" +
            nomeArquivo;


        /* =========================
           UPLOAD
        ========================= */

        const { error:
            uploadError
        } = await window.supabaseClient

            .storage

            .from("avatars")

            .upload(
                caminho,
                arquivo,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


        if (uploadError) {

            console.error(
                uploadError
            );


            foto.src =
                fotoAnterior;


            alert(
                "Erro ao enviar foto: " +
                uploadError.message
            );


            return;

        }


        /* =========================
           URL PÚBLICA
        ========================= */

        const { data:
            urlData
        } =
            window.supabaseClient

                .storage

                .from("avatars")

                .getPublicUrl(
                    caminho
                );


        const avatarUrl =
            urlData.publicUrl;


        /* =========================
           SALVAR URL
        ========================= */

        const { error:
            updateError
        } =
            await window.supabaseClient

                .from("profiles")

                .update({

                    avatar_url:
                        avatarUrl

                })

                .eq(
                    "id",
                    usuarioAtual.id
                );


        if (updateError) {

            console.error(
                updateError
            );


            foto.src =
                fotoAnterior;


            alert(
                "A foto foi enviada, mas não foi possível salvar no perfil."
            );


            return;

        }


        /* =========================
           SUCESSO
        ========================= */

        perfilAtual.avatar_url =
            avatarUrl;


        foto.src =
            avatarUrl;


        alert(
            "Foto de perfil atualizada! 📷🎉"
        );


    } catch (erro) {

        console.error(erro);


        foto.src =
            fotoAnterior;


        alert(
            "Erro inesperado ao alterar a foto."
        );

    }


    event.target.value = "";

}


/* =================================
   STATUS
================================= */

function mostrarStatus(
    mensagem,
    tipo
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        mensagem;


    status.className =
        "status " +
        tipo;

}


function limparStatus() {

    const status =
        document.getElementById(
            "status"
        );


    status.className =
        "status";


    status.textContent =
        "";

}


/* =================================
   COMUNIDADE
================================= */

function voltarComunidade() {

    window.location.href =
        "comunidade.html";

}


/* =================================
   SAIR
================================= */

async function sair() {

    await window.supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* =================================
   INICIAR
================================= */

iniciar();

</script>
