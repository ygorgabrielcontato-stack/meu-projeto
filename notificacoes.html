<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Notificações - TechCommunity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #171a35 0%,
                    #0b0d17 45%
                );
            color: white;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 70px;
            padding: 0 8%;
            border-bottom: 1px solid #25283a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 13, 23, 0.92);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        .header-botoes {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-header {
            background: #171a29;
            color: white;
            border: 1px solid #292d42;
            padding: 10px 16px;
            border-radius: 9px;
            transition: 0.2s;
        }

        .btn-header:hover {
            background: #25283a;
            transform: translateY(-1px);
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: 92%;
            max-width: 850px;
            margin: 45px auto 80px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
        }

        .topo h1 {
            margin: 0 0 8px;
            font-size: 36px;
        }

        .descricao {
            margin: 0;
            color: #9da3b8;
        }

        .btn-marcar-todas {
            background: #6258e8;
            color: white;
            padding: 11px 17px;
            border-radius: 9px;
            transition: 0.2s;
        }

        .btn-marcar-todas:hover {
            background: #7168f0;
            transform: translateY(-1px);
        }

        /* =========================
           CONTADOR
        ========================= */

        .resumo {
            background: #171a29;
            border: 1px solid #292d42;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .resumo-texto {
            color: #c8ccda;
        }

        .contador-nao-lidas {
            background: #6258e8;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* =========================
           NOTIFICAÇÕES
        ========================= */

        .lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notificacao {
            position: relative;
            background: #171a29;
            border: 1px solid #292d42;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .notificacao:hover {
            transform: translateY(-2px);
            border-color: #414764;
            background: #1a1e30;
        }

        .notificacao.nao-lida {
            border-color: #6258e8;
            background:
                linear-gradient(
                    135deg,
                    rgba(98, 88, 232, 0.12),
                    #171a29
                );
        }

        .notificacao.nao-lida::before {
            content: "";
            position: absolute;
            left: 0;
            top: 16px;
            bottom: 16px;
            width: 3px;
            background: #6258e8;
            border-radius: 0 5px 5px 0;
        }

        /* =========================
           ÍCONE
        ========================= */

        .icone-notificacao {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 14px;
            background: #292d42;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .notificacao-conteudo {
            flex: 1;
            min-width: 0;
        }

        .notificacao-mensagem {
            color: #e4e6ef;
            line-height: 1.5;
            margin: 0 0 8px;
            font-size: 15px;
        }

        .notificacao-data {
            color: #777f97;
            font-size: 12px;
        }

        /* =========================
           AÇÕES
        ========================= */

        .acoes {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .btn-acao {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 9px;
            background: #292d42;
            color: #c8ccda;
            transition: 0.2s;
        }

        .btn-acao:hover {
            background: #3a3f5a;
            color: white;
        }

        .btn-excluir:hover {
            background: #512734;
            color: #ff8d9a;
        }

        /* =========================
           VAZIO
        ========================= */

        .vazio {
            text-align: center;
            padding: 70px 20px;
            background: #171a29;
            border: 1px solid #292d42;
            border-radius: 18px;
        }

        .vazio-icone {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .vazio h2 {
            margin: 0 0 8px;
        }

        .vazio p {
            color: #8e95aa;
            margin: 0;
        }

        /* =========================
           CARREGANDO
        ========================= */

        .carregando {
            text-align: center;
            color: #9da3b8;
            padding: 60px;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 3px solid #292d42;
            border-top-color: #6258e8;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {

            to {
                transform: rotate(360deg);
            }

        }

        /* =========================
           ERRO
        ========================= */

        .erro {
            background: #301820;
            border: 1px solid #6b2636;
            color: #ff9da9;
            padding: 20px;
            border-radius: 12px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 650px) {

            header {
                padding: 0 5%;
            }

            .logo {
                font-size: 20px;
            }

            .header-botoes button {
                padding: 8px 10px;
            }

            main {
                width: 94%;
                margin-top: 30px;
            }

            .topo {
                flex-direction: column;
                align-items: stretch;
            }

            .topo h1 {
                font-size: 30px;
            }

            .btn-marcar-todas {
                width: 100%;
            }

            .notificacao {
                padding: 16px;
            }

            .icone-notificacao {
                width: 42px;
                height: 42px;
                min-width: 42px;
                font-size: 19px;
            }

            .acoes {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>


    <div class="header-botoes">

        <button
            class="btn-header"
            onclick="voltarComunidade()">

            ← Comunidade

        </button>


        <button
            class="btn-header"
            onclick="perfil()">

            👤 Perfil

        </button>

    </div>

</header>


<main>


    <div class="topo">

        <div>

            <h1>
                Notificações
            </h1>

            <p class="descricao">
                Acompanhe as novidades da comunidade.
            </p>

        </div>


        <button
            class="btn-marcar-todas"
            onclick="marcarTodasComoLidas()">

            ✓ Marcar todas como lidas

        </button>

    </div>


    <div class="resumo">

        <span class="resumo-texto">

            Suas notificações

        </span>


        <span
            id="contadorNaoLidas"
            class="contador-nao-lidas">

            0 novas

        </span>

    </div>


    <div
        id="listaNotificacoes"
        class="lista">

        <div class="carregando">

            <div class="spinner"></div>

            Carregando notificações...

        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* ================================
   VARIÁVEIS
================================ */

let usuarioAtual = null;


/* ================================
   VERIFICAR LOGIN
================================ */

async function verificarLogin() {

    const {
        data,
        error
    } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        mostrarErro(
            "Erro ao verificar login."
        );

        return;

    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return;

    }


    usuarioAtual =
        data.session.user;


    carregarNotificacoes();

}


/* ================================
   CARREGAR NOTIFICAÇÕES
================================ */

async function carregarNotificacoes() {

    const container =
        document.getElementById(
            "listaNotificacoes"
        );


    const {
        data,
        error
    } =
        await window.supabaseClient

            .from("notificacoes")

            .select(`
                id,
                autor_id,
                tipo,
                mensagem,
                post_id,
                resposta_id,
                lida,
                created_at
            `)

            .eq(
                "user_id",
                usuarioAtual.id
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Erro ao carregar notificações:",
            error
        );


        container.innerHTML = `

            <div class="erro">

                Erro ao carregar notificações:

                <br><br>

                ${escaparHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    const notificacoes =
        data || [];


    atualizarContador(
        notificacoes
    );


    if (
        notificacoes.length === 0
    ) {

        container.innerHTML = `

            <div class="vazio">

                <div class="vazio-icone">
                    🔔
                </div>

                <h2>
                    Tudo tranquilo por aqui!
                </h2>

                <p>
                    Você ainda não recebeu nenhuma notificação.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    notificacoes.forEach(
        notificacao => {

            criarNotificacao(
                notificacao
            );

        }
    );

}


/* ================================
   CRIAR NOTIFICAÇÃO
================================ */

function criarNotificacao(
    notificacao
) {

    const container =
        document.getElementById(
            "listaNotificacoes"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "notificacao" +
        (
            !notificacao.lida
                ? " nao-lida"
                : ""
        );


    const icone =
        obterIcone(
            notificacao.tipo
        );


    const dataFormatada =
        formatarData(
            notificacao.created_at
        );


    div.innerHTML = `

        <div class="icone-notificacao">

            ${icone}

        </div>


        <div
            class="notificacao-conteudo"
            onclick="abrirNotificacao('${notificacao.id}', '${notificacao.post_id || ""}')"
            style="cursor:pointer;">

            <p class="notificacao-mensagem">

                ${escaparHTML(
                    notificacao.mensagem
                )}

            </p>


            <div class="notificacao-data">

                ${dataFormatada}

                ${
                    !notificacao.lida
                        ? " · <strong style='color:#8d84ff;'>Nova</strong>"
                        : ""
                }

            </div>

        </div>


        <div class="acoes">

            ${
                !notificacao.lida

                ?

                `
                <button
                    class="btn-acao"
                    title="Marcar como lida"
                    onclick="marcarComoLida(event, '${notificacao.id}')">

                    ✓

                </button>
                `

                :

                ""
            }


            <button
                class="btn-acao btn-excluir"
                title="Excluir notificação"
                onclick="excluirNotificacao(event, '${notificacao.id}')">

                🗑

            </button>

        </div>

    `;


    container.appendChild(
        div
    );

}


/* ================================
   ÍCONE POR TIPO
================================ */

function obterIcone(
    tipo
) {

    if (!tipo) {

        return "🔔";

    }


    const tipoNormalizado =
        tipo
            .toLowerCase()
            .trim();


    if (
        tipoNormalizado.includes(
            "resposta"
        )
    ) {

        return "💬";

    }


    if (
        tipoNormalizado.includes(
            "curtida"
        )
        ||
        tipoNormalizado.includes(
            "like"
        )
    ) {

        return "❤️";

    }


    if (
        tipoNormalizado.includes(
            "post"
        )
        ||
        tipoNormalizado.includes(
            "pergunta"
        )
    ) {

        return "📚";

    }


    return "🔔";

}


/* ================================
   CONTADOR
================================ */

function atualizarContador(
    notificacoes
) {

    const contador =
        document.getElementById(
            "contadorNaoLidas"
        );


    const quantidade =
        notificacoes.filter(
            notificacao =>
                !notificacao.lida
        ).length;


    contador.textContent =
        quantidade === 1
            ? "1 nova"
            : `${quantidade} novas`;

}


/* ================================
   MARCAR COMO LIDA
================================ */

async function marcarComoLida(
    event,
    notificacaoId
) {

    event.stopPropagation();


    const {
        error
    } =
        await window.supabaseClient

            .from("notificacoes")

            .update({
                lida: true
            })

            .eq(
                "id",
                notificacaoId
            )

            .eq(
                "user_id",
                usuarioAtual.id
            );


    if (error) {

        console.error(error);

        alert(
            "Erro ao marcar como lida: " +
            error.message
        );

        return;

    }


    carregarNotificacoes();

}


/* ================================
   MARCAR TODAS
================================ */

async function marcarTodasComoLidas() {

    const {
        error
    } =
        await window.supabaseClient

            .from("notificacoes")

            .update({
                lida: true
            })

            .eq(
                "user_id",
                usuarioAtual.id
            )

            .eq(
                "lida",
                false
            );


    if (error) {

        console.error(error);

        alert(
            "Erro ao marcar notificações: " +
            error.message
        );

        return;

    }


    carregarNotificacoes();

}


/* ================================
   EXCLUIR
================================ */

async function excluirNotificacao(
    event,
    notificacaoId
) {

    event.stopPropagation();


    const {
        error
    } =
        await window.supabaseClient

            .from("notificacoes")

            .delete()

            .eq(
                "id",
                notificacaoId
            )

            .eq(
                "user_id",
                usuarioAtual.id
            );


    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir notificação: " +
            error.message
        );

        return;

    }


    carregarNotificacoes();

}


/* ================================
   ABRIR NOTIFICAÇÃO
================================ */

async function abrirNotificacao(
    notificacaoId,
    postId
) {

    /* Marca como lida */

    await window.supabaseClient

        .from("notificacoes")

        .update({
            lida: true
        })

        .eq(
            "id",
            notificacaoId
        )

        .eq(
            "user_id",
            usuarioAtual.id
        );


    /*
       Se houver post relacionado,
       abre a pergunta.
    */

    if (postId) {

        window.location.href =
            "post.html?id=" +
            postId;

        return;

    }


    carregarNotificacoes();

}


/* ================================
   FORMATAR DATA
================================ */

function formatarData(
    data
) {

    if (!data) {

        return "";

    }


    const dataNotificacao =
        new Date(data);


    const agora =
        new Date();


    const diferenca =
        agora -
        dataNotificacao;


    const segundos =
        Math.floor(
            diferenca / 1000
        );


    if (segundos < 60) {

        return "Agora mesmo";

    }


    const minutos =
        Math.floor(
            segundos / 60
        );


    if (minutos < 60) {

        return minutos === 1
            ? "Há 1 minuto"
            : `Há ${minutos} minutos`;

    }


    const horas =
        Math.floor(
            minutos / 60
        );


    if (horas < 24) {

        return horas === 1
            ? "Há 1 hora"
            : `Há ${horas} horas`;

    }


    const dias =
        Math.floor(
            horas / 24
        );


    if (dias < 7) {

        return dias === 1
            ? "Ontem"
            : `Há ${dias} dias`;

    }


    return dataNotificacao.toLocaleDateString(
        "pt-BR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* ================================
   PROTEÇÃO HTML
================================ */

function escaparHTML(
    texto
) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================================
   NAVEGAÇÃO
================================ */

function voltarComunidade() {

    window.location.href =
        "comunidade.html";

}


function perfil() {

    window.location.href =
        "perfil.html";

}


/* ================================
   ERRO
================================ */

function mostrarErro(
    mensagem
) {

    document.getElementById(
        "listaNotificacoes"
    ).innerHTML = `

        <div class="erro">

            ${escaparHTML(
                mensagem
            )}

        </div>

    `;

}


/* ================================
   INICIAR
================================ */

verificarLogin();

</script>


</body>

</html>
