<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comunidade - TechCommunity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d17;
            color: white;
        }

        header {
            height: 70px;
            padding: 0 8%;
            border-bottom: 1px solid #25283a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0d17;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        .header-botoes {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-header {
            background: #171a29;
            color: white;
            border: 1px solid #292d42;
            padding: 10px 16px;
            border-radius: 9px;
        }

        .btn-header:hover {
            background: #25283a;
        }

        main {
            width: 92%;
            max-width: 850px;
            margin: 35px auto 70px;
        }

        .titulo-area {
            margin-bottom: 25px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .descricao {
            color: #9da3b8;
            margin-top: 0;
        }

        /* =========================
           CRIAR PERGUNTA
        ========================= */

        .criar-post {
            background: #171a29;
            border: 1px solid #292d42;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 40px;
        }

        .criar-post h2 {
            margin-top: 0;
        }

        input,
        textarea,
        select {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 15px;
            padding: 14px;
            background: #0d0f19;
            border: 1px solid #30344b;
            border-radius: 9px;
            color: white;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6258e8;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn-publicar {
            background: #6258e8;
            color: white;
            padding: 12px 20px;
            border-radius: 9px;
        }

        .btn-publicar:hover {
            background: #7168f0;
        }

        /* =========================
           POST
        ========================= */

        .post {
            background: #111421;
            border: 1px solid #292d42;
            padding: 24px;
            border-radius: 18px;
            margin-top: 18px;
            transition: 0.2s;
        }

        .post:hover {
            border-color: #3a3f5a;
        }

        .post h2 {
            margin: 0 0 10px;
            font-size: 21px;
            line-height: 1.4;
        }

        .post-info {
            color: #8e95aa;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .post-conteudo {
            color: #c8ccda;
            line-height: 1.7;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        /* =========================
           AÇÕES
        ========================= */

        .acoes-post {
            display: flex;
            align-items: center;
            gap: 18px;
            border-top: 1px solid #25283a;
            padding-top: 16px;
        }

        .acao {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #9da3b8;
        }

        /* CORAÇÃO */

        .botao-coracao {
            background: transparent;
            color: #9da3b8;
            font-size: 28px;
            padding: 0;
            line-height: 1;
            transition: transform 0.15s ease;
        }

        .botao-coracao:hover {
            transform: scale(1.15);
        }

        .botao-coracao.curtido {
            color: #ff3b6b;
            animation: coracao 0.25s ease;
        }

        @keyframes coracao {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.35);
            }

            100% {
                transform: scale(1);
            }

        }

        .contador-curtidas {
            color: #c8ccda;
            font-size: 14px;
        }

        .botao-ver {
            margin-left: auto;
            background: transparent;
            color: #8e95aa;
            padding: 8px 0;
        }

        .botao-ver:hover {
            color: white;
        }

        /* =========================
           RESPOSTAS
        ========================= */

        .respostas {
            margin-top: 22px;
            border-top: 1px solid #25283a;
            padding-top: 18px;
        }

        .respostas h3 {
            font-size: 16px;
            color: #c8ccda;
        }

        .resposta {
            background: #0d0f19;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #25283a;
        }

        .resposta strong {
            font-size: 14px;
        }

        .resposta p {
            color: #c8ccda;
            line-height: 1.5;
            margin-bottom: 0;
        }

        /* =========================
           RESPONDER
        ========================= */

        .responder-area {
            margin-top: 20px;
        }

        .responder-area textarea {
            min-height: 80px;
        }

        .btn-responder {
            background: #292d42;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .btn-responder:hover {
            background: #6258e8;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 0 5%;
            }

            .logo {
                font-size: 20px;
            }

            .btn-header {
                padding: 8px 10px;
            }

            main {
                width: 94%;
                margin-top: 25px;
            }

            h1 {
                font-size: 30px;
            }

            .post,
            .criar-post {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>


    <div class="header-botoes">

        <button
            class="btn-header"
            onclick="perfil()"
        >
            👤 Perfil
        </button>


        <button
            class="btn-header"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

</header>


<main>


    <div class="titulo-area">

        <h1>
            Comunidade
        </h1>

        <p class="descricao">
            Tire dúvidas, compartilhe conhecimento e ajude quem está começando.
        </p>

    </div>


    <!-- =========================
         CRIAR PERGUNTA
    ========================== -->

    <div class="criar-post">

        <h2>
            Faça uma pergunta
        </h2>


        <input
            id="titulo"
            type="text"
            placeholder="Título da sua pergunta"
        >


        <select id="categoria">

            <option value="Geral">
                Geral
            </option>

            <option value="Programação">
                Programação
            </option>

            <option value="Banco de Dados">
                Banco de Dados
            </option>

            <option value="Redes">
                Redes
            </option>

            <option value="Hardware">
                Hardware
            </option>

        </select>


        <textarea
            id="conteudo"
            placeholder="Explique sua dúvida..."
        ></textarea>


        <button
            class="btn-publicar"
            onclick="criarPost()"
        >
            Publicar pergunta
        </button>

    </div>


    <h2>
        Perguntas recentes
    </h2>


    <div id="posts">
        Carregando perguntas...
    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* =================================
   USUÁRIO LOGADO
================================= */

let usuarioLogado = null;


/* =================================
   VERIFICAR LOGIN
================================= */

async function verificarLogin() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        alert(
            "Erro ao verificar login."
        );

        return;
    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return;
    }


    usuarioLogado =
        data.session.user;


    carregarPosts();

}


/* =================================
   CRIAR PERGUNTA
================================= */

async function criarPost() {

    const titulo =
        document
            .getElementById("titulo")
            .value
            .trim();


    const conteudo =
        document
            .getElementById("conteudo")
            .value
            .trim();


    const categoria =
        document
            .getElementById("categoria")
            .value;


    if (!titulo || !conteudo) {

        alert(
            "Preencha o título e o conteúdo."
        );

        return;
    }


    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;
    }


    const { error } =
        await window.supabaseClient
            .from("posts")
            .insert({

                author_id:
                    usuarioLogado.id,

                titulo:
                    titulo,

                conteudo:
                    conteudo,

                categoria:
                    categoria

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao publicar: " +
            error.message
        );

        return;
    }


    alert(
        "Pergunta publicada! 🎉"
    );


    document
        .getElementById("titulo")
        .value = "";


    document
        .getElementById("conteudo")
        .value = "";


    carregarPosts();

}


/* =================================
   CARREGAR POSTS
================================= */

async function carregarPosts() {

    const { data, error } =
        await window.supabaseClient
            .from("posts")
            .select(`
                id,
                titulo,
                conteudo,
                categoria,
                created_at,
                profiles (
                    nome,
                    username,
                    nivel
                )
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        document
            .getElementById("posts")
            .innerHTML =
                "Erro ao carregar perguntas.";

        return;
    }


    const container =
        document.getElementById("posts");


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>Nenhuma pergunta ainda. Seja o primeiro a perguntar!</p>";

        return;
    }


    container.innerHTML = "";


    for (const post of data) {

        const nome =
            post.profiles?.nome ||
            "Usuário";


        const nivel =
            post.profiles?.nivel ||
            "Membro";


        const div =
            document.createElement("div");


        div.className =
            "post";


        div.innerHTML = `

            <h2>
                ${post.titulo}
            </h2>


            <div class="post-info">

                👤 ${nome}

                · ${nivel}

                · ${post.categoria}

            </div>


            <p class="post-conteudo">
                ${post.conteudo}
            </p>


            <div class="acoes-post">


                <div class="acao">

                    <button
                        id="curtir-${post.id}"
                        class="botao-coracao"
                        onclick="alternarCurtida('${post.id}')"
                        aria-label="Curtir"
                    >
                        ♡
                    </button>


                    <span
                        id="contador-${post.id}"
                        class="contador-curtidas"
                    >
                        0 curtidas
                    </span>

                </div>


                <button
                    class="botao-ver"
                    onclick="abrirPost('${post.id}')"
                >
                    🔎 Ver pergunta
                </button>

            </div>


            <div
                class="respostas"
                id="respostas-${post.id}"
            >
                Carregando respostas...
            </div>


            <div class="responder-area">

                <textarea
                    id="resposta-${post.id}"
                    placeholder="Escreva sua resposta..."
                ></textarea>


                <button
                    class="btn-responder"
                    onclick="responder('${post.id}')"
                >
                    💬 Responder
                </button>

            </div>

        `;


        container.appendChild(div);


        carregarRespostas(
            post.id
        );


        carregarCurtidas(
            post.id
        );

    }

}


/* =================================
   CARREGAR CURTIDAS
================================= */

async function carregarCurtidas(postId) {

    const contador =
        document.getElementById(
            `contador-${postId}`
        );


    const botao =
        document.getElementById(
            `curtir-${postId}`
        );


    const { data, error } =
        await window.supabaseClient
            .from("curtidas")
            .select("user_id")
            .eq(
                "post_id",
                postId
            );


    if (error) {

        console.error(error);

        contador.textContent =
            "Erro ao carregar curtidas.";

        return;
    }


    const quantidade =
        data?.length || 0;


    contador.textContent =
        quantidade === 1
            ? "1 curtida"
            : `${quantidade} curtidas`;


    const usuarioCurtiu =
        data?.some(
            curtida =>
                curtida.user_id ===
                usuarioLogado?.id
        );


    if (usuarioCurtiu) {

        botao.textContent =
            "♥";

        botao.classList.add(
            "curtido"
        );

    } else {

        botao.textContent =
            "♡";

        botao.classList.remove(
            "curtido"
        );

    }

}


/* =================================
   CURTIR / DESCURTIR
================================= */

async function alternarCurtida(postId) {

    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;
    }


    const botao =
        document.getElementById(
            `curtir-${postId}`
        );


    /*
       Verifica se o usuário
       já curtiu.
    */

    const { data, error } =
        await window.supabaseClient
            .from("curtidas")
            .select("id")
            .eq(
                "post_id",
                postId
            )
            .eq(
                "user_id",
                usuarioLogado.id
            );


    if (error) {

        console.error(error);

        alert(
            "Erro ao verificar curtida: " +
            error.message
        );

        return;
    }


    /*
       Se já curtiu,
       remove a curtida.
    */

    if (
        data &&
        data.length > 0
    ) {

        const { error: deleteError } =
            await window.supabaseClient
                .from("curtidas")
                .delete()
                .eq(
                    "id",
                    data[0].id
                );


        if (deleteError) {

            console.error(
                deleteError
            );

            alert(
                "Erro ao remover curtida: " +
                deleteError.message
            );

            return;
        }


    }

    /*
       Se ainda não curtiu,
       cria a curtida.
    */

    else {

        const { error: insertError } =
            await window.supabaseClient
                .from("curtidas")
                .insert({

                    post_id:
                        postId,

                    user_id:
                        usuarioLogado.id

                });


        if (insertError) {

            console.error(
                insertError
            );

            alert(
                "Erro ao curtir: " +
                insertError.message
            );

            return;
        }

    }


    /*
       Atualiza o coração
       e o contador.
    */

    carregarCurtidas(
        postId
    );

}


/* =================================
   CARREGAR RESPOSTAS
================================= */

async function carregarRespostas(postId) {

    const container =
        document.getElementById(
            `respostas-${postId}`
        );


    if (!container) {
        return;
    }


    const { data, error } =
        await window.supabaseClient
            .from("respostas")
            .select(`
                id,
                conteudo,
                created_at,
                profiles (
                    nome,
                    username
                )
            `)
            .eq(
                "post_id",
                postId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Erro ao carregar respostas.</p>";

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        container.innerHTML =
            "<p style='color:#8e95aa;'>Nenhuma resposta ainda.</p>";

        return;
    }


    container.innerHTML = `

        <h3>
            💬 Respostas (${data.length})
        </h3>

    `;


    data.forEach(
        resposta => {

            const nome =
                resposta
                    .profiles
                    ?.nome ||
                "Usuário";


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "resposta";


            div.innerHTML = `

                <strong>
                    👤 ${nome}
                </strong>

                <p>
                    ${resposta.conteudo}
                </p>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =================================
   RESPONDER
================================= */

async function responder(postId) {

    const campo =
        document.getElementById(
            `resposta-${postId}`
        );


    if (!campo) {
        return;
    }


    const conteudo =
        campo.value.trim();


    if (!conteudo) {

        alert(
            "Escreva uma resposta."
        );

        return;
    }


    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;
    }


    const { error } =
        await window.supabaseClient
            .from("respostas")
            .insert({

                post_id:
                    postId,

                author_id:
                    usuarioLogado.id,

                conteudo:
                    conteudo

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao responder: " +
            error.message
        );

        return;
    }


    campo.value = "";


    alert(
        "Resposta publicada! 🎉"
    );


    carregarRespostas(
        postId
    );

}


/* =================================
   ABRIR POST
================================= */

function abrirPost(postId) {

    window.location.href =
        "post.html?id=" +
        postId;

}


/* =================================
   PERFIL
================================= */

function perfil() {

    window.location.href =
        "perfil.html";

}


/* =================================
   SAIR
================================= */

async function sair() {

    await window.supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* =================================
   INICIAR
================================= */

verificarLogin();

</script>


</body>

</html>
