<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comunidade - TechCommunity</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d17;
            color: white;
        }

        header {
            padding: 20px 8%;
            border-bottom: 1px solid #25283a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        main {
            width: 80%;
            max-width: 1000px;
            margin: 40px auto;
        }

        h1 {
            font-size: 36px;
        }

        .descricao {
            color: #9da3b8;
        }

        .criar-post {
            background: #171a29;
            border: 1px solid #292d42;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            margin-bottom: 15px;
            padding: 14px;
            background: #0d0f19;
            border: 1px solid #30344b;
            border-radius: 8px;
            color: white;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: #6258e8;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .post {
            background: #171a29;
            border: 1px solid #292d42;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .post h2 {
            margin-top: 0;
        }

        .post-info {
            color: #8e95aa;
            font-size: 14px;
        }

        .post-conteudo {
            color: #c8ccda;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>

    <button onclick="sair()">
        Sair
    </button>

</header>

<main>

    <h1>Comunidade</h1>

    <p class="descricao">
        Tire dúvidas, compartilhe conhecimento e ajude quem está começando.
    </p>

    <div class="criar-post">

        <h2>Faça uma pergunta</h2>

        <input
            id="titulo"
            type="text"
            placeholder="Título da sua pergunta"
        >

        <select id="categoria">

            <option value="Geral">Geral</option>
            <option value="Programação">Programação</option>
            <option value="Banco de Dados">Banco de Dados</option>
            <option value="Redes">Redes</option>
            <option value="Hardware">Hardware</option>

        </select>

        <textarea
            id="conteudo"
            placeholder="Explique sua dúvida..."
        ></textarea>

        <button onclick="criarPost()">
            Publicar pergunta
        </button>

    </div>

    <h2 style="margin-top: 50px;">
        Perguntas recentes
    </h2>

    <div id="posts">
        Carregando perguntas...
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>

async function verificarLogin() {

    const { data } =
        await window.supabaseClient.auth.getSession();

    if (!data.session) {

        window.location.href = "index.html";

        return;
    }

    carregarPosts();
}


async function criarPost() {

    const titulo =
        document.getElementById("titulo").value.trim();

    const conteudo =
        document.getElementById("conteudo").value.trim();

    const categoria =
        document.getElementById("categoria").value;


    if (!titulo || !conteudo) {

        alert("Preencha o título e o conteúdo.");

        return;
    }


    const { data: sessionData } =
        await window.supabaseClient.auth.getSession();

    const user = sessionData.session?.user;


    if (!user) {

        alert("Você precisa estar logado.");

        window.location.href = "index.html";

        return;
    }


    const { error } =
        await window.supabaseClient
            .from("posts")
            .insert({

                author_id: user.id,

                titulo: titulo,

                conteudo: conteudo,

                categoria: categoria

            });


    if (error) {

        console.error(error);

        alert("Erro ao publicar: " + error.message);

        return;
    }


    alert("Pergunta publicada! 🎉");


    document.getElementById("titulo").value = "";

    document.getElementById("conteudo").value = "";


    carregarPosts();
}


async function carregarPosts() {

    const { data, error } =
        await window.supabaseClient
            .from("posts")
            .select(`
                id,
                titulo,
                conteudo,
                categoria,
                created_at,
                profiles (
                    nome,
                    username,
                    nivel
                )
            `)
            .order("created_at", { ascending: false });


    if (error) {

        console.error(error);

        document.getElementById("posts").innerHTML =
            "Erro ao carregar perguntas.";

        return;
    }


    const container =
        document.getElementById("posts");


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>Nenhuma pergunta ainda. Seja o primeiro a perguntar!</p>";

        return;
    }


    container.innerHTML = "";


    data.forEach(post => {

        const nome =
            post.profiles?.nome || "Usuário";

        const nivel =
            post.profiles?.nivel || "Membro";


        const div =
            document.createElement("div");

        div.className = "post";


        div.innerHTML = `

            <h2>${post.titulo}</h2>

            <div class="post-info">
                👤 ${nome}
                · ${nivel}
                · ${post.categoria}
            </div>

            <p class="post-conteudo">
                ${post.conteudo}
            </p>

        `;


        container.appendChild(div);

    });
}


async function sair() {

    await window.supabaseClient.auth.signOut();

    window.location.href = "index.html";
}


verificarLogin();

</script>

</body>

</html>
