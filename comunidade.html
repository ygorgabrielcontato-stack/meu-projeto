<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Comunidade - TechCommunity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #0b0d17;

            color: white;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            padding: 20px 8%;

            border-bottom: 1px solid #25283a;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #6c63ff;

        }


        .header-botoes {

            display: flex;

            gap: 10px;

        }


        /* =========================
           BOTÕES
        ========================= */

        button {

            background: #6258e8;

            border: none;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

        }


        button:hover {

            opacity: 0.9;

        }


        .btn-secundario {

            background: #292d42;

        }


        /* =========================
           MAIN
        ========================= */

        main {

            width: 90%;

            max-width: 1000px;

            margin: 40px auto 80px;

        }


        h1 {

            font-size: 36px;

            margin-bottom: 8px;

        }


        .descricao {

            color: #9da3b8;

            margin-top: 0;

        }


        /* =========================
           CRIAR PERGUNTA
        ========================= */

        .criar-post {

            background: #171a29;

            border: 1px solid #292d42;

            padding: 25px;

            border-radius: 15px;

            margin-top: 30px;

        }


        .criar-post h2 {

            margin-top: 0;

        }


        input,
        textarea,
        select {

            width: 100%;

            box-sizing: border-box;

            margin-top: 10px;

            margin-bottom: 15px;

            padding: 14px;

            background: #0d0f19;

            border: 1px solid #30344b;

            border-radius: 8px;

            color: white;

            font-family: Arial, sans-serif;

            outline: none;

        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color: #6258e8;

        }


        textarea {

            min-height: 120px;

            resize: vertical;

        }


        /* =========================
           PESQUISA
        ========================= */

        .filtros {

            background: #171a29;

            border: 1px solid #292d42;

            border-radius: 15px;

            padding: 20px;

            margin-top: 35px;

        }


        .filtros h2 {

            margin-top: 0;

            margin-bottom: 15px;

        }


        .pesquisa-area {

            display: flex;

            gap: 10px;

        }


        .pesquisa-area input {

            margin: 0;

            flex: 1;

        }


        .pesquisa-area button {

            white-space: nowrap;

        }


        .categorias {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-top: 15px;

        }


        .categoria-btn {

            background: #292d42;

            color: #c8ccda;

            padding: 9px 14px;

            border-radius: 20px;

            border: 1px solid #363b54;

            font-size: 13px;

        }


        .categoria-btn:hover {

            background: #6258e8;

        }


        .categoria-btn.ativa {

            background: #6258e8;

            color: white;

            border-color: #6258e8;

        }


        /* =========================
           PERGUNTAS
        ========================= */

        .titulo-perguntas {

            margin-top: 50px;

            margin-bottom: 20px;

        }


        .post {

            background: #171a29;

            border: 1px solid #292d42;

            padding: 25px;

            border-radius: 15px;

            margin-top: 20px;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease;

        }


        .post:hover {

            transform: translateY(-2px);

            border-color: #3b405b;

        }


        .post h2 {

            margin-top: 0;

            margin-bottom: 10px;

        }


        .post-info {

            color: #8e95aa;

            font-size: 14px;

        }


        .post-conteudo {

            color: #c8ccda;

            line-height: 1.6;

            white-space: pre-wrap;

        }


        .botao-ver {

            margin-top: 15px;

            background: #292d42;

        }


        .botao-ver:hover {

            background: #6258e8;

        }


        /* =========================
           RESPOSTAS
        ========================= */

        .respostas {

            margin-top: 25px;

            border-top: 1px solid #292d42;

            padding-top: 15px;

        }


        .resposta {

            background: #0d0f19;

            padding: 15px;

            border-radius: 8px;

            margin-top: 10px;

            border: 1px solid #25283a;

        }


        .resposta p {

            color: #c8ccda;

            line-height: 1.5;

            margin-bottom: 0;

        }


        .responder-area {

            margin-top: 20px;

        }


        .responder-area textarea {

            min-height: 80px;

        }


        /* =========================
           RESULTADOS
        ========================= */

        .resultado-info {

            color: #8e95aa;

            font-size: 14px;

            margin-bottom: 15px;

        }


        .sem-resultados {

            background: #171a29;

            border: 1px solid #292d42;

            border-radius: 15px;

            padding: 35px;

            text-align: center;

            color: #9da3b8;

            margin-top: 20px;

        }


        .carregando {

            text-align: center;

            color: #9da3b8;

            padding: 40px;

        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 650px) {

            header {

                padding: 15px 5%;

            }


            .logo {

                font-size: 20px;

            }


            .header-botoes button {

                padding: 9px 12px;

            }


            main {

                width: 94%;

                margin-top: 25px;

            }


            h1 {

                font-size: 30px;

            }


            .pesquisa-area {

                flex-direction: column;

            }


            .pesquisa-area button {

                width: 100%;

            }


            .post {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        Tech<span>Community</span>

    </div>


    <div class="header-botoes">

        <button onclick="perfil()">

            👤 Meu Perfil

        </button>


        <button
            class="btn-secundario"
            onclick="sair()">

            Sair

        </button>

    </div>

</header>


<main>


    <h1>

        Comunidade

    </h1>


    <p class="descricao">

        Tire dúvidas, compartilhe conhecimento e ajude quem está começando.

    </p>


    <!-- =========================
         CRIAR PERGUNTA
    ========================== -->

    <div class="criar-post">

        <h2>

            Faça uma pergunta

        </h2>


        <input
            id="titulo"
            type="text"
            placeholder="Título da sua pergunta">


        <select id="categoria">

            <option value="Geral">
                Geral
            </option>

            <option value="Programação">
                Programação
            </option>

            <option value="Banco de Dados">
                Banco de Dados
            </option>

            <option value="Redes">
                Redes
            </option>

            <option value="Hardware">
                Hardware
            </option>

        </select>


        <textarea
            id="conteudo"
            placeholder="Explique sua dúvida...">
        </textarea>


        <button onclick="criarPost()">

            Publicar pergunta

        </button>

    </div>


    <!-- =========================
         PESQUISA E FILTROS
    ========================== -->

    <div class="filtros">

        <h2>

            🔎 Encontrar perguntas

        </h2>


        <div class="pesquisa-area">

            <input
                id="pesquisa"
                type="text"
                placeholder="Pesquisar por pergunta, conteúdo ou usuário..."
                oninput="filtrarPosts()">


            <button
                class="btn-secundario"
                onclick="limparFiltros()">

                Limpar

            </button>

        </div>


        <div class="categorias">

            <button
                class="categoria-btn ativa"
                data-categoria="Todas"
                onclick="selecionarCategoria('Todas')">

                Todas

            </button>


            <button
                class="categoria-btn"
                data-categoria="Geral"
                onclick="selecionarCategoria('Geral')">

                Geral

            </button>


            <button
                class="categoria-btn"
                data-categoria="Programação"
                onclick="selecionarCategoria('Programação')">

                💻 Programação

            </button>


            <button
                class="categoria-btn"
                data-categoria="Banco de Dados"
                onclick="selecionarCategoria('Banco de Dados')">

                🗄️ Banco de Dados

            </button>


            <button
                class="categoria-btn"
                data-categoria="Redes"
                onclick="selecionarCategoria('Redes')">

                🌐 Redes

            </button>


            <button
                class="categoria-btn"
                data-categoria="Hardware"
                onclick="selecionarCategoria('Hardware')">

                🖥️ Hardware

            </button>

        </div>

    </div>


    <!-- =========================
         LISTA DE PERGUNTAS
    ========================== -->

    <h2 class="titulo-perguntas">

        Perguntas recentes

    </h2>


    <div
        id="resultadoInfo"
        class="resultado-info">

        Carregando perguntas...

    </div>


    <div id="posts">

        <div class="carregando">

            Carregando perguntas...

        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* ================================
   VARIÁVEIS
================================ */

let todosPosts = [];

let categoriaSelecionada = "Todas";


/* ================================
   VERIFICAR LOGIN
================================ */

async function verificarLogin() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        alert(
            "Erro ao verificar login."
        );

        return;

    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return;

    }


    carregarPosts();

}


/* ================================
   CRIAR PERGUNTA
================================ */

async function criarPost() {

    const titulo =
        document
            .getElementById("titulo")
            .value
            .trim();


    const conteudo =
        document
            .getElementById("conteudo")
            .value
            .trim();


    const categoria =
        document
            .getElementById("categoria")
            .value;


    if (!titulo || !conteudo) {

        alert(
            "Preencha o título e o conteúdo."
        );

        return;

    }


    const { data: sessionData } =
        await window.supabaseClient
            .auth
            .getSession();


    const user =
        sessionData.session?.user;


    if (!user) {

        alert(
            "Você precisa estar logado."
        );

        window.location.href =
            "index.html";

        return;

    }


    const { error } =
        await window.supabaseClient

            .from("posts")

            .insert({

                author_id:
                    user.id,

                titulo:
                    titulo,

                conteudo:
                    conteudo,

                categoria:
                    categoria

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao publicar: " +
            error.message
        );

        return;

    }


    alert(
        "Pergunta publicada! 🎉"
    );


    document
        .getElementById("titulo")
        .value = "";


    document
        .getElementById("conteudo")
        .value = "";


    carregarPosts();

}


/* ================================
   CARREGAR PERGUNTAS
================================ */

async function carregarPosts() {

    const { data, error } =
        await window.supabaseClient

            .from("posts")

            .select(`
                id,
                titulo,
                conteudo,
                categoria,
                created_at,
                profiles (
                    nome,
                    username,
                    nivel
                )
            `)

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        document
            .getElementById("posts")
            .innerHTML =
                `
                <div class="sem-resultados">

                    Erro ao carregar perguntas.

                </div>
                `;

        document
            .getElementById("resultadoInfo")
            .textContent =
                "";

        return;

    }


    todosPosts = data || [];


    filtrarPosts();

}


/* ================================
   FILTRAR POSTS
================================ */

function filtrarPosts() {

    const pesquisa =
        document
            .getElementById("pesquisa")
            .value
            .trim()
            .toLowerCase();


    const postsFiltrados =
        todosPosts.filter(post => {


            /* Filtro por categoria */

            const categoriaOK =
                categoriaSelecionada ===
                "Todas"

                ||

                post.categoria ===
                categoriaSelecionada;


            if (!categoriaOK) {

                return false;

            }


            /* Se não digitou pesquisa */

            if (!pesquisa) {

                return true;

            }


            const titulo =
                post.titulo ||
                "";


            const conteudo =
                post.conteudo ||
                "";


            const nome =
                post.profiles?.nome ||
                "";


            const username =
                post.profiles?.username ||
                "";


            const texto =
                (
                    titulo +
                    " " +
                    conteudo +
                    " " +
                    nome +
                    " " +
                    username
                )
                .toLowerCase();


            return texto.includes(
                pesquisa
            );

        });


    mostrarPosts(
        postsFiltrados
    );

}


/* ================================
   SELECIONAR CATEGORIA
================================ */

function selecionarCategoria(
    categoria
) {

    categoriaSelecionada =
        categoria;


    const botoes =
        document.querySelectorAll(
            ".categoria-btn"
        );


    botoes.forEach(botao => {

        botao.classList.remove(
            "ativa"
        );


        if (
            botao.dataset.categoria ===
            categoria
        ) {

            botao.classList.add(
                "ativa"
            );

        }

    });


    filtrarPosts();

}


/* ================================
   LIMPAR FILTROS
================================ */

function limparFiltros() {

    document
        .getElementById("pesquisa")
        .value = "";


    categoriaSelecionada =
        "Todas";


    const botoes =
        document.querySelectorAll(
            ".categoria-btn"
        );


    botoes.forEach(botao => {

        botao.classList.remove(
            "ativa"
        );


        if (
            botao.dataset.categoria ===
            "Todas"
        ) {

            botao.classList.add(
                "ativa"
            );

        }

    });


    filtrarPosts();

}


/* ================================
   MOSTRAR POSTS
================================ */

function mostrarPosts(
    posts
) {

    const container =
        document.getElementById(
            "posts"
        );


    const resultadoInfo =
        document.getElementById(
            "resultadoInfo"
        );


    resultadoInfo.textContent =
        `${posts.length} pergunta${
            posts.length !== 1
                ? "s"
                : ""
        } encontrada${
            posts.length !== 1
                ? "s"
                : ""
        }`;


    if (
        !posts ||
        posts.length === 0
    ) {

        container.innerHTML = `

            <div class="sem-resultados">

                <div style="font-size:40px;">
                    🔎
                </div>

                <h3>
                    Nenhuma pergunta encontrada
                </h3>

                <p>
                    Tente outra palavra ou categoria.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    posts.forEach(post => {

        const nome =
            post.profiles?.nome ||
            "Usuário";


        const nivel =
            post.profiles?.nivel ||
            "Membro";


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "post";


        div.innerHTML = `

            <h2>

                ${escaparHTML(
                    post.titulo
                )}

            </h2>


            <div class="post-info">

                👤 ${escaparHTML(
                    nome
                )}

                · ${escaparHTML(
                    nivel
                )}

                · ${escaparHTML(
                    post.categoria
                )}

            </div>


            <p class="post-conteudo">

                ${escaparHTML(
                    post.conteudo
                )}

            </p>


            <button
                class="botao-ver"
                onclick="abrirPost('${post.id}')">

                🔎 Ver pergunta

            </button>


            <div
                class="respostas"
                id="respostas-${post.id}">

                Carregando respostas...

            </div>


            <div class="responder-area">

                <textarea
                    id="resposta-${post.id}"
                    placeholder="Escreva sua resposta...">
                </textarea>


                <button
                    onclick="responder('${post.id}')">

                    💬 Responder

                </button>

            </div>

        `;


        container.appendChild(
            div
        );


        carregarRespostas(
            post.id
        );

    });

}


/* ================================
   CARREGAR RESPOSTAS
================================ */

async function carregarRespostas(
    postId
) {

    const container =
        document.getElementById(
            `respostas-${postId}`
        );


    if (!container) {

        return;

    }


    const { data, error } =
        await window.supabaseClient

            .from("respostas")

            .select(`
                id,
                conteudo,
                created_at,
                profiles (
                    nome,
                    username
                )
            `)

            .eq(
                "post_id",
                postId
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Erro ao carregar respostas.</p>";

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        container.innerHTML = `

            <p
                style="
                    color:#8e95aa;
                "
            >

                Nenhuma resposta ainda.

            </p>

        `;

        return;

    }


    container.innerHTML = `

        <h3>

            💬 Respostas (${data.length})

        </h3>

    `;


    data.forEach(
        resposta => {

            const nome =
                resposta
                    .profiles
                    ?.nome ||
                "Usuário";


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "resposta";


            div.innerHTML = `

                <strong>

                    👤 ${escaparHTML(
                        nome
                    )}

                </strong>


                <p>

                    ${escaparHTML(
                        resposta.conteudo
                    )}

                </p>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* ================================
   RESPONDER
================================ */

async function responder(
    postId
) {

    const campo =
        document.getElementById(
            `resposta-${postId}`
        );


    if (!campo) {

        return;

    }


    const conteudo =
        campo.value.trim();


    if (!conteudo) {

        alert(
            "Escreva uma resposta."
        );

        return;

    }


    const { data: sessionData } =
        await window.supabaseClient
            .auth
            .getSession();


    const user =
        sessionData.session?.user;


    if (!user) {

        alert(
            "Você precisa estar logado."
        );

        window.location.href =
            "index.html";

        return;

    }


    const { error } =
        await window.supabaseClient

            .from("respostas")

            .insert({

                post_id:
                    postId,

                author_id:
                    user.id,

                conteudo:
                    conteudo

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao responder: " +
            error.message
        );

        return;

    }


    campo.value = "";


    alert(
        "Resposta publicada! 🎉"
    );


    carregarRespostas(
        postId
    );

}


/* ================================
   ABRIR POST
================================ */

function abrirPost(
    postId
) {

    window.location.href =
        "post.html?id=" +
        postId;

}


/* ================================
   PERFIL
================================ */

function perfil() {

    window.location.href =
        "perfil.html";

}


/* ================================
   SAIR
================================ */

async function sair() {

    await window.supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* ================================
   PROTEÇÃO CONTRA HTML
================================ */

function escaparHTML(
    texto
) {

    if (texto === null ||
        texto === undefined) {

        return "";

    }


    return String(texto)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================================
   INICIAR
================================ */

verificarLogin();

</script>

</body>

</html>
