<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comunidade - TechCommunity</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d17;
            color: white;
        }

        header {
            padding: 20px 8%;
            border-bottom: 1px solid #25283a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        main {
            width: 80%;
            max-width: 1000px;
            margin: 40px auto;
        }

        h1 {
            font-size: 36px;
        }

        .descricao {
            color: #9da3b8;
        }

        .criar-post {
            background: #171a29;
            border: 1px solid #292d42;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            margin-bottom: 15px;
            padding: 14px;
            background: #0d0f19;
            border: 1px solid #30344b;
            border-radius: 8px;
            color: white;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: #6258e8;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .post {
            background: #171a29;
            border: 1px solid #292d42;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .post h2 {
            margin-top: 0;
        }

        .post-info {
            color: #8e95aa;
            font-size: 14px;
        }

        .post-conteudo {
            color: #c8ccda;
            line-height: 1.6;
        }

        .acoes-post {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .botao-curtir {
            background: #292d42;
        }

        .botao-curtir.curtido {
            background: #6258e8;
        }

        .contador-curtidas {
            color: #9da3b8;
            font-size: 14px;
        }

        .botao-ver {
            background: #292d42;
        }

        .botao-ver:hover {
            background: #6258e8;
        }

        .respostas {
            margin-top: 25px;
            border-top: 1px solid #292d42;
            padding-top: 15px;
        }

        .resposta {
            background: #0d0f19;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #25283a;
        }

        .resposta p {
            color: #c8ccda;
            line-height: 1.5;
            margin-bottom: 0;
        }

        .responder-area {
            margin-top: 20px;
        }

        .responder-area textarea {
            min-height: 80px;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Tech<span>Community</span>
    </div>


    <div style="display: flex; gap: 10px;">

        <button onclick="perfil()">
            👤 Meu Perfil
        </button>


        <button onclick="sair()">
            Sair
        </button>

    </div>

</header>


<main>

    <h1>
        Comunidade
    </h1>


    <p class="descricao">
        Tire dúvidas, compartilhe conhecimento e ajude quem está começando.
    </p>


    <div class="criar-post">

        <h2>
            Faça uma pergunta
        </h2>


        <input
            id="titulo"
            type="text"
            placeholder="Título da sua pergunta"
        >


        <select id="categoria">

            <option value="Geral">
                Geral
            </option>

            <option value="Programação">
                Programação
            </option>

            <option value="Banco de Dados">
                Banco de Dados
            </option>

            <option value="Redes">
                Redes
            </option>

            <option value="Hardware">
                Hardware
            </option>

        </select>


        <textarea
            id="conteudo"
            placeholder="Explique sua dúvida..."
        ></textarea>


        <button onclick="criarPost()">
            Publicar pergunta
        </button>

    </div>


    <h2 style="margin-top: 50px;">
        Perguntas recentes
    </h2>


    <div id="posts">
        Carregando perguntas...
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* =================================
   USUÁRIO LOGADO
================================= */

let usuarioLogado = null;


/* =================================
   VERIFICAR LOGIN
================================= */

async function verificarLogin() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        alert("Erro ao verificar login.");

        return;
    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return;
    }


    usuarioLogado =
        data.session.user;


    carregarPosts();

}


/* =================================
   CRIAR PERGUNTA
================================= */

async function criarPost() {

    const titulo =
        document
            .getElementById("titulo")
            .value
            .trim();


    const conteudo =
        document
            .getElementById("conteudo")
            .value
            .trim();


    const categoria =
        document
            .getElementById("categoria")
            .value;


    if (!titulo || !conteudo) {

        alert(
            "Preencha o título e o conteúdo."
        );

        return;
    }


    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;
    }


    const { error } =
        await window.supabaseClient
            .from("posts")
            .insert({

                author_id:
                    usuarioLogado.id,

                titulo:
                    titulo,

                conteudo:
                    conteudo,

                categoria:
                    categoria

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao publicar: " +
            error.message
        );

        return;
    }


    alert(
        "Pergunta publicada! 🎉"
    );


    document
        .getElementById("titulo")
        .value = "";


    document
        .getElementById("conteudo")
        .value = "";


    carregarPosts();

}


/* =================================
   CARREGAR POSTS
================================= */

async function carregarPosts() {

    const { data, error } =
        await window.supabaseClient
            .from("posts")
            .select(`
                id,
                titulo,
                conteudo,
                categoria,
                created_at,
                profiles (
                    nome,
                    username,
                    nivel
                )
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        document
            .getElementById("posts")
            .innerHTML =
                "Erro ao carregar perguntas.";

        return;
    }


    const container =
        document.getElementById("posts");


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>Nenhuma pergunta ainda. Seja o primeiro a perguntar!</p>";

        return;
    }


    container.innerHTML = "";


    for (const post of data) {

        const nome =
            post.profiles?.nome ||
            "Usuário";


        const nivel =
            post.profiles?.nivel ||
            "Membro";


        const div =
            document.createElement("div");


        div.className =
            "post";


        div.innerHTML = `

            <h2>
                ${post.titulo}
            </h2>


            <div class="post-info">

                👤 ${nome}

                · ${nivel}

                · ${post.categoria}

            </div>


            <p class="post-conteudo">

                ${post.conteudo}

            </p>


            <div class="acoes-post">

                <button
                    id="curtir-${post.id}"
                    class="botao-curtir"
                    onclick="alternarCurtida('${post.id}')"
                >

                    👍 Curtir

                </button>


                <span
                    id="contador-${post.id}"
                    class="contador-curtidas"
                >

                    Carregando curtidas...

                </span>


                <button
                    class="botao-ver"
                    onclick="abrirPost('${post.id}')"
                >

                    🔎 Ver pergunta

                </button>

            </div>


            <div
                class="respostas"
                id="respostas-${post.id}"
            >

                Carregando respostas...

            </div>


            <div class="responder-area">

                <textarea
                    id="resposta-${post.id}"
                    placeholder="Escreva sua resposta..."
                ></textarea>


                <button
                    onclick="responder('${post.id}')"
                >

                    💬 Responder

                </button>

            </div>

        `;


        container.appendChild(div);


        carregarRespostas(post.id);


        carregarCurtidas(post.id);

    }

}


/* =================================
   CARREGAR CURTIDAS
================================= */

async function carregarCurtidas(postId) {

    const contador =
        document.getElementById(
            `contador-${postId}`
        );


    const botao =
        document.getElementById(
            `curtir-${postId}`
        );


    const { data, error } =
        await window.supabaseClient

            .from("curtidas")

            .select(
                "user_id"
            )

            .eq(
                "post_id",
                postId
            );


    if (error) {

        console.error(error);

        contador.textContent =
            "Erro ao carregar curtidas.";

        return;
    }


    const quantidade =
        data?.length || 0;


    contador.textContent =
        quantidade === 1
            ? "👍 1 curtida"
            : `👍 ${quantidade} curtidas`;


    const usuarioCurtiu =
        data?.some(
            curtida =>
                curtida.user_id ===
                usuarioLogado?.id
        );


    if (usuarioCurtiu) {

        botao.textContent =
            "👎 Descurtir";

        botao.classList.add(
            "curtido"
        );

    } else {

        botao.textContent =
            "👍 Curtir";

        botao.classList.remove(
            "curtido"
        );

    }

}


/* =================================
   CURTIR / DESCURTIR
================================= */

async function alternarCurtida(postId) {

    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;
    }


    const { data, error } =
        await window.supabaseClient

            .from("curtidas")

            .select("id")

            .eq(
                "post_id",
                postId
            )

            .eq(
                "user_id",
                usuarioLogado.id
            );


    if (error) {

        console.error(error);

        alert(
            "Erro ao verificar curtida: " +
            error.message
        );

        return;
    }


    if (data && data.length > 0) {

        const { error: deleteError } =
            await window.supabaseClient

                .from("curtidas")

                .delete()

                .eq(
                    "id",
                    data[0].id
                );


        if (deleteError) {

            console.error(
                deleteError
            );

            alert(
                "Erro ao remover curtida: " +
                deleteError.message
            );

            return;
        }


    } else {

        const { error: insertError } =
            await window.supabaseClient

                .from("curtidas")

                .insert({

                    post_id:
                        postId,

                    user_id:
                        usuarioLogado.id

                });


        if (insertError) {

            console.error(
                insertError
            );

            alert(
                "Erro ao curtir: " +
                insertError.message
            );

            return;
        }

    }


    carregarCurtidas(postId);

}


/* =================================
   CARREGAR RESPOSTAS
================================= */

async function carregarRespostas(postId) {

    const container =
        document.getElementById(
            `respostas-${postId}`
        );


    if (!container) {

        return;
    }


    const { data, error } =
        await window.supabaseClient

            .from("respostas")

            .select(`
                id,
                conteudo,
                created_at,
                profiles (
                    nome,
                    username
                )
            `)

            .eq(
                "post_id",
                postId
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Erro ao carregar respostas.</p>";

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p style='color:#8e95aa;'>Nenhuma resposta ainda.</p>";

        return;
    }


    container.innerHTML = `

        <h3>
            💬 Respostas (${data.length})
        </h3>

    `;


    data.forEach(
        resposta => {

            const nome =
                resposta
                    .profiles
                    ?.nome ||
                "Usuário";


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "resposta";


            div.innerHTML = `

                <strong>
                    👤 ${nome}
                </strong>


                <p>
                    ${resposta.conteudo}
                </p>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =================================
   RESPONDER
================================= */

async function responder(postId) {

    const campo =
        document.getElementById(
            `resposta-${postId}`
        );


    if (!campo) {

        return;
    }


    const conteudo =
        campo.value.trim();


    if (!conteudo) {

        alert(
            "Escreva uma resposta."
        );

        return;
    }


    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;
    }


    const { error } =
        await window.supabaseClient

            .from("respostas")

            .insert({

                post_id:
                    postId,

                author_id:
                    usuarioLogado.id,

                conteudo:
                    conteudo

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao responder: " +
            error.message
        );

        return;
    }


    campo.value = "";


    alert(
        "Resposta publicada! 🎉"
    );


    carregarRespostas(
        postId
    );

}


/* =================================
   ABRIR PERGUNTA
================================= */

function abrirPost(postId) {

    window.location.href =
        "post.html?id=" +
        postId;

}


/* =================================
   PERFIL
================================= */

function perfil() {

    window.location.href =
        "perfil.html";

}


/* =================================
   SAIR
================================= */

async function sair() {

    await window.supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* =================================
   INICIAR
================================= */

verificarLogin();

</script>


</body>

</html>
