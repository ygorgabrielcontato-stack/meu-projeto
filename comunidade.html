<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comunidade - TechCommunity</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #171934 0%,
            #0b0d17 35%
        );

    color: white;

}


/* =========================
   HEADER
========================= */

header {

    height: 70px;

    padding: 0 7%;

    border-bottom: 1px solid #25283a;

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: rgba(11,13,23,0.92);

    backdrop-filter: blur(12px);

    position: sticky;

    top: 0;

    z-index: 100;

}


.logo {

    font-size: 24px;

    font-weight: bold;

    letter-spacing: -0.5px;

}


.logo span {

    color: #6c63ff;

}


.header-botoes {

    display: flex;

    gap: 9px;

    align-items: center;

}


button {

    border: none;

    cursor: pointer;

    font-weight: bold;

    transition:
        transform .15s ease,
        background .15s ease,
        opacity .15s ease;

}


button:hover {

    transform: translateY(-1px);

}


.btn-header {

    background: #171a29;

    color: white;

    border: 1px solid #292d42;

    padding: 10px 15px;

    border-radius: 10px;

}


.btn-header:hover {

    background: #25283a;

}


.btn-sair {

    background: #292d42;

}


/* =========================
   BARRA DE NÍVEL
========================= */

.nivel-area {

    width: 100%;

    background:
        linear-gradient(
            180deg,
            rgba(17,20,33,.98),
            rgba(11,13,23,.98)
        );

    border-bottom: 1px solid #25283a;

    padding: 12px 7%;

}


.nivel-container {

    max-width: 900px;

    margin: 0 auto;

    display: flex;

    align-items: center;

    gap: 14px;

}


.nivel-icone {

    width: 40px;

    height: 40px;

    border-radius: 11px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(98,88,232,.16);

    border: 1px solid rgba(98,88,232,.35);

    font-size: 20px;

    flex-shrink: 0;

}


.nivel-informacoes {

    flex: 1;

    min-width: 0;

}


.nivel-topo {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 7px;

}


.nivel-texto {

    font-size: 13px;

    font-weight: bold;

    color: #e4e6ef;

}


.nivel-xp {

    font-size: 11px;

    color: #8e95aa;

    white-space: nowrap;

}


.barra-nivel {

    width: 100%;

    height: 8px;

    background: #292d42;

    border-radius: 20px;

    overflow: hidden;

}


.progresso-nivel {

    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            #6258e8,
            #8a80ff
        );

    border-radius: 20px;

    transition: width .5s ease;

}


.nivel-percentual {

    font-size: 11px;

    color: #aaa5ff;

    min-width: 35px;

    text-align: right;

}


/* =========================
   NOTIFICAÇÕES
========================= */

.btn-notificacoes {

    position: relative;

    background: #171a29;

    border: 1px solid #292d42;

    color: white;

    width: 43px;

    height: 43px;

    border-radius: 12px;

    font-size: 19px;

}


.badge-notificacao {

    position: absolute;

    top: -5px;

    right: -5px;

    min-width: 18px;

    height: 18px;

    padding: 0 5px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #ff3b6b;

    color: white;

    border-radius: 20px;

    font-size: 10px;

    border: 2px solid #0b0d17;

}


/* =========================
   MAIN
========================= */

main {

    width: 92%;

    max-width: 900px;

    margin: 42px auto 80px;

}


.titulo-area {

    margin-bottom: 30px;

}


h1 {

    font-size: 38px;

    margin: 0 0 8px;

}


.descricao {

    color: #9da3b8;

    margin: 0;

    line-height: 1.6;

}


/* =========================
   CRIAR POST
========================= */

.criar-post {

    background:

        linear-gradient(
            145deg,
            #181b2c,
            #131625
        );

    border: 1px solid #292d42;

    padding: 26px;

    border-radius: 20px;

    margin-bottom: 28px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.18);

}


.criar-post h2 {

    margin-top: 0;

    margin-bottom: 18px;

}


input,
textarea,
select {

    width: 100%;

    margin-top: 9px;

    margin-bottom: 15px;

    padding: 14px 15px;

    background: #0d0f19;

    border: 1px solid #30344b;

    border-radius: 10px;

    color: white;

    font-family: Arial, sans-serif;

    outline: none;

    transition:
        border-color .2s,
        box-shadow .2s;

}


input:focus,
textarea:focus,
select:focus {

    border-color: #6258e8;

    box-shadow:
        0 0 0 3px rgba(98,88,232,.12);

}


textarea {

    min-height: 120px;

    resize: vertical;

}


.btn-publicar {

    background:
        linear-gradient(
            135deg,
            #6258e8,
            #796ff5
        );

    color: white;

    padding: 12px 20px;

    border-radius: 10px;

    box-shadow:
        0 8px 20px rgba(98,88,232,.18);

}


.btn-publicar:hover {

    filter: brightness(1.08);

}


/* =========================
   FILTROS
========================= */

.filtros {

    background: #171a29;

    border: 1px solid #292d42;

    border-radius: 18px;

    padding: 21px;

}


.filtros h2 {

    margin-top: 0;

}


.pesquisa-area {

    display: flex;

    gap: 10px;

}


.pesquisa-area input {

    margin: 0;

    flex: 1;

}


.btn-limpar {

    background: #292d42;

    color: white;

    padding: 0 17px;

    border-radius: 10px;

}


.categorias {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 14px;

}


.categoria-btn {

    background: #292d42;

    color: #c8ccda;

    padding: 9px 13px;

    border-radius: 20px;

    border: 1px solid #363b54;

    font-size: 13px;

}


.categoria-btn:hover {

    background: #6258e8;

    color: white;

}


.categoria-btn.ativa {

    background: #6258e8;

    color: white;

    border-color: #6258e8;

}


/* =========================
   PERGUNTAS
========================= */

.titulo-perguntas {

    margin-top: 42px;

    margin-bottom: 8px;

}


.resultado-info {

    color: #8e95aa;

    font-size: 14px;

    margin-bottom: 15px;

}


.post {

    background:
        linear-gradient(
            145deg,
            #171a29,
            #121522
        );

    border: 1px solid #292d42;

    padding: 24px;

    border-radius: 18px;

    margin-top: 18px;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

}


.post:hover {

    transform: translateY(-2px);

    border-color: #3d4260;

    box-shadow:
        0 12px 35px rgba(0,0,0,.16);

}


.post h2 {

    margin: 0 0 11px;

    font-size: 21px;

    line-height: 1.4;

}


.post-info {

    color: #8e95aa;

    font-size: 13px;

    margin-bottom: 17px;

}


.post-conteudo {

    color: #c8ccda;

    line-height: 1.7;

    white-space: pre-wrap;

}


/* =========================
   CATEGORIA DO POST
========================= */

.tag-categoria {

    display: inline-block;

    padding: 5px 9px;

    border-radius: 15px;

    background: #252940;

    color: #aaa5ff;

    font-size: 11px;

    margin-bottom: 12px;

}


/* =========================
   AÇÕES DO POST
========================= */

.acoes-post {

    display: flex;

    align-items: center;

    gap: 17px;

    border-top: 1px solid #25283a;

    padding-top: 15px;

    margin-top: 18px;

}


.acao {

    display: flex;

    align-items: center;

    gap: 6px;

}


.botao-coracao {

    background: transparent;

    color: #9da3b8;

    font-size: 28px;

    padding: 0 3px;

    line-height: 1;

}


.botao-coracao:hover {

    background: transparent;

    transform: scale(1.12);

}


.botao-coracao.curtido {

    color: #ff3b6b;

    animation: coracao .28s ease;

}


.contador-curtidas {

    color: #aeb3c4;

    font-size: 13px;

}


@keyframes coracao {

    0% {
        transform: scale(1);
    }

    40% {
        transform: scale(1.35);
    }

    70% {
        transform: scale(.9);
    }

    100% {
        transform: scale(1);
    }

}


.botao-ver {

    margin-left: auto;

    background: #292d42;

    color: white;

    padding: 9px 14px;

    border-radius: 9px;

}


.botao-ver:hover {

    background: #6258e8;

}


/* =========================
   RESPOSTAS
========================= */

.respostas {

    margin-top: 22px;

    border-top: 1px solid #25283a;

    padding-top: 18px;

}


.respostas h3 {

    font-size: 16px;

    color: #d4d7e2;

    margin-bottom: 12px;

}


.resposta {

    background: #0d0f19;

    padding: 16px;

    border-radius: 12px;

    margin-top: 10px;

    border: 1px solid #25283a;

    transition: border-color .2s;

}


.resposta:hover {

    border-color: #363b54;

}


.resposta-topo {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

}


.autor-resposta {

    font-weight: bold;

    color: #f0f1f6;

}


.tipo-professor {

    display: inline-block;

    margin-left: 6px;

    background: #6258e8;

    color: white;

    padding: 4px 8px;

    border-radius: 12px;

    font-size: 10px;

}


.tipo-aluno {

    display: inline-block;

    margin-left: 6px;

    background: #292d42;

    color: #b9bdca;

    border: 1px solid #3a3f56;

    padding: 4px 8px;

    border-radius: 12px;

    font-size: 10px;

}


/* =========================
   CURTIDA DA RESPOSTA
========================= */

.acoes-resposta {

    display: flex;

    align-items: center;

}


.curtir-resposta {

    background: transparent;

    color: #8e95aa;

    padding: 3px 5px;

    font-size: 15px;

    display: flex;

    align-items: center;

    gap: 4px;

}


.curtir-resposta:hover {

    background: transparent;

}


.coracao-resposta {

    font-size: 22px;

    line-height: 1;

}


.curtir-resposta.curtido {

    color: #ff3b6b;

    animation: coracao .28s ease;

}


.contador-resposta {

    font-size: 12px;

    color: #8e95aa;

}


.resposta p {

    color: #c8ccda;

    line-height: 1.6;

    margin-bottom: 0;

    white-space: pre-wrap;

}


/* =========================
   RESPONDER
========================= */

.responder-area {

    margin-top: 18px;

}


.responder-area textarea {

    min-height: 80px;

}


.btn-responder {

    background: #292d42;

    color: white;

    padding: 10px 16px;

    border-radius: 9px;

}


.btn-responder:hover {

    background: #6258e8;

}


/* =========================
   ESTADOS
========================= */

.sem-resultados {

    background: #171a29;

    border: 1px solid #292d42;

    border-radius: 15px;

    padding: 35px;

    text-align: center;

    color: #9da3b8;

    margin-top: 20px;

}


.carregando {

    text-align: center;

    color: #9da3b8;

    padding: 40px;

}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 650px) {

    header {

        padding: 0 5%;

    }


    .logo {

        font-size: 19px;

    }


    .btn-header {

        padding: 8px 10px;

    }


    .btn-sair {

        display: none;

    }


    main {

        width: 94%;

        margin-top: 25px;

    }


    h1 {

        font-size: 30px;

    }


    .pesquisa-area {

        flex-direction: column;

    }


    .btn-limpar {

        padding: 11px;

    }


    .post {

        padding: 19px;

    }


    .acoes-post {

        gap: 10px;

    }


    .nivel-area {

        padding: 10px 5%;

    }


    .nivel-container {

        gap: 9px;

    }


    .nivel-icone {

        width: 35px;

        height: 35px;

        font-size: 17px;

    }


    .nivel-percentual {

        display: none;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        Tech<span>Community</span>

    </div>


    <div class="header-botoes">


        <button
            class="btn-notificacoes"
            onclick="notificacoes()"
            title="Notificações">

            🔔

            <span
                id="badgeNotificacao"
                class="badge-notificacao"
                style="display:none;">
                0
            </span>

        </button>


        <button
            class="btn-header"
            onclick="perfil()">

            👤 Meu Perfil

        </button>


        <button
            class="btn-header btn-sair"
            onclick="sair()">

            Sair

        </button>


    </div>

</header>


<!-- =========================
     BARRA DE NÍVEL
========================= -->

<div class="nivel-area">

    <div class="nivel-container">

        <div class="nivel-icone">

            🏆

        </div>


        <div class="nivel-informacoes">

            <div class="nivel-topo">

                <span
                    id="nivelTexto"
                    class="nivel-texto">

                    Nível 1

                </span>


                <span
                    id="nivelXP"
                    class="nivel-xp">

                    0 / 100 XP

                </span>

            </div>


            <div class="barra-nivel">

                <div
                    id="progressoNivel"
                    class="progresso-nivel">

                </div>

            </div>

        </div>


        <div
            id="nivelPercentual"
            class="nivel-percentual">

            0%

        </div>

    </div>

</div>


<main>


<div class="titulo-area">

    <h1>
        Comunidade
    </h1>

    <p class="descricao">
        Tire dúvidas, compartilhe conhecimento e ajude quem está começando.
    </p>

</div>


<!-- =========================
     CRIAR PERGUNTA
========================= -->

<div class="criar-post">

    <h2>
        Faça uma pergunta
    </h2>


    <input
        id="titulo"
        type="text"
        placeholder="Título da sua pergunta">


    <select id="categoria">

        <option value="Geral">
            Geral
        </option>

        <option value="Programação">
            Programação
        </option>

        <option value="Banco de Dados">
            Banco de Dados
        </option>

        <option value="Redes">
            Redes
        </option>

        <option value="Hardware">
            Hardware
        </option>

    </select>


    <textarea
        id="conteudo"
        placeholder="Explique sua dúvida..."></textarea>


    <button
        class="btn-publicar"
        onclick="criarPost()">

        🚀 Publicar pergunta

    </button>

</div>


<!-- =========================
     FILTROS
========================= -->

<div class="filtros">

    <h2>
        🔎 Encontrar perguntas
    </h2>


    <div class="pesquisa-area">

        <input
            id="pesquisa"
            type="text"
            placeholder="Pesquisar por pergunta, conteúdo ou usuário..."
            oninput="filtrarPosts">


        <button
            class="btn-limpar"
            onclick="limparFiltros()">

            Limpar

        </button>

    </div>


    <div class="categorias">

        <button
            class="categoria-btn ativa"
            data-categoria="Todas"
            onclick="selecionarCategoria('Todas')">

            Todas

        </button>


        <button
            class="categoria-btn"
            data-categoria="Geral"
            onclick="selecionarCategoria('Geral')">

            Geral

        </button>


        <button
            class="categoria-btn"
            data-categoria="Programação"
            onclick="selecionarCategoria('Programação')">

            💻 Programação

        </button>


        <button
            class="categoria-btn"
            data-categoria="Banco de Dados"
            onclick="selecionarCategoria('Banco de Dados')">

            🗄️ Banco de Dados

        </button>


        <button
            class="categoria-btn"
            data-categoria="Redes"
            onclick="selecionarCategoria('Redes')">

            🌐 Redes

        </button>


        <button
            class="categoria-btn"
            data-categoria="Hardware"
            onclick="selecionarCategoria('Hardware')">

            🖥️ Hardware

        </button>

    </div>

</div>


<h2 class="titulo-perguntas">
    Perguntas recentes
</h2>


<div
    id="resultadoInfo"
    class="resultado-info">

    Carregando perguntas...

</div>


<div id="posts">

    <div class="carregando">
        Carregando perguntas...
    </div>

</div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* ================================
   VARIÁVEIS
================================ */

let todosPosts = [];

let categoriaSelecionada = "Todas";

let usuarioLogado = null;


/* ================================
   LOGIN
================================ */

async function verificarLogin() {

    const { data, error } =
        await window.supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(error);

        alert(
            "Erro ao verificar login."
        );

        return;

    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return;

    }


    usuarioLogado =
        data.session.user;


    carregarPosts();

    carregarContadorNotificacoes();

    carregarNivel();

}


/* ================================
   CARREGAR NÍVEL
================================ */

async function carregarNivel() {

    if (!usuarioLogado) {

        return;

    }


    const { data, error } =
        await window.supabaseClient

            .from("profiles")

            .select(`
                xp,
                nivel
            `)

            .eq(
                "id",
                usuarioLogado.id
            )

            .single();


    if (error) {

        console.error(
            "Erro ao carregar nível:",
            error
        );

        return;

    }


    const xp =
        Number(data?.xp || 0);


    let nivel =
        Number(data?.nivel || 1);


    if (isNaN(nivel) || nivel < 1) {

        nivel = 1;

    }


    /*
       Cada nível possui 100 XP.

       Exemplo:

       Nível 1 = 0 até 99 XP
       Nível 2 = 100 até 199 XP
       Nível 3 = 200 até 299 XP
    */


    const xpNoNivel =
        xp % 100;


    const progresso =
        xpNoNivel;


    const proximoNivelXP =
        100;


    const nivelTexto =
        document.getElementById(
            "nivelTexto"
        );


    const nivelXP =
        document.getElementById(
            "nivelXP"
        );


    const progressoNivel =
        document.getElementById(
            "progressoNivel"
        );


    const nivelPercentual =
        document.getElementById(
            "nivelPercentual"
        );


    if (nivelTexto) {

        nivelTexto.textContent =
            `🏆 Nível ${nivel}`;

    }


    if (nivelXP) {

        nivelXP.textContent =
            `${xpNoNivel} / ${proximoNivelXP} XP`;

    }


    if (progressoNivel) {

        progressoNivel.style.width =
            `${progresso}%`;

    }


    if (nivelPercentual) {

        nivelPercentual.textContent =
            `${progresso}%`;

    }

}


/* ================================
   CRIAR PERGUNTA
================================ */

async function criarPost() {

    const titulo =
        document
            .getElementById("titulo")
            .value
            .trim();


    const conteudo =
        document
            .getElementById("conteudo")
            .value
            .trim();


    const categoria =
        document
            .getElementById("categoria")
            .value;


    if (!titulo || !conteudo) {

        alert(
            "Preencha o título e o conteúdo."
        );

        return;

    }


    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;

    }


    const { error } =
        await window.supabaseClient

            .from("posts")

            .insert({

                author_id:
                    usuarioLogado.id,

                titulo:
                    titulo,

                conteudo:
                    conteudo,

                categoria:
                    categoria

            });


    if (error) {

        console.error(error);

        alert(
            "Erro ao publicar: " +
            error.message
        );

        return;

    }


    document
        .getElementById("titulo")
        .value = "";


    document
        .getElementById("conteudo")
        .value = "";


    alert(
        "Pergunta publicada! 🎉"
    );


    carregarPosts();

}


/* ================================
   CARREGAR POSTS
================================ */

async function carregarPosts() {

    const { data, error } =
        await window.supabaseClient

            .from("posts")

            .select(`
                id,
                titulo,
                conteudo,
                categoria,
                created_at,
                profiles (
                    nome,
                    username,
                    nivel,
                    tipo_conta
                )
            `)

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        document
            .getElementById("posts")
            .innerHTML = `

                <div class="sem-resultados">

                    Erro ao carregar perguntas.

                </div>

            `;

        return;

    }


    todosPosts =
        data || [];


    filtrarPosts();

}


/* ================================
   FILTRAR
================================ */

function filtrarPosts() {

    const pesquisa =
        document
            .getElementById("pesquisa")
            .value
            .trim()
            .toLowerCase();


    const postsFiltrados =
        todosPosts.filter(post => {


            const categoriaOK =
                categoriaSelecionada ===
                "Todas"

                ||

                post.categoria ===
                categoriaSelecionada;


            if (!categoriaOK) {

                return false;

            }


            if (!pesquisa) {

                return true;

            }


            const texto = (

                (post.titulo || "") +
                " " +
                (post.conteudo || "") +
                " " +
                (post.profiles?.nome || "") +
                " " +
                (post.profiles?.username || "")

            ).toLowerCase();


            return texto.includes(
                pesquisa
            );

        });


    mostrarPosts(
        postsFiltrados
    );

}

function selecionarCategoria(

        .forEach(botao => {

                botao.dataset.categoria ===

            ) {

                botao.classList.add(
                    "ativa"
                );

            }

        });


    filtrarPosts();

}

/* ================================
   CURTIDAS DAS PERGUNTAS
================================ */

async function carregarCurtidas(
    postId
) {

    const contador =
        document.getElementById(
            `contador-${postId}`
        );


    const botao =
        document.getElementById(
            `curtir-${postId}`
        );


    if (!contador || !botao) {

        return;

    }


    const { data, error } =
        await window.supabaseClient

            .from("curtidas")

            .select("user_id")

            .eq(
                "post_id",
                postId
            );


    if (error) {

        console.error(
            "Erro ao carregar curtidas:",
            error
        );

        return;

    }


    const quantidade =
        data?.length || 0;


    contador.textContent =
        quantidade === 1
            ? "1 curtida"
            : `${quantidade} curtidas`;


    const usuarioCurtiu =
        data?.some(
            curtida =>
                curtida.user_id ===
                usuarioLogado?.id
        );


    if (usuarioCurtiu) {

        botao.textContent =
            "♥";

        botao.classList.add(
            "curtido"
        );

    } else {

        botao.textContent =
            "♡";

        botao.classList.remove(
            "curtido"
        );

    }

}


/* ================================
   CURTIR PERGUNTA
================================ */

async function alternarCurtida(
    postId
) {

    if (!usuarioLogado) {

        alert(
            "Você precisa estar logado."
        );

        return;

    }


    const botao =
        document.getElementById(
            `curtir-${postId}`
        );


    if (!botao) {

        return;

    }


    const jaCurtiu =
        botao.classList.contains(
            "curtido"
        );


    if (jaCurtiu) {

        const { error } =
            await window.supabaseClient

                .from("curtidas")

                .delete()

                .eq(
                    "post_id",
                    postId
                )

                .eq(
                    "user_id",
                    usuarioLogado.id
                );


        if (error) {

            console.error(error);

            alert(
                "Erro ao remover curtida: " +
                error.message
            );

            return;

        }

    } else {

        const { error } =
            await window.supabaseClient

                .from("curtidas")

                .insert({

                    post_id:
                        postId,

                    user_id:
                        usuarioLogado.id

                });


        if (error) {

            console.error(error);

            alert(
                "Erro ao curtir: " +
                error.message
            );

            return;

        }

    }


    carregarCurtidas(
        postId
    );

}


/* ================================
   CARREGAR RESPOSTAS
================================ */

async function carregarRespostas(
    postId
) {

    const container =
        document.getElementById(
            `respostas-${postId}`
        );


    if (!container) {

        return;

    }


    const { data, error } =
        await window.supabaseClient

            .from("respostas")

            .select(`
                id,
                conteudo,
                created_at,
                profiles (
                    nome,
                    username,
                    nivel,
                    tipo_conta
                )
            `)

            .eq(
                "post_id",
                postId
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML = `

            <p style="color:#8e95aa;">
                Erro ao carregar respostas.
            </p>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        container.innerHTML = `

            <p style="color:#8e95aa;">

                Nenhuma resposta ainda.

            </p>

        `;

        return;

    }


    container.innerHTML = `

        <h3>
            💬 Respostas (${data.length})
        </h3>

    `;


    data.forEach(
        resposta => {

            const nome =
                resposta.profiles?.nome ||
                "Usuário";


            const nivel =
                resposta.profiles?.nivel ||
                "Membro";


            const tipoConta =
                resposta.profiles?.tipo_conta ||
                "Aluno";


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "resposta";


            const professor =
                tipoConta
                    .toLowerCase()
                    .includes(
                        "professor"
                    );


            div.innerHTML = `

                <div class="resposta-topo">

                    <div>

                        <span class="autor-resposta">

                            👤 ${escaparHTML(nome)}

                        </span>


                        ${
                            professor

                            ?

                            `<span class="tipo-professor">
                                👨‍🏫 Professor
                            </span>`

                            :

                            `<span class="tipo-aluno">
                                🎓 Aluno
                            </span>`
                        }

                    </div>


                    <div class="acoes-resposta">

                        <button
                            id="curtir-resposta-${resposta.id}"
                            class="curtir-resposta"
                            onclick="alternarCurtidaResposta('${resposta.id}')">

                            <span
                                id="coracao-resposta-${resposta.id}"
                                class="coracao-resposta">

                                ♡

                            </span>


                            <span
                                id="contador-resposta-${resposta.id}"
                                class="contador-resposta">

                                0

                            </span>

                        </button>

                    </div>

                </div>


                <div class="post-info">

                    ${escaparHTML(nivel)}

                    · ${escaparHTML(tipoConta)}

                </div>


                <p>

                    ${escaparHTML(
                        resposta.conteudo
                    )}

                </p>

            `;


            container.appendChild(
                div
            );


            carregarCurtidasResposta(
                resposta.id
            );

        }
    );

}

/* ================================
   PROTEÇÃO HTML
================================ */

function escaparHTML(
    texto
) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
