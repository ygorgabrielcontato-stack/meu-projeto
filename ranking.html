<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ranking - TechCommunity</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #1b1d3a 0%,
            #0b0d17 48%
        );

    color: white;

}


/* =================================
   HEADER
================================= */

header {

    height: 70px;

    padding: 0 7%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom: 1px solid #25283a;

    background: rgba(11,13,23,.92);

    backdrop-filter: blur(12px);

    position: sticky;

    top: 0;

    z-index: 10;

}


.logo {

    font-size: 24px;

    font-weight: bold;

}


.logo span {

    color: #6c63ff;

}


.header-botoes {

    display: flex;

    gap: 10px;

}


button {

    border: none;

    cursor: pointer;

    font-weight: bold;

    transition: .2s;

}


.btn-header {

    background: #171a29;

    color: white;

    border: 1px solid #292d42;

    padding: 10px 16px;

    border-radius: 9px;

}


.btn-header:hover {

    background: #25283a;

    transform: translateY(-1px);

}


/* =================================
   MAIN
================================= */

main {

    width: 92%;

    max-width: 950px;

    margin: 45px auto 80px;

}


.titulo {

    text-align: center;

    margin-bottom: 35px;

}


.titulo h1 {

    font-size: 38px;

    margin: 0 0 10px;

}


.titulo p {

    color: #9da3b8;

}


/* =================================
   MEU XP
================================= */

.meu-xp {

    background:
        linear-gradient(
            145deg,
            #1c1f35,
            #111421
        );

    border: 1px solid #292d42;

    border-radius: 20px;

    padding: 25px;

    margin-bottom: 35px;

}


.meu-xp-topo {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;

}


.meu-xp h2 {

    margin: 0;

}


.nivel {

    background: #6258e8;

    padding: 7px 13px;

    border-radius: 20px;

    font-size: 13px;

    font-weight: bold;

}


.xp-info {

    display: flex;

    justify-content: space-between;

    color: #9da3b8;

    font-size: 14px;

    margin-bottom: 8px;

}


.barra {

    width: 100%;

    height: 12px;

    background: #292d42;

    border-radius: 20px;

    overflow: hidden;

}


.barra-progresso {

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #6258e8,
            #9a70ff
        );

    border-radius: 20px;

    transition: width .6s ease;

}


/* =================================
   RANKING
================================= */

.lista-ranking {

    display: flex;

    flex-direction: column;

    gap: 12px;

}


.jogador {

    display: flex;

    align-items: center;

    gap: 18px;

    background: #111421;

    border: 1px solid #292d42;

    padding: 18px;

    border-radius: 16px;

    transition: .2s;

}


.jogador:hover {

    transform: translateY(-2px);

    border-color: #464b6d;

}


.jogador.top1 {

    border-color: #d5b94c;

}


.jogador.top2 {

    border-color: #9da3b8;

}


.jogador.top3 {

    border-color: #a96d43;

}


.posicao {

    width: 45px;

    text-align: center;

    font-size: 22px;

    font-weight: bold;

}


.avatar {

    width: 55px;

    height: 55px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid #6258e8;

}


.usuario {

    flex: 1;

}


.usuario-nome {

    font-size: 17px;

    font-weight: bold;

}


.usuario-nick {

    color: #777e94;

    font-size: 13px;

    margin-top: 4px;

}


.usuario-nivel {

    color: #aaa5ff;

    font-size: 13px;

    margin-top: 5px;

}


.xp-total {

    text-align: right;

}


.xp-numero {

    font-size: 18px;

    font-weight: bold;

}


.xp-label {

    color: #777e94;

    font-size: 12px;

}


/* =================================
   VAZIO
================================= */

.vazio {

    text-align: center;

    padding: 50px;

    color: #8e95aa;

    background: #111421;

    border: 1px solid #292d42;

    border-radius: 16px;

}


/* =================================
   RESPONSIVO
================================= */

@media(max-width:650px) {

    header {

        padding: 0 5%;

    }

    .logo {

        font-size: 20px;

    }

    main {

        width: 94%;

        margin-top: 30px;

    }

    .titulo h1 {

        font-size: 30px;

    }

    .jogador {

        gap: 10px;

        padding: 14px;

    }

    .avatar {

        width: 45px;

        height: 45px;

    }

    .xp-numero {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        Tech<span>Community</span>

    </div>


    <div class="header-botoes">

        <button
            class="btn-header"
            onclick="comunidade()">

            ← Comunidade

        </button>


        <button
            class="btn-header"
            onclick="perfil()">

            👤 Perfil

        </button>

    </div>

</header>


<main>


    <div class="titulo">

        <h1>
            🏆 Ranking da Comunidade
        </h1>

        <p>
            Veja quem está se destacando na comunidade.
        </p>

    </div>


    <!-- =================================
         MEU XP
    ================================= -->

    <div class="meu-xp">

        <div class="meu-xp-topo">

            <h2>
                ⭐ Meu progresso
            </h2>

            <span
                id="meuNivel"
                class="nivel">

                Nível 1

            </span>

        </div>


        <div class="xp-info">

            <span id="xpAtual">
                0 XP
            </span>

            <span id="xpProximo">
                250 XP
            </span>

        </div>


        <div class="barra">

            <div
                id="barraProgresso"
                class="barra-progresso"
                style="width:0%">
            </div>

        </div>

    </div>


    <h2>
        🏅 Ranking
    </h2>


    <div
        id="listaRanking"
        class="lista-ranking">

        <div class="vazio">
            Carregando ranking...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

/* =================================
   NÍVEIS
================================= */

const niveis = [

    { nivel: 1, xp: 0 },

    { nivel: 2, xp: 250 },

    { nivel: 3, xp: 500 },

    { nivel: 4, xp: 1000 },

    { nivel: 5, xp: 1500 },

    { nivel: 6, xp: 2500 },

    { nivel: 7, xp: 3500 },

    { nivel: 8, xp: 5000 },

    { nivel: 9, xp: 7500 },

    { nivel: 10, xp: 10000 }

];


/* =================================
   LOGIN
================================= */

async function iniciar() {

    const { data, error } =
        await window.supabaseClient
        .auth
        .getSession();


    if (error) {

        console.error(error);

        return;

    }


    if (!data.session) {

        window.location.href =
            "index.html";

        return;

    }


    carregarMeuXP(
        data.session.user.id
    );


    carregarRanking();

}


/* =================================
   MEU XP
================================= */

async function carregarMeuXP(userId) {

    const { data, error } =
        await window.supabaseClient

        .from("profiles")

        .select(`
            xp,
            nivel_numero
        `)

        .eq(
            "id",
            userId
        )

        .single();


    if (error) {

        console.error(error);

        return;

    }


    const xp =
        data.xp || 0;


    const nivel =
        data.nivel_numero || 1;


    const atual =
        niveis.find(
            n => n.nivel === nivel
        );


    const proximo =
        niveis.find(
            n => n.nivel === nivel + 1
        );


    document
        .getElementById("meuNivel")
        .textContent =
        `Nível ${nivel}`;


    if (!proximo) {

        document
            .getElementById("xpAtual")
            .textContent =
            `${xp} XP`;

        document
            .getElementById("xpProximo")
            .textContent =
            "NÍVEL MÁXIMO";

        document
            .getElementById("barraProgresso")
            .style.width =
            "100%";

        return;

    }


    const xpInicio =
        atual.xp;


    const xpFim =
        proximo.xp;


    const progresso =
        Math.min(
            100,
            Math.max(
                0,
                ((xp - xpInicio) /
                (xpFim - xpInicio)) *
                100
            )
        );


    document
        .getElementById("xpAtual")
        .textContent =
        `${xp} XP`;


    document
        .getElementById("xpProximo")
        .textContent =
        `${xpFim} XP`;


    document
        .getElementById("barraProgresso")
        .style.width =
        `${progresso}%`;

}


/* =================================
   RANKING
================================= */

async function carregarRanking() {

    const { data, error } =
        await window.supabaseClient

        .from("profiles")

        .select(`
            id,
            nome,
            username,
            xp,
            nivel_numero,
            avatar_url
        `)

        .order(
            "xp",
            {
                ascending: false
            }
        );


    const container =
        document.getElementById(
            "listaRanking"
        );


    if (error) {

        console.error(error);

        container.innerHTML = `

            <div class="vazio">

                Erro ao carregar ranking.

            </div>

        `;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `

            <div class="vazio">

                Nenhum usuário encontrado.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    data.forEach(
        (usuario, index) => {


        const posicao =
            index + 1;


        let medalha =
            posicao;


        if (posicao === 1)
            medalha = "🥇";

        if (posicao === 2)
            medalha = "🥈";

        if (posicao === 3)
            medalha = "🥉";


        const classe =
            posicao === 1
                ? "top1"
                : posicao === 2
                ? "top2"
                : posicao === 3
                ? "top3"
                : "";


        const nome =
            escaparHTML(
                usuario.nome ||
                "Usuário"
            );


        const username =
            escaparHTML(
                usuario.username ||
                "usuario"
            );


        const avatar =
            usuario.avatar_url ||

            "https://ui-avatars.com/api/?name=" +

            encodeURIComponent(
                usuario.nome ||
                "Usuário"
            ) +

            "&background=6258e8&color=fff";


        const div =
            document.createElement(
                "div"
            );


        div.className =
            `jogador ${classe}`;


        div.innerHTML = `

            <div class="posicao">

                ${medalha}

            </div>


            <img
                class="avatar"
                src="${avatar}"
                alt="Foto"
            >


            <div class="usuario">

                <div class="usuario-nome">

                    ${nome}

                </div>


                <div class="usuario-nick">

                    @${username}

                </div>


                <div class="usuario-nivel">

                    ⭐ Nível
                    ${usuario.nivel_numero || 1}

                </div>

            </div>


            <div class="xp-total">

                <div class="xp-numero">

                    ${usuario.xp || 0}

                </div>

                <div class="xp-label">

                    XP

                </div>

            </div>

        `;


        container.appendChild(
            div
        );

    });

}


/* =================================
   SEGURANÇA
================================= */

function escaparHTML(texto) {

    return String(texto || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =================================
   NAVEGAÇÃO
================================= */

function comunidade() {

    window.location.href =
        "comunidade.html";

}


function perfil() {

    window.location.href =
        "perfil.html";

}


/* =================================
   INICIAR
================================= */

iniciar();

</script>

</body>

</html>
